<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Core Insight</title>
    <style>
        :root {
            --primary-dark: #0f172a;
            --secondary-dark: #1e293b;
            --accent-gold: #FFD700;
            --success: #10b981;
            --danger: #ef4444;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        /* Marketplace Banner - Replacement for Bismillah */
        .marketplace-banner {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
            transition: all 0.3s ease;
        }
        
        .marketplace-banner span {
            color: gold;
            font-size: 1.1rem;
            line-height: 1.5;
            display: block;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .marketplace-banner span:first-child {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255,215,0,0.3);
        }
        
        .marketplace-banner span:last-child {
            font-size: 0.85rem;
            font-weight: 500;
            color: #FFD700;
            opacity: 0.95;
        }
        
        h1 {
            color: var(--accent-gold);
            margin-bottom: 20px;
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        p {
            color: #a8b2d1;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .verifying {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-gold);
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .success-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(135deg, var(--accent-gold), #D4AF37);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .login-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent-gold);
            text-decoration: none;
        }
        
        @media (max-width: 480px) {
            .container { padding: 25px; }
            .marketplace-banner span:first-child { font-size: 1.3rem; }
            .marketplace-banner span:last-child { font-size: 0.75rem; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Core Insight Marketplace Banner (Replaces Bismillah) -->
        <div class="marketplace-banner">
            <span style="color: gold;">Core Insight MarketPlace</span>
            <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
        </div>
        
        <div class="icon">🔐</div>
        <h1>Email Verification</h1>
        
        <div id="content">
            <div class="verifying"></div>
            <p>Verifying your email address...</p>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        async function verifyEmail() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            const contentDiv = document.getElementById('content');
            const resultDiv = document.getElementById('result');
            
            if (!token) {
                contentDiv.style.display = 'none';
                resultDiv.innerHTML = `
                    <div class="error-box">
                        <h3>❌ Invalid Verification Link</h3>
                        <p>No verification token found. Please check the link in your email.</p>
                        <a href="login.html"><button>Go to Login</button></a>
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    contentDiv.style.display = 'none';
                    resultDiv.innerHTML = `
                        <div class="success-box">
                            <h3>✅ Email Verified Successfully!</h3>
                            <p>Your account has been activated. You can now log in and start using Core Insight.</p>
                            <a href="login.html?verified=true"><button>Login Now</button></a>
                        </div>
                    `;
                } else {
                    contentDiv.style.display = 'none';
                    resultDiv.innerHTML = `
                        <div class="error-box">
                            <h3>❌ Verification Failed</h3>
                            <p>${data.error || 'Invalid or expired verification link. Please request a new verification email.'}</p>
                            <a href="signup.html"><button>Sign Up Again</button></a>
                            <br>
                            <a href="login.html" class="login-link">Back to Login</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Verification error:', error);
                contentDiv.style.display = 'none';
                resultDiv.innerHTML = `
                    <div class="error-box">
                        <h3>❌ Network Error</h3>
                        <p>Could not connect to the server. Please check your internet connection and try again.</p>
                        <a href="login.html"><button>Go to Login</button></a>
                    </div>
                `;
            }
        }
        
        verifyEmail();
    </script>
</body>
</html>
