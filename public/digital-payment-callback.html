<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Core Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .bismillah {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
        }
        .bismillah .arabic {
            font-size: 1.5rem;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            color: #FFD700;
            display: block;
            margin-bottom: 0.3rem;
        }
        .bismillah .english {
            font-size: 0.85rem;
            color: rgba(255, 215, 0, 0.9);
        }
        h2 { color: #e6f1ff; margin-bottom: 24px; }
        .spinner {
            border: 4px solid #334155;
            border-top-color: #FFD700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #10b981; font-size: 48px; margin: 20px 0; }
        .error { color: #ef4444; font-size: 48px; margin: 20px 0; }
        .btn {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,215,0,0.3); }
        .download-btn {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin: 10px;
        }
        .download-btn:hover { background: #059669; transform: translateY(-2px); }
        .product-info {
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
        }
        .retry-btn {
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bismillah">
            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
        </div>
        <div id="paymentStatus">
            <h2>Processing Payment...</h2>
            <div class="spinner"></div>
            <p id="message" style="color: #94a3b8;">Please wait while we verify your payment...</p>
        </div>
    </div>

    <script>
        // Get reference from URL - clean, no prefixes needed
        const urlParams = new URLSearchParams(window.location.search);
        let reference = urlParams.get('reference') || urlParams.get('trxref') || urlParams.get('tx_ref') || urlParams.get('transaction_id');
        
        console.log('💰 Payment callback received. Reference:', reference);
        
        let retryCount = 0;
        const maxRetries = 10;
        let checkInterval = null;
        
        async function verifyPayment() {
            if (!reference) {
                showError('No payment reference found. Please contact support.');
                return;
            }
            
            try {
                console.log(`🔍 Verifying payment (attempt ${retryCount + 1}/${maxRetries})...`);
                
                const response = await fetch(`/api/verify-digital-payment/${encodeURIComponent(reference)}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' }
                });
                
                const data = await response.json();
                console.log('📦 Verification response:', data);
                
                if (data.status === 'success') {
                    // Payment successful
                    if (checkInterval) clearInterval(checkInterval);
                    
                    document.getElementById('paymentStatus').innerHTML = `
                        <div class="bismillah">
                            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                        </div>
                        <div class="success">✅</div>
                        <h2 style="color: #10b981;">Payment Successful!</h2>
                        <div class="product-info">
                            <strong>${escapeHtml(data.product_title || 'Digital Product')}</strong><br>
                            Thank you for your purchase!
                        </div>
                        <p style="margin: 15px 0;">Your download link is ready. It will expire in 7 days.</p>
                        <div>
                            <a href="${data.download_url}" class="download-btn" target="_blank">
                                <i class="fas fa-download"></i> Download Now
                            </a>
                            <a href="/products.html" class="btn">Continue Shopping</a>
                        </div>
                    `;
                    sessionStorage.removeItem('pendingDigitalOrder');
                    
                } else if (data.status === 'pending') {
                    // Payment still processing - retry
                    retryCount++;
                    document.getElementById('message').innerHTML = `⏳ Payment is being processed... (${retryCount}/${maxRetries})<br>Please wait.`;
                    
                    if (retryCount >= maxRetries) {
                        if (checkInterval) clearInterval(checkInterval);
                        showError('Payment is taking longer than expected. Please check your email for confirmation or contact support.');
                    }
                    
                } else {
                    // Failed
                    if (checkInterval) clearInterval(checkInterval);
                    showError(data.message || 'Payment verification failed. Please contact support.');
                }
                
            } catch (error) {
                console.error('Verification error:', error);
                retryCount++;
                document.getElementById('message').innerHTML = `⚠️ Checking payment status... (${retryCount}/${maxRetries})`;
                
                if (retryCount >= maxRetries) {
                    if (checkInterval) clearInterval(checkInterval);
                    showError('Error verifying payment. Please contact support with your transaction reference.');
                }
            }
        }
        
        function showError(message) {
            document.getElementById('paymentStatus').innerHTML = `
                <div class="bismillah">
                    <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                    <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                </div>
                <div class="error">❌</div>
                <h2 style="color: #ef4444;">Verification Failed</h2>
                <p style="color: #94a3b8;">${escapeHtml(message)}</p>
                <p style="color: #94a3b8; font-size: 12px; margin-top: 10px;">Transaction Reference: ${escapeHtml(reference)}</p>
                <div style="margin-top: 20px;">
                    <button onclick="retryVerification()" class="retry-btn">
                        <i class="fas fa-sync-alt"></i> Try Again
                    </button>
                    <a href="/products.html" class="btn">Browse Products</a>
                </div>
            `;
        }
        
        function retryVerification() {
            retryCount = 0;
            location.reload();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Start verification with retry interval
        if (reference) {
            verifyPayment();
            checkInterval = setInterval(verifyPayment, 3000);
        } else {
            showError('No payment reference found in URL.');
        }
    </script>
</body>
</html>
