<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Verification - Core Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        /* Marketplace Banner - Replacement for Bismillah */
        .marketplace-banner {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
            transition: all 0.3s ease;
        }
        .marketplace-banner span {
            color: gold;
            font-size: 1.1rem;
            line-height: 1.5;
            display: block;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .marketplace-banner span:first-child {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255,215,0,0.3);
        }
        .marketplace-banner span:last-child {
            font-size: 0.85rem;
            font-weight: 500;
            color: #FFD700;
            opacity: 0.95;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .btn {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
        h2 { margin-bottom: 20px; }
        h1 { font-size: 28px; margin: 20px 0; }
        
        @media (max-width: 480px) {
            .container { padding: 25px; }
            .marketplace-banner span:first-child { font-size: 1.3rem; }
            .marketplace-banner span:last-child { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div id="status" class="container">
        <!-- Core Insight Marketplace Banner (Replaces Bismillah) -->
        <div class="marketplace-banner">
            <span style="color: gold;">Core Insight MarketPlace</span>
            <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
        </div>
        <div class="spinner"></div>
        <h2>Verifying Payment...</h2>
        <p style="color: #94a3b8;">Please wait while we confirm your transaction.</p>
    </div>

    <script>
        async function verifyPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const transactionId = urlParams.get('transaction_id');
            const status = urlParams.get('status');
            const tx_ref = urlParams.get('tx_ref');
            
            console.log("Verifying payment:", { transactionId, status, tx_ref });
            
            if (status === 'successful' && (transactionId || tx_ref)) {
                const idToVerify = transactionId || tx_ref;
                
                try {
                    const response = await fetch(`/api/verify-service-payment/${idToVerify}`);
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        document.getElementById('status').innerHTML = `
                            <div class="marketplace-banner">
                                <span style="color: gold;">Core Insight MarketPlace</span>
                                <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
                            </div>
                            <div class="success">✅</div>
                            <h1 class="success">Payment Successful!</h1>
                            <p>Your ${data.plan || 'subscription'} has been activated.</p>
                            <p>Valid until: ${data.validUntil ? new Date(data.validUntil).toLocaleDateString() : 'N/A'}</p>
                            <a href="/services.html" class="btn">Go to Services</a>
                        `;
                    } else {
                        throw new Error(data.message || 'Verification failed');
                    }
                } catch (error) {
                    document.getElementById('status').innerHTML = `
                        <div class="marketplace-banner">
                            <span style="color: gold;">Core Insight MarketPlace</span>
                            <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
                        </div>
                        <div class="error">❌</div>
                        <h1 class="error">Verification Failed</h1>
                        <p>${error.message}</p>
                        <a href="/services.html" class="btn">Back to Services</a>
                    `;
                }
            } else {
                document.getElementById('status').innerHTML = `
                    <div class="marketplace-banner">
                        <span style="color: gold;">Core Insight MarketPlace</span>
                        <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
                    </div>
                    <div class="error">❌</div>
                    <h1 class="error">Payment Cancelled</h1>
                    <p>Your payment was not completed.</p>
                    <a href="/services.html" class="btn">Back to Services</a>
                `;
            }
        }
        
        verifyPayment();
    </script>
</body>
</html>
