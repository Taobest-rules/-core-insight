<!DOCTYPE html>
<html>
<head>
    <title>Payment Processing - Core Insight</title>
    <style>
        body { 
            background: #0a192f; 
            color: #e6f1ff; 
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1e293b;
            border-radius: 16px;
            max-width: 500px;
        }
        .spinner {
            border: 4px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .btn {
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Processing Payment...</h2>
        <div class="spinner"></div>
        <p id="message">Please wait while we verify your payment...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const reference = urlParams.get('reference');  // Paystack
        const trxref = urlParams.get('trxref');  // Paystack alternative
        const transactionId = urlParams.get('transaction_id');  // Flutterwave
        const tx_ref = urlParams.get('tx_ref');  // Flutterwave
        const status = urlParams.get('status');
        
        // Get order ID from session storage or URL
        let orderId = urlParams.get('orderId');
        
        async function verifyPayment() {
            try {
                // Handle Paystack callback
                if (reference || trxref) {
                    const paystackRef = reference || trxref;
                    console.log('Verifying Paystack payment:', paystackRef);
                    
                    // Get order ID from session storage
                    const pendingOrder = sessionStorage.getItem('pendingPhysicalOrder');
                    if (pendingOrder) {
                        const orderData = JSON.parse(pendingOrder);
                        orderId = orderData.orderId;
                    }
                    
                    if (!orderId) {
                        document.getElementById('message').innerHTML = 
                            '<span class="error">❌ Order ID not found. Please contact support.</span>';
                        return;
                    }
                    
                    // Call your verification endpoint
                    const response = await fetch('/api/verify-paystack-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            reference: paystackRef, 
                            order_id: orderId 
                        }),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    console.log('Verification response:', data);
                    
                    if (data.success) {
                        document.getElementById('message').innerHTML = `
                            <span class="success">✅ Payment Successful!</span><br>
                            Order #${orderId}<br>
                            Redirecting to order tracking...
                        `;
                        sessionStorage.removeItem('pendingPhysicalOrder');
                        
                        setTimeout(() => {
                            window.location.href = `/order-tracking.html?orderId=${orderId}`;
                        }, 3000);
                    } else {
                        document.getElementById('message').innerHTML = `
                            <span class="error">❌ Payment verification failed</span><br>
                            ${data.message || 'Please contact support.'}
                        `;
                    }
                }
                // Handle Flutterwave callback
                else if (tx_ref || transactionId) {
                    const flutterwaveRef = tx_ref || transactionId;
                    console.log('Verifying Flutterwave payment:', flutterwaveRef);
                    
                    const response = await fetch(`/api/verify-physical-payment/${flutterwaveRef}`);
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        document.getElementById('message').innerHTML = `
                            <span class="success">✅ Payment Successful!</span><br>
                            Order #${data.orderId}<br>
                            Redirecting to order tracking...
                        `;
                        
                        setTimeout(() => {
                            window.location.href = `/order-tracking.html?orderId=${data.orderId}`;
                        }, 3000);
                    } else {
                        document.getElementById('message').innerHTML = `
                            <span class="error">❌ Payment verification failed</span><br>
                            ${data.message || 'Please contact support.'}
                        `;
                    }
                }
                else {
                    document.getElementById('message').innerHTML = `
                        <span class="error">❌ No payment information found</span><br>
                        Please contact support.
                    `;
                }
                
                document.querySelector('.spinner').style.display = 'none';
                
            } catch (error) {
                console.error('Verification error:', error);
                document.getElementById('message').innerHTML = `
                    <span class="error">❌ Error verifying payment</span><br>
                    ${error.message}<br>
                    Please contact support with your order ID.
                `;
                document.querySelector('.spinner').style.display = 'none';
            }
        }
        
        // Start verification
        verifyPayment();
    </script>
</body>
</html>
