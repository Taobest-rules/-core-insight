<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Payment - Core Insight</title>
    <style>
        body {
            background: #0a192f;
            color: #e6f1ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success-icon {
            font-size: 64px;
            color: #10b981;
            margin: 20px 0;
        }
        .error-icon {
            font-size: 64px;
            color: #ef4444;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #FFD700;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="status">
            <div class="spinner"></div>
            <h2>Verifying Payment...</h2>
            <p>Please wait while we confirm your subscription.</p>
        </div>
    </div>

    <script>
        async function verifyPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const tx_ref = urlParams.get('tx_ref');
            const transaction_id = urlParams.get('transaction_id');
            
            if (status === 'successful' && tx_ref) {
                try {
                    const response = await fetch('/api/subscription/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            transaction_ref: tx_ref, 
                            status: 'successful' 
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        document.getElementById('status').innerHTML = `
                            <div class="success-icon">✅</div>
                            <h2>Subscription Activated!</h2>
                            <p>Your ${data.plan} subscription has been activated successfully.</p>
                            <p>Valid until: ${new Date(data.validUntil).toLocaleDateString()}</p>
                            <a href="/services.html" class="btn">Go to Dashboard</a>
                        `;
                    } else {
                        throw new Error(data.error || 'Verification failed');
                    }
                } catch (error) {
                    document.getElementById('status').innerHTML = `
                        <div class="error-icon">❌</div>
                        <h2>Verification Failed</h2>
                        <p>${error.message}</p>
                        <a href="/services.html" class="btn">Back to Dashboard</a>
                    `;
                }
            } else {
                document.getElementById('status').innerHTML = `
                    <div class="error-icon">❌</div>
                    <h2>Payment Cancelled</h2>
                    <p>Your subscription payment was not completed.</p>
                    <a href="/services.html" class="btn">Back to Dashboard</a>
                `;
            }
        }
        
        verifyPayment();
    </script>
</body>
</html>
