<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="csrf-token" content="your-csrf-token-here">
<title>Messages · Core Insight</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf8f3;--paper:#fff;--ink:#25231f;--ink2:#5c574d;--muted:#948e80;--line:#ece7dc;--line2:#ddd6c6;
--gold:#c9971f;--gold-deep:#a97c15;--gold-tint:#f8ecd2;--sage:#4f8573;--blue:#4a6fa5;--danger:#b3492f;
--logo:url("https://i.pinimg.com/736x/27/7a/12/277a1257f00946e8337c57ac43c9b700.jpg")}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.5 Inter,sans-serif;-webkit-font-smoothing:antialiased}
header{position:fixed;top:0;left:0;right:0;height:64px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,28px);background:rgba(250,248,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}.logo img{width:34px;height:34px;border-radius:10px;object-fit:cover}
.logo span{font:600 1.2rem Fraunces,Georgia,serif}
nav{display:flex;gap:26px}nav a{color:var(--ink2);text-decoration:none;font-weight:500}nav a:hover{color:var(--ink)}
@media(max-width:760px){nav{display:none}}
.hdr-r{display:flex;gap:10px;align-items:center}
.pill{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:30px;padding:8px 16px;font:600 13px Inter;cursor:pointer;text-decoration:none}
.pill.dark{background:var(--ink);color:var(--cream);border-color:var(--ink)}
main{padding:calc(64px + 20px) clamp(10px,3vw,28px) 20px;max-width:1380px;margin:0 auto;height:100dvh}
.shell{display:grid;grid-template-columns:372px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 20px 50px rgba(37,35,31,.08)}
/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-right:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 10px}
.brand img{width:44px;height:44px;border-radius:14px;object-fit:cover;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold)}
.brand b{display:block;font:600 22px Fraunces,Georgia,serif;letter-spacing:-.01em;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
.search{position:relative;padding:6px 20px 0}.search i{position:absolute;left:34px;top:60%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.search input{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:14px;padding:11px 14px 11px 38px;font:14px Inter;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--gold);background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 20px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:30px;padding:6px 13px;font:600 12px Inter;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--line2)}.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.list{flex:1;overflow-y:auto;padding:2px 10px 14px}
.conv{display:flex;gap:12px;padding:12px;border-radius:16px;cursor:pointer;transition:.12s;align-items:center;margin-bottom:2px;border-left:3px solid transparent}
.conv:hover{background:var(--cream)}.conv.on{background:var(--gold-tint);border-left-color:var(--gold)}
.av{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font:600 16px Inter;flex-shrink:0;width:48px;height:48px;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--line2)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.sm{width:30px;height:30px;font-size:12px;box-shadow:0 0 0 2px #fff}
.cv-b{flex:1;min-width:0}.cv-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cv-n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cv-time{font-size:11px;color:var(--muted);flex-shrink:0}
.cv-item{display:inline-flex;gap:5px;align-items:center;font-size:11px;color:var(--ink2);background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin:3px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv.on .cv-item{background:#fff}
.cv-p{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conv.unread .cv-p{color:var(--ink);font-weight:600}
.badge{background:var(--gold);color:var(--ink);font:700 11px Inter;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.empty{text-align:center;color:var(--muted);padding:56px 24px}.empty i{display:block;font-size:30px;color:var(--line2);margin-bottom:10px}
.retry{margin-top:10px;border:1px solid var(--line2);background:#fff;border-radius:20px;padding:7px 16px;font:600 13px Inter;cursor:pointer}
/* ---------- thread ---------- */
.thread{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:linear-gradient(180deg,#fbf6ea,var(--cream) 220px)}
.thread::before{content:"";position:absolute;inset:0;background:var(--logo) center 52%/300px no-repeat;opacity:.045;filter:grayscale(1);pointer-events:none}
.thread>*{position:relative;z-index:1}
.ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--ink2)}
.ph img{width:92px;height:92px;border-radius:26px;object-fit:cover;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--gold),0 18px 40px rgba(201,151,31,.25)}
.ph b{font:600 26px Fraunces,Georgia,serif;color:var(--ink);margin-top:10px}
.ph ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;font-size:13px;text-align:left}
.ph li i{color:var(--sage);width:22px}
.th-head{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);flex-shrink:0;box-shadow:0 1px 0 var(--gold-tint)}
.th-head:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--gold),transparent 60%)}
.th-back{display:none;border:none;background:var(--cream);width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--ink)}
.th-who{flex:1;min-width:0}.th-name{font:600 17px Fraunces,Georgia,serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.th-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shield{font:600 10.5px Inter;color:var(--sage);background:#e4efe9;border-radius:20px;padding:2px 9px;display:inline-flex;gap:5px;align-items:center}
.icon-b{border:1px solid var(--line);background:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.icon-b:hover{background:var(--cream)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px clamp(12px,3vw,28px) 8px;display:flex;flex-direction:column}
.day{display:flex;align-items:center;gap:12px;margin:16px 0 8px;color:var(--muted);font:600 11px Inter;letter-spacing:.04em;text-transform:uppercase}
.day:before,.day:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2))}.day:after{transform:scaleX(-1)}
.day span:before{content:"◆";color:var(--gold);margin-right:7px;font-size:8px;vertical-align:1px}
.sys{align-self:center;max-width:90%;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink2);background:rgba(255,255,255,.85);border:1.5px dashed #e5cf98;border-radius:14px;padding:8px 14px;margin:9px 0;line-height:1.5}
.sys img{width:18px;height:18px;border-radius:5px;object-fit:cover;flex-shrink:0;margin-top:1px}
.row{display:flex;gap:8px;margin-top:12px;max-width:100%}.row.cont{margin-top:3px}
.row.mine{justify-content:flex-end}.row.theirs{justify-content:flex-start}
.av-slot{width:30px;flex-shrink:0;align-self:flex-end}
.stack{display:flex;flex-direction:column;max-width:min(560px,78%);min-width:0}.row.mine .stack{align-items:flex-end}
.bubble{position:relative;overflow:hidden;padding:10px 15px;border-radius:16px;font-size:14.5px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.row.mine .bubble{background:linear-gradient(135deg,#37352f,#25231f);color:var(--cream);box-shadow:0 5px 14px rgba(37,35,31,.16)}
.row.theirs .bubble{background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(37,35,31,.04)}
/* folded-corner: the Core Insight signature */
.bubble.fold:after{content:"";position:absolute;bottom:0;width:15px;height:15px}
.row.mine .bubble.fold:after{right:0;background:linear-gradient(135deg,transparent 50%,var(--gold) 50%)}
.row.theirs .bubble.fold:after{left:0;background:linear-gradient(225deg,transparent 50%,var(--line2) 50%)}
.bubble img.att{display:block;max-width:240px;width:100%;border-radius:12px;margin:2px 0;cursor:zoom-in}
.bubble a{color:inherit}
.meta{font-size:10.5px;color:var(--muted);margin:4px 6px 0;display:flex;gap:5px;align-items:center}.meta .seen{color:var(--sage)}
.typing{height:24px;padding:0 clamp(12px,3vw,28px);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-shrink:0}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:bl 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:12px clamp(10px,3vw,24px) calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);flex-shrink:0}
.cbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--cream);color:var(--ink2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.12s}
.cbtn:hover{background:var(--gold-tint);color:var(--gold-deep)}
.cbtn.send{background:var(--ink);border-color:var(--ink);color:var(--gold)}.cbtn.send:hover{background:var(--gold);color:var(--ink)}
.composer textarea{flex:1;border:1px solid var(--line);background:var(--cream);border-radius:22px;padding:11px 16px;font:14.5px Inter;resize:none;max-height:130px;color:var(--ink)}
.composer textarea:focus{outline:none;border-color:var(--gold);background:#fff}
.modal{position:fixed;inset:0;background:rgba(37,35,31,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:9100;padding:16px}.modal.open{display:flex}
.box{background:#fff;border-radius:24px;padding:26px;width:min(400px,100%);box-shadow:0 30px 80px rgba(0,0,0,.25)}.box h3{margin:0 0 14px;font:600 22px Fraunces,Georgia,serif}
.fi{width:100%;border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:11px 13px;font:14px Inter;margin-bottom:12px}.fi:focus{outline:none;border-color:var(--gold);background:#fff}
.btn-w{width:100%;border:none;background:var(--ink);color:var(--cream);border-radius:12px;padding:12px;font:600 14px Inter;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--cream);border-radius:14px;padding:12px 18px;z-index:9800;box-shadow:0 12px 30px rgba(0,0,0,.25);font-size:13.5px;max-width:90vw}
@media(max-width:820px){
 main{padding:64px 0 0}.shell{grid-template-columns:minmax(0,1fr);border-radius:0;border:none;height:calc(100dvh - 64px)}
 .thread{display:none}.shell.show-thread .side{display:none}.shell.show-thread .thread{display:flex}.th-back{display:inline-flex;align-items:center;justify-content:center}
 .stack{max-width:84%}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><img src="https://i.pinimg.com/736x/27/7a/12/277a1257f00946e8337c57ac43c9b700.jpg" alt=""><span>Core Insight</span></a>
  <nav><a href="index.html">Home</a><a href="knowledge-hub.html">Knowledge Hub</a><a href="services.html">Services</a><a href="courses.html">Courses</a><a href="products.html">Products</a></nav>
  <div class="hdr-r"><a class="pill" href="services.html">Back to site</a><button class="pill dark" id="loginOpenBtn" style="display:none">Log in</button></div>
</header>

<main>
 <div class="shell" id="shell">
  <aside class="side">
    <div class="brand"><img src="https://i.pinimg.com/736x/27/7a/12/277a1257f00946e8337c57ac43c9b700.jpg" alt=""><div><b>Messages</b><small>Core Insight deal room</small></div></div>
    <div class="search"><i class="fas fa-search"></i><input id="searchBox" placeholder="Search people or items"></div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">All</button><button class="chip" data-f="unread">Unread</button>
      <button class="chip" data-f="service">🛠 Services</button><button class="chip" data-f="product">📦 Products</button>
      <button class="chip" data-f="course">🎓 Courses</button><button class="chip" data-f="book">📚 Books</button>
      <button class="chip" data-f="order_support">🛒 Orders</button><button class="chip" data-f="archived">Archived</button>
    </div>
    <div class="list" id="convList"><div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div></div>
  </aside>
  <section class="thread" id="thread"></section>
 </div>
</main>

<div class="modal" id="loginModal"><div class="box"><h3>Log in</h3>
  <form id="loginForm"><input class="fi" id="lgId" placeholder="Username or email" required autocomplete="username">
  <input class="fi" id="lgPw" type="password" placeholder="Password" required autocomplete="current-password">
  <div id="lgErr" style="color:var(--danger);font-size:12.5px;min-height:18px;margin-bottom:8px"></div>
  <button class="btn-w" type="submit">Log in</button></form></div></div>

<script>
const LOGO = 'https://i.pinimg.com/736x/27/7a/12/277a1257f00946e8337c57ac43c9b700.jpg';
let currentUser = null, conversations = [], activeId = null, filter = 'all', search = '', lastSig = null;
let pollT = null, typT = null, typThrottle = null, firstLoad = true;
const $ = s => document.querySelector(s);
const ICON = { product: '📦', service: '🛠', course: '🎓', book: '📚', general: '💬', order_support: '🛒' };
const COLORS = ['#c9971f', '#4a6fa5', '#4f8573', '#a0617b', '#7a6bb0', '#c0693c'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const csrf = () => document.querySelector('meta[name="csrf-token"]')?.content || '';
const CQ = () => window.CoreQuote || {};            // quote-chat.js is optional: chat must work without it
function showToast(title, msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg || title; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function avatar(name, cls = '', pic = '') {
  const n = name || '?'; let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="av ${cls}" style="background:${COLORS[h % COLORS.length]}">${esc(n[0].toUpperCase())}${pic ? `<img src="${esc(pic)}" alt="" onerror="this.remove()">` : ''}</span>`;
}
const tShort = iso => { if (!iso) return ''; const d = new Date(iso); return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' }); };
function dayLabel(d) { const t = new Date(), y = new Date(Date.now() - 864e5); return d.toDateString() === t.toDateString() ? 'Today' : d.toDateString() === y.toDateString() ? 'Yesterday' : d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' }); }
const previewText = t => /^\s*quote:\d+\s*$/.test(t || '') ? '📋 Quote' : (t || 'No messages yet');
const welcome = () => `<div class="ph"><img src="${LOGO}" alt=""><b>Core Insight Messages</b><span>Every deal, documented.</span>
  <ul><li><i class="fas fa-file-signature"></i>Quotes become written agreements</li><li><i class="fas fa-shield-halved"></i>Payments held safely in escrow</li><li><i class="fas fa-camera"></i>Disputes backed by photo evidence</li></ul></div>`;
$('#thread').innerHTML = welcome();

/* ---------- login ---------- */
const lm = $('#loginModal');
$('#loginOpenBtn').onclick = () => lm.classList.add('open');
lm.onclick = e => { if (e.target === lm) lm.classList.remove('open'); };
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); const id = $('#lgId').value.trim(), payload = { password: $('#lgPw').value }; payload[id.includes('@') ? 'email' : 'username'] = id;
  try {
    const r = await fetch('/api/login', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() }, body: JSON.stringify(payload) });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Login failed');
    lm.classList.remove('open'); await boot();
  } catch (err) { $('#lgErr').textContent = err.message; }
};

/* ---------- boot ---------- */
async function boot() {
  try { const r = await fetch('/api/me', { credentials: 'include' }); const d = r.ok ? await r.json() : null; currentUser = d && d.user ? d.user : d; } catch (e) { currentUser = null; }
  $('#loginOpenBtn').style.display = currentUser ? 'none' : 'inline-flex';
  if (!currentUser) { $('#convList').innerHTML = `<div class="empty"><i class="fas fa-lock"></i>Log in to see your messages.</div>`; return; }
  await loadConversations();
  const p = new URLSearchParams(location.search), svc = p.get('svc_pay'), cid = p.get('conversation');
  if (svc) {
    if (p.get('status') === 'cancelled') showToast('Payment', 'Payment cancelled.');
    else {
      showToast('Payment', 'Confirming your payment…'); let ok = false;
      for (let i = 0; i < 4 && !ok; i++) {
        try { const r = await fetch(`/api/service-orders/${svc}/verify-payment`, { method: 'POST', credentials: 'include' }); ok = !!(await r.json()).success; } catch (e) {}
        if (!ok) await new Promise(r => setTimeout(r, 2500));
      }
      showToast('Payment', ok ? 'Payment received. Held in escrow.' : 'Not confirmed yet. It will update shortly.');
    }
    history.replaceState(null, '', `/messages.html?conversation=${cid || ''}`);
  }
  if (cid && firstLoad) openConversation(Number(cid));
  firstLoad = false;
}
document.addEventListener('DOMContentLoaded', boot);
$('#chips').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); filter = c.dataset.f; renderList(); };
$('#searchBox').oninput = e => { search = e.target.value.toLowerCase(); renderList(); };

/* ---------- list ---------- */
async function loadConversations() {
  try { const r = await fetch('/api/messages/conversations', { credentials: 'include' }); const d = r.ok ? await r.json() : []; conversations = Array.isArray(d) ? d : (d.conversations || []); } catch (e) { conversations = []; }
  renderList();
}
function renderList() {
  let l = conversations.filter(c => filter === 'archived' ? c.is_archived : !c.is_archived);
  if (filter === 'unread') l = l.filter(c => +c.unread_count > 0);
  else if (!['all', 'archived'].includes(filter)) l = l.filter(c => c.item_type === filter);
  if (search) l = l.filter(c => ((c.other_user_name || '') + ' ' + (c.item_title || '')).toLowerCase().includes(search));
  if (!l.length) { $('#convList').innerHTML = `<div class="empty"><i class="far fa-folder-open"></i>Nothing here yet.</div>`; return; }
  $('#convList').innerHTML = l.map(c => `<div class="conv ${activeId === c.conversation_id ? 'on' : ''} ${+c.unread_count > 0 ? 'unread' : ''}" data-id="${c.conversation_id}">
    ${avatar(c.other_user_name, '', c.other_user_picture)}<div class="cv-b"><div class="cv-t"><span class="cv-n">${esc(c.other_user_name || 'User')}</span><span class="cv-time">${tShort(c.last_message_time || c.created_at)}</span></div>
    ${c.item_title ? `<span class="cv-item">${ICON[c.item_type] || '💬'} ${esc(c.item_title)}</span>` : ''}<div class="cv-p">${esc(previewText(c.last_message))}</div></div>
    ${+c.unread_count > 0 ? `<span class="badge">${c.unread_count}</span>` : ''}</div>`).join('');
  document.querySelectorAll('.conv').forEach(r => r.onclick = () => openConversation(Number(r.dataset.id)));
}

/* ---------- thread ---------- */
async function openConversation(id) {
  activeId = id; lastSig = null; clearInterval(pollT); clearInterval(typT);
  history.replaceState(null, '', `/messages.html?conversation=${id}`);
  $('#shell').classList.add('show-thread'); renderList();
  const c = conversations.find(x => x.conversation_id === id) || {};
  $('#thread').innerHTML = `
   <div class="th-head"><button class="th-back" id="backBtn"><i class="fas fa-arrow-left"></i></button>${avatar(c.other_user_name, '', c.other_user_picture)}
     <div class="th-who"><div class="th-name">${esc(c.other_user_name || 'Conversation')}${c.item_type === 'service' ? '<span class="shield"><i class="fas fa-shield-halved"></i> Escrow-protected</span>' : ''}</div>
     <div class="th-sub">${c.item_title ? (ICON[c.item_type] || '') + ' ' + esc(c.item_title) : 'Direct message'}</div></div>
     ${c.item_url ? `<a class="icon-b" href="${esc(c.item_url)}" title="View item"><i class="fas fa-arrow-up-right-from-square"></i></a>` : ''}
     <button class="icon-b" id="archBtn" title="${c.is_archived ? 'Unarchive' : 'Archive'}"><i class="fas fa-box-archive"></i></button></div>
   <div id="jobPanel"></div>
   <div class="msgs" id="threadMessages"><div class="empty" style="margin:auto"><i class="fas fa-spinner fa-spin"></i>Loading messages…</div></div>
   <div class="typing" id="typing"></div>
   <form class="composer" id="composer">
     <input type="file" id="attIn" accept="image/*" hidden>
     <button type="button" class="cbtn" id="attBtn" title="Attach image"><i class="fas fa-paperclip"></i></button>
     <button type="button" class="cbtn" id="quoteBtn" title="Send a quote" style="display:none"><i class="fas fa-file-invoice-dollar"></i></button>
     <textarea id="txt" rows="1" placeholder="Write a message…"></textarea>
     <button type="submit" class="cbtn send" title="Send"><i class="fas fa-paper-plane"></i></button></form>`;
  $('#backBtn').onclick = () => { $('#shell').classList.remove('show-thread'); activeId = null; clearInterval(pollT); clearInterval(typT); try { CQ().setConversation?.(null); } catch (e) {} history.replaceState(null, '', '/messages.html'); $('#thread').innerHTML = welcome(); renderList(); };
  $('#archBtn').onclick = () => toggleArchive(id, !c.is_archived);
  $('#attBtn').onclick = () => $('#attIn').click();
  $('#attIn').onchange = e => sendAttachment(e.target.files[0]);
  $('#quoteBtn').onclick = () => CQ().openSend?.();
  const txt = $('#txt');
  txt.oninput = () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 130) + 'px'; notifyTyping(); };
  txt.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#composer').requestSubmit(); } };
  $('#composer').onsubmit = e => { e.preventDefault(); sendMessage(); };

  try { CQ().setConversation?.(id); } catch (e) { console.warn('quote-chat:', e); }
  await refreshThreadMessages(true);                // messages first: nothing above can block this
  if (activeId !== id) return;
  pollT = setInterval(() => refreshThreadMessages(), 4000);
  typT = setInterval(pollTyping, 2500);
  try { Promise.resolve(CQ().isProvider?.()).then(v => { const b = $('#quoteBtn'); if (b) b.style.display = v ? 'flex' : 'none'; }).catch(() => {}); } catch (e) {}
}

async function refreshThreadMessages(force) {
  if (!activeId) return;
  if (force) lastSig = null;
  const id = activeId;
  try {
    const r = await fetch(`/api/messages/${id}/messages`, { credentials: 'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json(); const list = Array.isArray(d) ? d : (d.messages || []);
    if (id !== activeId) return;
    renderMessages(list);
    fetch(`/api/messages/${id}/mark-seen`, { method: 'POST', credentials: 'include', headers: { 'X-CSRF-Token': csrf() } }).then(loadConversations).catch(() => {});
  } catch (e) {
    const el = $('#threadMessages');
    if (el && lastSig === null) { el.innerHTML = `<div class="empty" style="margin:auto"><i class="fas fa-triangle-exclamation"></i>Couldn't load this conversation.<br><button class="retry" onclick="refreshThreadMessages(true)">Try again</button></div>`; }
  }
}

function renderMessages(list) {
  const el = $('#threadMessages'); if (!el) return;
  const sig = list.map(m => `${m.id}.${m.read_at ? 1 : 0}.${m.is_deleted ? 1 : 0}`).join(',') || 'empty';
  if (sig === lastSig) return; lastSig = sig;
  const stick = !el.dataset.init || el.scrollHeight - el.scrollTop - el.clientHeight < 160; el.dataset.init = '1';
  if (!list.length) { el.innerHTML = `<div class="empty" style="margin:auto"><i class="far fa-hand"></i>No messages yet. Say hello.</div>`; return; }
  const c = conversations.find(x => x.conversation_id === activeId) || {};
  const sameGrp = (a, b) => a && b && a.sender_id === b.sender_id && a.attachment_type !== 'system' && b.attachment_type !== 'system'
    && a.attachment_type !== 'quote' && b.attachment_type !== 'quote'
    && new Date(a.created_at).toDateString() === new Date(b.created_at).toDateString() && new Date(b.created_at) - new Date(a.created_at) < 300000;
  let html = '', prevDay = '';
  list.forEach((m, i) => {
    const d = new Date(m.created_at), day = d.toDateString();
    if (day !== prevDay) { html += `<div class="day"><span>${dayLabel(d)}</span></div>`; prevDay = day; }
    if (m.attachment_type === 'system') { html += `<div class="sys"><img src="${LOGO}" alt=""><span>${esc(m.message)}</span></div>`; return; }
    const mine = currentUser && +m.sender_id === +currentUser.id, jp = sameGrp(list[i - 1], m), jn = sameGrp(m, list[i + 1]);
    const receipt = mine ? (m.read_at ? '<i class="fas fa-check-double seen"></i>' : '<i class="fas fa-check"></i>') : '';
    const meta = `<div class="meta">${tShort(m.created_at)} ${receipt}</div>`;
    const slot = !mine ? `<div class="av-slot">${!jn ? avatar(c.other_user_name, 'sm', c.other_user_picture) : ''}</div>` : '';
    const qm = /^quote:(\d+)$/.exec(m.message || '');
    if (m.attachment_type === 'quote' && qm) { html += `<div class="row ${mine ? 'mine' : 'theirs'}">${slot}<div class="stack"><div data-cq-quote="${qm[1]}"></div>${meta}</div></div>`; return; }
    const att = m.attachment_url || m.image_url;
    const img = att ? `<img class="att" src="${esc(att)}" data-zoom="${esc(att)}">` : '';
    const file = m.file_url ? `<a href="${esc(m.file_url)}" target="_blank"><i class="fas fa-file"></i> ${esc(m.file_name || 'File')}</a>` : '';
    const body = (m.message && !/^📷 Sent an image$/.test(m.message) && !(m.file_url && m.message.startsWith('📎'))) ? esc(m.message) : '';
    html += `<div class="row ${mine ? 'mine' : 'theirs'} ${jp ? 'cont' : ''}">${slot}<div class="stack"><div class="bubble ${jn ? '' : 'fold'}">${img}${file}${body}</div>${jn ? '' : meta}</div></div>`;
  });
  el.innerHTML = html;
  if (stick) el.scrollTop = el.scrollHeight;
  try { CQ().scan?.(); } catch (e) {}
}

async function sendMessage() {
  const t = $('#txt'), msg = t.value.trim(); if (!msg || !activeId) return;
  t.value = ''; t.style.height = 'auto';
  try {
    const r = await fetch('/api/messages/send', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() }, body: JSON.stringify({ conversation_id: activeId, message: msg }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Send failed');
    await refreshThreadMessages(true);
    const el = $('#threadMessages'); if (el) el.scrollTop = el.scrollHeight;
  } catch (e) { showToast('Could not send', e.message); t.value = msg; }
}
async function sendAttachment(file) {
  if (!file || !activeId) return;
  const fd = new FormData(); fd.append('conversation_id', activeId); fd.append('image', file);
  try { const r = await fetch('/api/messages/send-with-image', { method: 'POST', credentials: 'include', body: fd }); if (!r.ok) throw 0; $('#attIn').value = ''; await refreshThreadMessages(true); }
  catch (e) { showToast('Attachment failed', 'Could not send that image.'); }
}
async function toggleArchive(id, archived) {
  try {
    await fetch(`/api/messages/${id}/archive`, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() }, body: JSON.stringify({ archived }) });
    activeId = null; clearInterval(pollT); clearInterval(typT); try { CQ().setConversation?.(null); } catch (e) {}
    $('#shell').classList.remove('show-thread'); $('#thread').innerHTML = welcome(); await loadConversations();
  } catch (e) { showToast('Could not update', 'Try again.'); }
}
function notifyTyping() {
  if (!activeId || typThrottle) return; typThrottle = setTimeout(() => typThrottle = null, 2000);
  fetch(`/api/messages/${activeId}/typing`, { method: 'POST', credentials: 'include', headers: { 'X-CSRF-Token': csrf() } }).catch(() => {});
}
async function pollTyping() {
  if (!activeId) return;
  try { const d = await (await fetch(`/api/messages/${activeId}/typing-status`, { credentials: 'include' })).json(); const r = $('#typing');
    if (r) r.innerHTML = d.is_typing ? `<span class="dots"><i></i><i></i><i></i></span> ${esc(d.username || 'They')} is typing` : ''; } catch (e) {}
}
</script>
<script>window.CORE_QUOTE_NATIVE = true;</script>
<script src="quote-chat.js"></script>
</body>
</html>
