<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Payment Processing | Core Insight</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#faf9f6; --cream-deep:#f5f3ee; --paper:#fff;
  --charcoal:#2b2b28; --charcoal-soft:#55524a; --text-muted:#8a8578;
  --hairline:#e9e5dc; --hairline-strong:#ddd7ca;
  --blue:#4a6fa5; --sage:#5a8d7d; --sage-deep:#497363;
  --gold:#c9971f; --gold-deep:#a97c15; --gold-tint:#f8ecd2;
  --danger:#b3492f; --danger-tint:#f7e6e1;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  --shadow-modal:0 24px 60px rgba(43,43,40,.18); --ease:cubic-bezier(.4,0,.2,1);
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--cream); color:var(--charcoal); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; -webkit-font-smoothing:antialiased; }
h2 { font-family:'Fraunces',Georgia,serif; font-weight:600; color:var(--charcoal); margin:0 0 10px; font-size:1.4rem; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

.container { background:var(--paper); border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:clamp(28px,7vw,40px) clamp(22px,6vw,32px); max-width:440px; width:100%; text-align:center; box-shadow:var(--shadow-modal); }
.spinner { border:3px solid var(--hairline); border-top-color:var(--gold); border-radius:50%; width:40px; height:40px; animation:spin .8s linear infinite; margin:18px auto; }
@keyframes spin { to { transform:rotate(360deg); } }
.success { color:var(--sage-deep); font-weight:600; }
.error { color:var(--danger); font-weight:600; }
#message { color:var(--charcoal-soft); font-size:14px; line-height:1.7; }
.escrow-info { display:flex; align-items:flex-start; gap:9px; background:#e3ecf5; border-radius:var(--radius-md); padding:13px 15px; margin-top:18px; font-size:12.5px; color:#3c5c8a; text-align:left; }
.escrow-info i { margin-top:1px; flex-shrink:0; }
.btn { background:var(--gold); color:var(--charcoal); padding:12px 24px; border:none; border-radius:var(--radius-sm); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px; margin-top:20px; font-weight:600; font-size:14px; transition:var(--ease); }
.btn:hover { background:var(--gold-deep); }
</style>
</head>
<body>

  <span class="sr-only" aria-hidden="true">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ - In the name of Allah, the Most Gracious, the Most Merciful
  </span>

  <div class="container">
    <h2>Processing Payment…</h2>
    <div class="spinner"></div>
    <p id="message">Please wait while we verify your payment…</p>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const transactionId = urlParams.get('transaction_id');
  const status = urlParams.get('status');

  async function verifyPayment() {
    try {
      const pendingOrder = sessionStorage.getItem('pendingPhysicalOrder');
      let transactionRef = null;

      if (pendingOrder) {
        const orderData = JSON.parse(pendingOrder);
        transactionRef = orderData.paymentReference;
      }

      if (transactionId) {
        const response = await fetch(`/api/verify-physical-payment/${transactionId}`);
        const data = await response.json();

        if (data.status === 'success') {
          document.getElementById('message').innerHTML = `
            <span class="success">✅ Payment Successful!</span><br>
            Order #${data.orderId}<br>
            Amount: $${data.amount}
            <div class="escrow-info"><i class="fas fa-clock"></i> Funds are held in escrow for 7 days.<br>You can request a refund within 7 days if needed.<br>After 7 days, the seller will receive their payment.</div>
          `;
          document.querySelector('.spinner').style.display = 'none';
          setTimeout(() => { window.location.href = '/order-success.html?orderId=' + data.orderId; }, 5000);
        } else {
          document.getElementById('message').innerHTML = `<span class="error">❌ Payment Failed</span><br>${data.message || 'Please try again.'}`;
          document.querySelector('.spinner').style.display = 'none';
          setTimeout(() => { window.location.href = '/products.html'; }, 3000);
        }
      } else if (status === 'successful' && transactionRef) {
        const response = await fetch(`/api/verify-physical-payment/${transactionRef}`);
        const data = await response.json();

        if (data.status === 'success') {
          document.getElementById('message').innerHTML = `
            <span class="success">✅ Payment Successful!</span><br>
            Order #${data.orderId}<br>
            Amount: $${data.amount}
            <div class="escrow-info"><i class="fas fa-clock"></i> Funds are held in escrow for 7 days.<br>You can request a refund within 7 days if needed.<br>After 7 days, the seller will receive their payment.</div>
          `;
          document.querySelector('.spinner').style.display = 'none';
          sessionStorage.removeItem('pendingPhysicalOrder');
          setTimeout(() => { window.location.href = '/order-success.html?orderId=' + data.orderId; }, 5000);
        }
      } else {
        document.getElementById('message').innerHTML = `<span class="error">❌ Payment verification failed</span><br>Please contact support.`;
        document.querySelector('.spinner').style.display = 'none';
        setTimeout(() => { window.location.href = '/products.html'; }, 3000);
      }
    } catch (error) {
      console.error('Verification error:', error);
      document.getElementById('message').innerHTML = `<span class="error">❌ Error verifying payment</span><br>Please contact support.`;
      document.querySelector('.spinner').style.display = 'none';
    }
  }

  verifyPayment();
</script>

</body>
</html>
