<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Core Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .bismillah {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
        }
        .bismillah .arabic {
            font-size: 1.5rem;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            color: #FFD700;
            display: block;
            margin-bottom: 0.3rem;
        }
        .bismillah .english {
            font-size: 0.85rem;
            color: rgba(255, 215, 0, 0.9);
        }
        h2 { color: #e6f1ff; margin-bottom: 24px; }
        .spinner {
            border: 4px solid #334155;
            border-top-color: #FFD700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #f59e0b; }
        .btn {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,215,0,0.3); }
        .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
        .btn-outline:hover { background: rgba(59, 130, 246, 0.1); box-shadow: none; }
        .download-btn {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin: 10px;
        }
        .download-btn:hover { background: #059669; transform: translateY(-2px); }
        .product-info {
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bismillah">
            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
        </div>
        <div id="paymentStatus">
            <h2>Processing Payment...</h2>
            <div class="spinner"></div>
            <p id="message" style="color: #94a3b8;">Please wait while we verify your payment...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const reference = urlParams.get('reference');
        const trxref = urlParams.get('trxref');
        const transactionId = urlParams.get('transaction_id');
        const tx_ref = urlParams.get('tx_ref');
        const status = urlParams.get('status');
        
        // Get the actual reference from URL (Paystack uses 'reference' or 'trxref')
        const paymentRef = reference || trxref || tx_ref || transactionId;
        
        console.log('Payment callback received:', { reference, trxref, tx_ref, paymentRef, status });
        
        async function verifyDigitalPayment() {
            if (!paymentRef) {
                showError('No payment reference found. Please contact support.');
                return;
            }
            
            try {
                console.log('Verifying digital payment with reference:', paymentRef);
                
                // Remove 'PS_' prefix if present (Paystack adds this)
                let cleanRef = paymentRef;
                if (cleanRef.startsWith('PS_')) {
                    cleanRef = cleanRef.substring(3);
                    console.log('Removed PS_ prefix, new reference:', cleanRef);
                }
                
                // Call the digital payment verification endpoint
                const response = await fetch(`/api/verify-digital-payment/${cleanRef}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                console.log('Verification response:', data);
                
                if (data.status === 'success') {
                    // Digital product purchase successful - show download link
                    document.getElementById('paymentStatus').innerHTML = `
                        <div class="bismillah">
                            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                        </div>
                        <div class="success" style="font-size: 48px; margin: 20px 0;">✅</div>
                        <h2 style="color: #10b981;">Payment Successful!</h2>
                        <div class="product-info">
                            <strong>${escapeHtml(data.product_title || 'Digital Product')}</strong><br>
                            Thank you for your purchase!
                        </div>
                        <p style="margin: 15px 0;">Your download link is ready. It will expire in 7 days.</p>
                        <div>
                            <a href="${data.download_url}" class="download-btn" target="_blank">
                                <i class="fas fa-download"></i> Download Now
                            </a>
                            <a href="/products.html" class="btn">Continue Shopping</a>
                        </div>
                    `;
                    sessionStorage.removeItem('pendingDigitalOrder');
                } else {
                    showError(data.message || 'Payment verification failed. Please contact support.');
                }
                
            } catch (error) {
                console.error('Verification error:', error);
                showError('Error verifying payment: ' + error.message);
            }
        }
        
        // For physical product payments - redirect to order tracking
        async function verifyPhysicalPayment() {
            if (!paymentRef) {
                showError('No payment reference found. Please contact support.');
                return;
            }
            
            try {
                const response = await fetch(`/api/verify-physical-payment/${paymentRef}`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('paymentStatus').innerHTML = `
                        <div class="bismillah">
                            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                        </div>
                        <div class="success" style="font-size: 48px; margin: 20px 0;">✅</div>
                        <h2 style="color: #10b981;">Payment Successful!</h2>
                        <p>Order #${data.orderId}</p>
                        <div class="escrow-info" style="background: rgba(59,130,246,0.1); padding: 15px; border-radius: 12px; margin: 15px 0;">
                            <i class="fas fa-clock"></i> Funds are held in escrow for 5 days.<br>
                            You can request a refund within 5 days if needed.
                        </div>
                        <a href="/order-tracking.html?orderId=${data.orderId}" class="btn">Track Order</a>
                        <a href="/products.html" class="btn btn-outline">Continue Shopping</a>
                    `;
                } else {
                    showError('Payment verification failed');
                }
            } catch (error) {
                console.error('Physical payment verification error:', error);
                showError('Error verifying payment: ' + error.message);
            }
        }
        
        function showError(message) {
            document.getElementById('paymentStatus').innerHTML = `
                <div class="bismillah">
                    <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                    <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                </div>
                <div class="error" style="font-size: 48px; margin: 20px 0;">❌</div>
                <h2 style="color: #ef4444;">Verification Failed</h2>
                <p style="color: #94a3b8;">${escapeHtml(message)}</p>
                <div style="margin-top: 20px;">
                    <a href="/products.html" class="btn">Browse Products</a>
                    <a href="/contact.html" class="btn btn-outline">Contact Support</a>
                </div>
            `;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Determine payment type from reference
        function startVerification() {
            if (!paymentRef) {
                showError('No payment reference found in URL.');
                return;
            }
            
            // Check if this is a digital product payment (contains DIGITAL_ in reference)
            if (paymentRef.includes('DIGITAL_')) {
                console.log('Digital product payment detected');
                verifyDigitalPayment();
            } 
            // Check if this is a physical product payment
            else if (paymentRef.includes('ORD_') || paymentRef.includes('FW_') || paymentRef.includes('PS_')) {
                console.log('Physical product payment detected');
                verifyPhysicalPayment();
            }
            else {
                // Try to detect by checking if reference starts with certain patterns
                console.log('Unknown payment type, trying digital verification first');
                verifyDigitalPayment();
            }
        }
        
        // Start verification
        startVerification();
    </script>
</body>
</html>
