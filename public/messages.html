<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="csrf-token" content="your-csrf-token-here">
  <title>Messages | Core Insight</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="products.css">
  <link rel="stylesheet" href="messages.css">
</head>
<body>

  <header>
    <div style="display:flex;gap:12px;align-items:center">
      <div class="logo">
        <div class="logo-icon"><img src="https://i.pinimg.com/736x/96/d5/cd/96d5cdd6ba69c2feb30cb91bda572d4e.jpg" alt="Core Insight Logo" style="width:100%;height:100%;object-fit:cover;"></div>
        <div class="logo-text">Core Insight</div>
      </div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="knowledge-hub.html">Knowledge Hub</a>
      <a href="services.html">Services</a>
      <a href="courses.html">Courses</a>
      <a href="products.html">Products</a>
    </nav>
    <div class="header-actions">
      <a href="/messages.html" class="icon-btn active" title="Messages" style="text-decoration:none;color:var(--blue);"><i class="fas fa-envelope"></i></a>
      <div id="headerAuthButtons">
        <a href="products.html" class="auth-btn">Back to site</a>
      </div>
    </div>
  </header>

  <main style="padding-top:calc(70px + 32px); max-width:1280px; margin:0 auto; padding-left:28px; padding-right:28px; padding-bottom:40px;">
    <div class="hero" style="border-bottom:none; margin-bottom:20px; padding-bottom:0;">
      <div class="left">
        <span class="eyebrow">Unified Inbox</span>
        <h1 style="font-size:1.9rem;">Messages</h1>
      </div>
    </div>

    <div class="inbox-shell">
      <aside class="inbox-sidebar">
        <div class="inbox-sidebar-header">
          <h2>Conversations</h2>
          <div class="inbox-filters" id="inboxFilters">
            <button class="inbox-filter-chip active" data-filter="all">All</button>
            <button class="inbox-filter-chip" data-filter="unread">Unread</button>
            <button class="inbox-filter-chip" data-filter="product">📦 Products</button>
            <button class="inbox-filter-chip" data-filter="service">🛠 Services</button>
            <button class="inbox-filter-chip" data-filter="course">🎓 Courses</button>
            <button class="inbox-filter-chip" data-filter="book">📚 Books</button>
            <button class="inbox-filter-chip" data-filter="order_support">🛒 Orders</button>
            <button class="inbox-filter-chip" data-filter="archived">Archived</button>
          </div>
        </div>
        <div class="conversation-list" id="conversationList">
          <div class="inbox-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading…</p></div>
        </div>
      </aside>

      <section class="inbox-thread" id="inboxThread">
        <div class="thread-placeholder">
          <i class="fas fa-comments"></i>
          <p>Select a conversation to view it</p>
        </div>
      </section>
    </div>
  </main>

  <script src="messages.js"></script>
</body>
</html>
