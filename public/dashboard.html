<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nexus Seller Hub | Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
    background: radial-gradient(circle at 10% 20%, #0a0c1a, #03050c);
    color: #eef2ff;
    min-height: 100vh;
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #111827;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb {
    background: #3b82f6;
    border-radius: 10px;
  }

  .glass-header {
    backdrop-filter: blur(14px);
    background: rgba(15, 23, 42, 0.7);
    border-bottom: 1px solid rgba(59, 130, 246, 0.25);
    padding: 0 32px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
  }

  .logo-img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 14px;
    box-shadow: 0 6px 12px -4px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(59, 130, 246, 0.4);
    transition: transform 0.2s ease;
  }
  
  .logo-img:hover {
    transform: scale(1.02);
  }

  .logo-area h2 {
    font-weight: 700;
    font-size: 1.65rem;
    background: linear-gradient(135deg, #ffffff, #94a3f8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.3px;
  }

  .refresh-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(59, 130, 246, 0.5);
    backdrop-filter: blur(4px);
    padding: 10px 20px;
    border-radius: 40px;
    font-weight: 500;
    font-size: 0.9rem;
    color: #e2e8ff;
    transition: all 0.25s ease;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .refresh-btn i {
    font-size: 1rem;
    transition: transform 0.3s ease;
  }

  .refresh-btn:hover {
    background: #2563eb;
    border-color: #3b82f6;
    box-shadow: 0 5px 12px rgba(37, 99, 235, 0.3);
    transform: scale(0.97);
  }

  .refresh-btn:hover i {
    transform: rotate(180deg);
  }

  .dashboard-container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 32px 48px;
  }

  .stats-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .stat-card {
    background: rgba(30, 41, 59, 0.65);
    backdrop-filter: blur(12px);
    border-radius: 28px;
    padding: 18px 24px;
    flex: 1;
    min-width: 160px;
    border: 1px solid rgba(71, 85, 105, 0.5);
    transition: all 0.2s;
    box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.3);
  }

  .stat-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
    color: #9ca3ef;
    margin-bottom: 8px;
  }

  .stat-number {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(120deg, #f0f9ff, #b9c8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }

  .order-card-modern {
    background: rgba(18, 25, 45, 0.75);
    backdrop-filter: blur(8px);
    border-radius: 32px;
    padding: 24px 28px;
    border: 1px solid rgba(59, 130, 246, 0.3);
    box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .order-card-modern:hover {
    border-color: rgba(59, 130, 246, 0.6);
    box-shadow: 0 24px 40px -14px rgba(0, 0, 0, 0.5);
  }

  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .section-header h3 {
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #f1f5f9, #cbd5ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .badge-pulse {
    background: #2563eb20;
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 0.8rem;
    font-weight: 500;
    color: #90adff;
    border: 1px solid #3b82f640;
  }

  .order-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .order-table th {
    text-align: left;
    padding: 16px 8px 12px 0;
    font-weight: 600;
    color: #b9c4f0;
    border-bottom: 1px solid rgba(71, 85, 105, 0.6);
    letter-spacing: 0.3px;
  }

  .order-table td {
    padding: 16px 8px 16px 0;
    border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    vertical-align: middle;
  }

  .order-table tr:last-child td {
    border-bottom: none;
  }

  .order-table tr:hover td {
    background: rgba(59, 130, 246, 0.08);
    border-radius: 12px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    backdrop-filter: blur(2px);
    width: fit-content;
  }
  
  .status-badge i {
    font-size: 0.7rem;
  }

  .status-pending_seller_approval {
    background: #f97316cc;
    color: #1e1b0a;
    box-shadow: 0 0 6px #f9736080;
  }
  .status-accepted {
    background: #3b82f6cc;
    color: white;
  }
  .status-completed {
    background: #10b981cc;
    color: white;
  }
  .status-shipped {
    background: #8b5cf6cc;
    color: white;
  }
  .status-cancelled {
    background: #6b7280cc;
    color: #f3f4f6;
  }

  .action-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    padding: 7px 16px;
    border-radius: 40px;
    font-weight: 500;
    font-size: 0.75rem;
    cursor: pointer;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    color: #eef2ff;
    backdrop-filter: blur(4px);
  }

  .btn-accept {
    background: linear-gradient(105deg, #10b981, #059669);
    box-shadow: 0 2px 8px rgba(16,185,129,0.3);
    color: white;
  }
  .btn-accept:hover {
    transform: translateY(-2px);
    background: linear-gradient(105deg, #34d399, #10b981);
    box-shadow: 0 8px 18px rgba(16,185,129,0.4);
  }
  .btn-reject {
    background: linear-gradient(105deg, #ef4444, #dc2626);
    box-shadow: 0 2px 8px rgba(239,68,68,0.3);
    color: white;
  }
  .btn-reject:hover {
    transform: translateY(-2px);
    background: linear-gradient(105deg, #f87171, #ef4444);
  }
  .btn-view {
    background: rgba(59,130,246,0.2);
    border: 1px solid #3b82f6;
    color: #bfd6ff;
  }
  .btn-view:hover {
    background: #3b82f6;
    color: white;
    border-color: #3b82f6;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: #94a3b8;
    font-weight: 500;
    background: rgba(0,0,0,0.2);
    border-radius: 32px;
  }

  .loading-spinner {
    text-align: center;
    padding: 48px 24px;
    color: #94a3b8;
  }

  .error-message {
    text-align: center;
    padding: 48px 24px;
    color: #f87171;
    background: rgba(239,68,68,0.1);
    border-radius: 32px;
    margin: 20px 0;
  }

  @media (max-width: 780px) {
    .dashboard-container {
      padding: 20px 18px;
    }
    .order-table th, .order-table td {
      padding-right: 6px;
      font-size: 0.8rem;
    }
    .action-group {
      flex-direction: column;
      gap: 6px;
    }
    .glass-header {
      padding: 0 20px;
    }
    .logo-area h2 {
      font-size: 1.3rem;
    }
  }
</style>
</head>
<body>

<header class="glass-header">
  <div class="logo-area">
    <img class="logo-img" src="https://i.pinimg.com/736x/02/49/75/0249752685670a5f2b0979b60df290a6.jpg" alt="Brand Logo">
    <h2>Nexus Seller Hub</h2>
  </div>
  <button class="refresh-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> Refresh</button>
</header>

<div class="dashboard-container">
  <div class="stats-row" id="statsContainer">
    <div class="stat-card"><div class="stat-title">Total Orders</div><div class="stat-number" id="statTotal">—</div></div>
    <div class="stat-card"><div class="stat-title">Pending Approval</div><div class="stat-number" id="statPending">—</div></div>
    <div class="stat-card"><div class="stat-title">Active Sales</div><div class="stat-number" id="statActive">—</div></div>
  </div>

  <div class="order-card-modern">
    <div class="section-header">
      <h3><i class="fas fa-truck-fast" style="font-size: 1.4rem;"></i> Order management</h3>
      <span class="badge-pulse"><i class="fas fa-clock"></i> live updates</span>
    </div>
    <div style="overflow-x: auto;">
      <table class="order-table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersList">
          <tr><td colspan="6" class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading orders from server...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Pure real API implementation - no mock data
  async function loadOrders() {
    const tbody = document.getElementById('ordersList');
    const statTotal = document.getElementById('statTotal');
    const statPending = document.getElementById('statPending');
    const statActive = document.getElementById('statActive');
    
    // Show loading state
    tbody.innerHTML = '<tr><td colspan="6" class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Fetching orders...</td></tr>';
    statTotal.innerText = '—';
    statPending.innerText = '—';
    statActive.innerText = '—';
    
    try {
      const res = await fetch('/api/seller/physical-orders', { 
        credentials: 'include',
        headers: {
          'Accept': 'application/json'
        }
      });
      
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
      
      const data = await res.json();
      
      if (!data.orders || !Array.isArray(data.orders)) {
        throw new Error('Invalid response format: orders array missing');
      }
      
      const orders = data.orders;
      
      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><i class="fas fa-box-open"></i> No orders found</td></tr>';
        updateStats(orders);
        return;
      }
      
      renderOrdersTable(orders);
      updateStats(orders);
      
    } catch (error) {
      console.error('Failed to load orders:', error);
      tbody.innerHTML = `<tr><td colspan="6" class="error-message">
        <i class="fas fa-exclamation-triangle"></i> Failed to load orders<br>
        <small style="display: block; margin-top: 8px;">${error.message}</small>
        <button onclick="loadOrders()" style="margin-top: 12px; background: #3b82f6; border: none; padding: 6px 16px; border-radius: 20px; color: white; cursor: pointer;">
          <i class="fas fa-sync-alt"></i> Retry
        </button>
      </td></tr>`;
      updateStats([]);
    }
  }
  
  function renderOrdersTable(orders) {
    const tbody = document.getElementById('ordersList');
    
    tbody.innerHTML = orders.map(o => {
      let statusIcon = '<i class="fas fa-circle"></i>';
      if (o.order_status === 'pending_seller_approval') statusIcon = '<i class="fas fa-hourglass-half"></i>';
      else if (o.order_status === 'accepted') statusIcon = '<i class="fas fa-check-circle"></i>';
      else if (o.order_status === 'completed') statusIcon = '<i class="fas fa-clipboard-check"></i>';
      else if (o.order_status === 'cancelled') statusIcon = '<i class="fas fa-ban"></i>';
      else if (o.order_status === 'shipped') statusIcon = '<i class="fas fa-shipping-fast"></i>';
      
      const statusText = (o.order_status || '').replace(/_/g, ' ').toUpperCase();
      
      return `
        <tr data-order-id="${o.id}">
          <td style="font-weight: 500;">#${o.id}</td>
          <td><span style="display: flex; align-items: center; gap: 6px;"><i class="fas fa-tag" style="opacity:0.7"></i> ${escapeHtml(o.product_name || 'N/A')}</span></td>
          <td>${o.quantity || 0}</td>
          <td><span style="font-weight: 600;">$${parseFloat(o.total_amount || 0).toFixed(2)}</span></td>
          <td><span class="status-badge status-${o.order_status || 'unknown'}">${statusIcon} ${statusText}</span></td>
          <td class="action-group">
            ${o.order_status === 'pending_seller_approval' ? `
              <button class="btn btn-accept" data-id="${o.id}" data-action="accept"><i class="fas fa-check"></i> Accept</button>
              <button class="btn btn-reject" data-id="${o.id}" data-action="reject"><i class="fas fa-times"></i> Reject</button>
            ` : `<button class="btn btn-view" data-id="${o.id}"><i class="fas fa-eye"></i> View details</button>`}
          </td>
        </tr>
      `;
    }).join('');
    
    // Attach event listeners for accept/reject buttons
    document.querySelectorAll('.btn-accept, .btn-reject').forEach(btn => {
      btn.removeEventListener('click', handleActionClick);
      btn.addEventListener('click', handleActionClick);
    });
    
    document.querySelectorAll('.btn-view').forEach(btn => {
      btn.removeEventListener('click', handleViewClick);
      btn.addEventListener('click', handleViewClick);
    });
  }
  
  async function handleActionClick(e) {
    const btn = e.currentTarget;
    const orderId = parseInt(btn.getAttribute('data-id'));
    const action = btn.getAttribute('data-action');
    
    if (!orderId || !action) return;
    
    // Disable button to prevent double submission
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing...';
    
    try {
      const response = await fetch(`/api/physical-orders/${orderId}/respond`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ action }),
        credentials: 'include'
      });
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      
      // Reload orders to reflect the updated status
      await loadOrders();
      
    } catch (error) {
      console.error('Failed to process order:', error);
      alert(`Failed to ${action} order #${orderId}: ${error.message}`);
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }
  
  function handleViewClick(e) {
    const btn = e.currentTarget;
    const orderId = btn.getAttribute('data-id');
    if (orderId) {
      // You can replace this with a modal or navigation to order detail page
      alert(`📦 Order #${orderId}\n\nDetailed view would appear here.\nThis can be extended with a modal or detail page.`);
    }
  }
  
  function updateStats(orders) {
    const statTotal = document.getElementById('statTotal');
    const statPending = document.getElementById('statPending');
    const statActive = document.getElementById('statActive');
    
    const total = orders.length;
    const pending = orders.filter(o => o.order_status === 'pending_seller_approval').length;
    const active = orders.filter(o => o.order_status === 'accepted' || o.order_status === 'pending_seller_approval').length;
    
    statTotal.innerText = total;
    statPending.innerText = pending;
    statActive.innerText = active;
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  
  // Initial load
  loadOrders();
</script>
</body>
</html>
