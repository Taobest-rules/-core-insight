<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Core Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        /* Marketplace Banner - Replacement for Bismillah */
        .marketplace-banner {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
            transition: all 0.3s ease;
        }
        .marketplace-banner span {
            color: gold;
            font-size: 1.1rem;
            line-height: 1.5;
            display: block;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .marketplace-banner span:first-child {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255,215,0,0.3);
        }
        .marketplace-banner span:last-child {
            font-size: 0.85rem;
            font-weight: 500;
            color: #FFD700;
            opacity: 0.95;
        }
        h2 { color: #e6f1ff; margin-bottom: 24px; }
        .spinner {
            border: 4px solid #334155;
            border-top-color: #FFD700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .btn, .download-btn, .watch-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
        }
        .download-btn {
            background: #10b981;
            color: white;
        }
        .watch-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        .btn:hover, .download-btn:hover, .watch-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .product-info {
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
        }
        .course-info {
            background: rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
        }
        
        @media (max-width: 480px) {
            .container { padding: 25px; }
            .marketplace-banner span:first-child { font-size: 1.3rem; }
            .marketplace-banner span:last-child { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Core Insight Marketplace Banner (Replaces Bismillah) -->
        <div class="marketplace-banner">
            <span style="color: gold;">Core Insight MarketPlace</span>
            <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
        </div>
        <div id="paymentStatus">
            <h2>Processing Payment...</h2>
            <div class="spinner"></div>
            <p id="message" style="color: #94a3b8;">Please wait while we verify your payment...</p>
        </div>
    </div>

    <script>
        // Get payment reference from URL (supports multiple formats)
        const urlParams = new URLSearchParams(window.location.search);
        let reference = urlParams.get('reference') || urlParams.get('trxref') || urlParams.get('tx_ref') || urlParams.get('transaction_id');
        let paymentType = urlParams.get('type') || 'auto'; // 'course', 'digital', or 'auto'
        
        console.log('Payment callback received. Reference:', reference, 'Type:', paymentType);
        
        // Clean the reference (remove Paystack prefix if present)
        if (reference && reference.startsWith('PS_')) {
            reference = reference.substring(3);
            console.log('Removed PS_ prefix. New reference:', reference);
        }
        
        async function verifyPayment() {
            if (!reference) {
                showError('No payment reference found. Please contact support.');
                return;
            }
            
            try {
                console.log('Verifying payment with reference:', reference);
                
                // Try to detect payment type from reference
                if (paymentType === 'auto') {
                    if (reference.startsWith('coreinsight_')) {
                        paymentType = 'course';
                        console.log('Detected COURSE payment from reference');
                    } else if (reference.startsWith('DIGITAL_')) {
                        paymentType = 'digital';
                        console.log('Detected DIGITAL product payment from reference');
                    }
                }
                
                let response;
                
                if (paymentType === 'course') {
                    // Verify course payment
                    console.log('Verifying COURSE payment...');
                    response = await fetch(`/api/verify-by-reference/${encodeURIComponent(reference)}`, {
                        method: 'GET',
                        credentials: 'include',
                        headers: { 'Accept': 'application/json' }
                    });
                } else {
                    // Verify digital product payment
                    console.log('Verifying DIGITAL product payment...');
                    response = await fetch(`/api/verify-digital-payment/${encodeURIComponent(reference)}`, {
                        method: 'GET',
                        credentials: 'include',
                        headers: { 'Accept': 'application/json' }
                    });
                }
                
                const data = await response.json();
                console.log('Verification response:', data);
                
                if (data.status === 'success') {
                    // Payment successful - show appropriate success message
                    if (paymentType === 'course' || data.type === 'course') {
                        showCourseSuccess(data);
                    } else {
                        showDigitalSuccess(data);
                    }
                    sessionStorage.removeItem('pendingOrder');
                } else {
                    showError(data.message || 'Payment verification failed. Please contact support.');
                }
                
            } catch (error) {
                console.error('Verification error:', error);
                showError('Error verifying payment. Please contact support with your transaction reference.');
            }
        }
        
        function showCourseSuccess(data) {
            const isVideo = data.is_video || false;
            const actionText = isVideo ? 'watch' : 'access';
            
            document.getElementById('paymentStatus').innerHTML = `
                <div class="marketplace-banner">
                    <span style="color: gold;">Core Insight MarketPlace</span>
                    <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
                </div>
                <div class="success" style="font-size: 48px; margin: 20px 0;">✅</div>
                <h2 style="color: #10b981;">Payment Successful!</h2>
                <div class="course-info">
                    <strong>${escapeHtml(data.course_title || 'Course')}</strong><br>
                    You now have access to this course!
                </div>
                <p style="margin: 15px 0;">Click below to ${actionText} your course content.</p>
                <div>
                    <a href="/courses.html" class="btn">
                        <i class="fas fa-graduation-cap"></i> Go to Courses
                    </a>
                    <a href="/api/download/${data.course_id}" class="download-btn">
                        <i class="fas fa-download"></i> Download Now
                    </a>
                    ${isVideo ? `<a href="/watch.html?course=${data.course_id}" class="watch-btn">
                        <i class="fas fa-play"></i> Watch Now
                    </a>` : ''}
                </div>
            `;
        }
        
        function showDigitalSuccess(data) {
            document.getElementById('paymentStatus').innerHTML = `
                <div class="marketplace-banner">
                    <span style="color: gold;">Core Insight MarketPlace</span>
                    <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
                </div>
                <div class="success" style="font-size: 48px; margin: 20px 0;">✅</div>
                <h2 style="color: #10b981;">Payment Successful!</h2>
                <div class="product-info">
                    <strong>${escapeHtml(data.product_title || 'Digital Product')}</strong><br>
                    Thank you for your purchase!
                </div>
                <p style="margin: 15px 0;">Your download link is ready. It will expire in 7 days.</p>
                <div>
                    <a href="${data.download_url}" class="download-btn" target="_blank">
                        <i class="fas fa-download"></i> Download Now
                    </a>
                    <a href="/products.html" class="btn">Continue Shopping</a>
                </div>
            `;
        }
        
        function showError(message) {
            document.getElementById('paymentStatus').innerHTML = `
                <div class="marketplace-banner">
                    <span style="color: gold;">Core Insight MarketPlace</span>
                    <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
                </div>
                <div class="error" style="font-size: 48px; margin: 20px 0;">❌</div>
                <h2 style="color: #ef4444;">Verification Failed</h2>
                <p style="color: #94a3b8;">${escapeHtml(message)}</p>
                <p style="color: #94a3b8; font-size: 12px; margin-top: 10px;">Transaction Reference: ${escapeHtml(reference)}</p>
                <div style="margin-top: 20px;">
                    <a href="/courses.html" class="btn">Browse Courses</a>
                    <a href="/products.html" class="btn">Browse Products</a>
                </div>
            `;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Start verification
        if (reference) {
            verifyPayment();
        } else {
            showError('No payment reference found in URL.');
        }
    </script>
</body>
</html>
