<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #fff;
  margin: 0;
}

header {
  background: #020617;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo-img {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid #3b82f6;
}

header h2 {
  margin: 0;
}

h1 {
  margin: 20px;
}

.container {
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.table {
  width: 100%;
  border-collapse: collapse;
}

.table th {
  background: #020617;
  padding: 12px;
  text-align: left;
}

.table td {
  padding: 12px;
  border-bottom: 1px solid #334155;
}

.table tr:hover {
  background: #334155;
}

.status {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  display: inline-block;
}

.pending { background: orange; color: black; }
.pending_seller_approval { background: orange; color: black; }
.accepted { background: #3b82f6; }
.completed { background: #10b981; }
.seller_accepted { background: #3b82f6; }

button {
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}

.accept-btn {
  background: linear-gradient(135deg, #10b981, #22c55e);
  color: white;
}

.reject-btn {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
}

.accept-btn:hover {
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

.reject-btn:hover {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
}

.view-btn {
  background: #3b82f6;
  color: white;
}

.error-message {
  background: rgba(239, 68, 68, 0.2);
  border: 1px solid #ef4444;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  margin: 20px 0;
}

.error-message i {
  font-size: 48px;
  color: #ef4444;
  margin-bottom: 10px;
}

.login-prompt {
  background: rgba(59, 130, 246, 0.2);
  border: 1px solid #3b82f6;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
}

.login-prompt a {
  color: #3b82f6;
  text-decoration: none;
  font-weight: bold;
}

.login-prompt a:hover {
  text-decoration: underline;
}

@media (max-width: 768px) {
  header {
    padding: 12px 16px;
  }
  .logo-img {
    width: 32px;
    height: 32px;
  }
  .container {
    padding: 12px;
  }
  .table {
    font-size: 12px;
  }
  .table th, .table td {
    padding: 8px;
  }
  button {
    padding: 5px 8px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-left">
    <img class="logo-img" src="https://i.pinimg.com/736x/02/49/75/0249752685670a5f2b0979b60df290a6.jpg" alt="Logo">
    <h2>Seller Dashboard</h2>
  </div>
  <button onclick="location.reload()">
    <i class="fas fa-sync-alt"></i> Refresh
  </button>
</header>

<div class="container">

<div class="card">
  <h3><i class="fas fa-shopping-cart"></i> Orders</h3>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="ordersList">
      <tr><td colspan="6" style="text-align: center;"><i class="fas fa-spinner fa-pulse"></i> Loading...</td></tr>
    </tbody>
  </table>
</div>

</div>

<script>
async function loadOrders() {
  const tbody = document.getElementById('ordersList');
  
  try {
    const res = await fetch('/api/seller/physical-orders', {credentials:'include'});
    
    // Handle 401 Unauthorized
    if (res.status === 401) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6">
            <div class="login-prompt">
              <i class="fas fa-lock" style="font-size: 32px; margin-bottom: 10px; display: block;"></i>
              <strong>Session expired or not logged in</strong><br>
              Please <a href="/login">click here to login</a> as a seller
            </div>
          </td>
        </tr>
      `;
      return;
    }
    
    const data = await res.json();
    
    // Handle other errors
    if (!res.ok) {
      throw new Error(data.error || 'Failed to load orders');
    }

    if (!data.orders || data.orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">📦 No orders found</td></tr>';
      return;
    }

    tbody.innerHTML = data.orders.map(o => {
      // Handle different status naming conventions
      const statusClass = o.order_status === 'pending_seller_approval' ? 'pending' : 
                         (o.order_status === 'seller_accepted' ? 'accepted' : o.order_status);
      const displayStatus = o.order_status === 'pending_seller_approval' ? 'pending' : 
                           (o.order_status === 'seller_accepted' ? 'accepted' : o.order_status);
      
      return `
        <tr>
          <td>#${o.id}</td>
          <td>${o.product_name || 'Product'}</td>
          <td>${o.quantity || 1}</td>
          <td>$${parseFloat(o.total_amount || 0).toFixed(2)}</td>
          <td><span class="status ${statusClass}">${displayStatus}</span></td>
          <td>
            ${(o.order_status === 'pending_seller_approval' || o.order_status === 'pending') ? `
              <button class="accept-btn" onclick="respond(${o.id}, 'accept')">✓ Accept</button>
              <button class="reject-btn" onclick="respond(${o.id}, 'reject')">✗ Reject</button>
            ` : `<button class="view-btn" onclick="viewOrder(${o.id})">👁️ View</button>`}
          </td>
        </tr>
      `;
    }).join('');
    
  } catch (err) {
    console.error('Error loading orders:', err);
    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i><br>
            <strong>Error loading orders</strong><br>
            ${err.message}<br>
            <button onclick="loadOrders()" style="margin-top: 10px; background: #3b82f6; padding: 6px 12px;">
              <i class="fas fa-sync-alt"></i> Retry
            </button>
          </div>
        </td>
      </tr>
    `;
  }
}

async function respond(id, action) {
  try {
    const response = await fetch(`/api/physical-orders/${id}/respond`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action}),
      credentials:'include'
    });
    
    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.error || 'Failed to process order');
    }
    
    // Reload orders after successful response
    await loadOrders();
    
  } catch (err) {
    console.error('Error responding to order:', err);
    alert(`Failed to ${action} order: ${err.message}`);
  }
}

function viewOrder(id) {
  alert(`View details for order #${id}\nThis feature can be expanded to show full order details.`);
}

// Load orders on page load
loadOrders();
</script>

</body>
</html>
