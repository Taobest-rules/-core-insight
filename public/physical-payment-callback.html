<!DOCTYPE html>
<html>
<head>
    <title>Payment Processing - Core Insight</title>
    <style>
        body {
            background: #0a192f;
            color: #e6f1ff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1e293b;
            border-radius: 16px;
            max-width: 500px;
        }
        .spinner {
            border: 4px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .btn {
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Processing Payment...</h2>
        <div class="spinner"></div>
        <p id="message">Please wait while we verify your payment...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const transactionId = urlParams.get('transaction_id');
        const status = urlParams.get('status');
        
        async function verifyPayment() {
            try {
                // Try to get transaction_ref from session storage first
                const pendingOrder = sessionStorage.getItem('pendingPhysicalOrder');
                let transactionRef = null;
                
                if (pendingOrder) {
                    const orderData = JSON.parse(pendingOrder);
                    transactionRef = orderData.paymentReference;
                }
                
                // If we have transaction_id from URL, use that
                if (transactionId) {
                    const response = await fetch(`/api/verify-physical-payment/${transactionId}`);
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        document.getElementById('message').innerHTML = `
                            <span class="success">✅ Payment Successful!</span><br>
                            Order #${data.orderId}<br>
                            Amount: $${data.amount}
                        `;
                        document.querySelector('.spinner').style.display = 'none';
                        setTimeout(() => {
                            window.location.href = '/order-success.html?orderId=' + data.orderId;
                        }, 3000);
                    } else {
                        document.getElementById('message').innerHTML = `
                            <span class="error">❌ Payment Failed</span><br>
                            ${data.message || 'Please try again.'}
                        `;
                        document.querySelector('.spinner').style.display = 'none';
                        setTimeout(() => {
                            window.location.href = '/products.html';
                        }, 3000);
                    }
                } else if (status === 'successful' && transactionRef) {
                    const response = await fetch(`/api/verify-physical-payment/${transactionRef}`);
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        document.getElementById('message').innerHTML = `
                            <span class="success">✅ Payment Successful!</span><br>
                            Order #${data.orderId}<br>
                            Amount: $${data.amount}
                        `;
                        document.querySelector('.spinner').style.display = 'none';
                        sessionStorage.removeItem('pendingPhysicalOrder');
                        setTimeout(() => {
                            window.location.href = '/order-success.html?orderId=' + data.orderId;
                        }, 3000);
                    }
                } else {
                    document.getElementById('message').innerHTML = `
                        <span class="error">❌ Payment verification failed</span><br>
                        Please contact support.
                    `;
                    document.querySelector('.spinner').style.display = 'none';
                    setTimeout(() => {
                        window.location.href = '/products.html';
                    }, 3000);
                }
            } catch (error) {
                console.error('Verification error:', error);
                document.getElementById('message').innerHTML = `
                    <span class="error">❌ Error verifying payment</span><br>
                    Please contact support.
                `;
                document.querySelector('.spinner').style.display = 'none';
            }
        }
        
        verifyPayment();
    </script>
</body>
</html>
