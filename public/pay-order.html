<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Payment - Core Insight</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0a192f;
      color: #e6f1ff;
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    .payment-card {
      background: #1e293b;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    
    .payment-header {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      padding: 30px;
      text-align: center;
    }
    
    .payment-header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .payment-header p {
      opacity: 0.9;
    }
    
    .payment-body {
      padding: 30px;
    }
    
    .order-summary {
      background: #0f172a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid #334155;
    }
    
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }
    
    .summary-row:last-child {
      border-bottom: none;
    }
    
    .summary-row.total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid #3b82f6;
      font-weight: 700;
      font-size: 18px;
    }
    
    .fee-breakdown {
      background: rgba(59, 130, 246, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    
    .fee-breakdown h4 {
      color: #3b82f6;
      margin-bottom: 12px;
      font-size: 14px;
    }
    
    .breakdown-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    
    .payment-methods {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 24px 0;
    }
    
    .method-btn {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .method-btn:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
    }
    
    .method-btn.selected {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }
    
    .method-btn i {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
    }
    
    .method-btn span {
      display: block;
      font-weight: 500;
    }
    
    .pay-btn {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 20px;
    }
    
    .pay-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }
    
    .pay-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: #3b82f6;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
    }
    
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid #ef4444;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #ef4444;
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .status-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }
    
    .status-success {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    
    .status-error {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    
    @media (max-width: 640px) {
      .payment-methods {
        grid-template-columns: 1fr;
      }
      
      .payment-body {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="payment-card">
      <div class="payment-header">
        <i class="fas fa-credit-card" style="font-size: 48px; margin-bottom: 16px;"></i>
        <h1>Complete Payment</h1>
        <p>Secure payment to confirm your order</p>
      </div>
      
      <div class="payment-body">
        <div id="loadingState" class="loading">
          <i class="fas fa-spinner fa-spin fa-2x"></i>
          <p style="margin-top: 12px;">Loading order details...</p>
        </div>
        
        <div id="errorState" style="display: none;">
          <div class="error-message" id="errorMessage"></div>
          <a href="/products.html" class="back-link">← Back to Products</a>
        </div>
        
        <div id="paymentContent" style="display: none;">
          <div class="order-summary">
            <div class="summary-row">
              <span>Order ID:</span>
              <strong id="orderId">-</strong>
            </div>
            <div class="summary-row">
              <span>Product:</span>
              <strong id="productName">-</strong>
            </div>
            <div class="summary-row">
              <span>Quantity:</span>
              <span id="quantity">-</span>
            </div>
            <div class="summary-row">
              <span>Unit Price:</span>
              <span id="unitPrice">-</span>
            </div>
            <div class="summary-row total">
              <span>Total Amount:</span>
              <strong id="totalAmount" style="color: #10b981;">-</strong>
            </div>
          </div>
          
          <div id="feeBreakdownContainer" style="display: none;"></div>
          
          <h3 style="margin-bottom: 16px;">Select Payment Method</h3>
          <div class="payment-methods">
            <div class="method-btn selected" data-method="flutterwave">
              <i class="fas fa-globe"></i>
              <span>Flutterwave</span>
              <small style="font-size: 11px; color: #94a3b8;">Cards, Bank Transfer, USSD</small>
            </div>
            <div class="method-btn" data-method="paystack">
              <i class="fas fa-map-marker-alt"></i>
              <span>Paystack</span>
              <small style="font-size: 11px; color: #94a3b8;">Cards, Bank Transfer, USSD</small>
            </div>
          </div>
          
          <button id="payNowBtn" class="pay-btn">
            <i class="fas fa-lock"></i> Pay Now
          </button>
          
          <div style="text-align: center; margin-top: 20px;">
            <a href="/products.html" class="back-link">← Back to Products</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let selectedMethod = 'flutterwave';
    let orderData = null;
    let currentUserId = null;
    
    // Get orderId from URL
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    
    if (!orderId) {
      showError('No order ID provided');
    }
    
    // Payment method selection
    document.querySelectorAll('.method-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        selectedMethod = this.getAttribute('data-method');
      });
    });
    
    // Check authentication first
    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { 
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        });
        
        if (!res.ok) {
          const returnUrl = encodeURIComponent(window.location.href);
          window.location.href = `/login.html?redirect=${returnUrl}`;
          return false;
        }
        
        const user = await res.json();
        currentUserId = user?.id;
        return true;
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = '/login.html';
        return false;
      }
    }
    
    // Load order details
    async function loadOrderDetails() {
      const loadingState = document.getElementById('loadingState');
      const errorState = document.getElementById('errorState');
      const paymentContent = document.getElementById('paymentContent');
      
      try {
        // Show loading
        loadingState.style.display = 'block';
        errorState.style.display = 'none';
        paymentContent.style.display = 'none';
        
        const response = await fetch(`/api/orders/${orderId}`, {
          credentials: 'include',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          }
        });
        
        if (response.status === 401) {
          // Not authenticated - redirect to login
          const returnUrl = encodeURIComponent(window.location.pathname + window.location.search);
          window.location.href = `/login.html?redirect=${returnUrl}`;
          return;
        }
        
        if (response.status === 404) {
          showError('Order not found. Please check the order ID and try again.');
          return;
        }
        
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || `HTTP ${response.status}`);
        }
        
        const data = await response.json();
        console.log('Order data received:', data);
        
        if (!data.success || !data.order) {
          throw new Error('Invalid order data');
        }
        
        orderData = data.order;
        
        // Check if user is the buyer
        if (orderData.buyer && orderData.buyer.id !== currentUserId) {
          showError('You are not authorized to view this order.');
          return;
        }
        
        // Check if order is in correct state
        if (orderData.order_status !== 'seller_accepted') {
          let statusMessage = '';
          let actionMessage = '';
          
          switch(orderData.order_status) {
            case 'pending_seller_approval':
              statusMessage = '⏳ Order Pending Seller Approval';
              actionMessage = 'The seller has not yet accepted your order. Please wait for the seller to confirm availability. You will receive an email when accepted.';
              break;
            case 'paid':
              statusMessage = '✅ Order Already Paid';
              actionMessage = 'This order has already been paid for.';
              break;
            case 'completed':
              statusMessage = '✓ Order Completed';
              actionMessage = 'This order has been completed.';
              break;
            case 'cancelled':
              statusMessage = '❌ Order Cancelled';
              actionMessage = 'This order was cancelled by the seller.';
              break;
            default:
              statusMessage = `Order Status: ${orderData.order_status}`;
              actionMessage = 'Payment is not available for this order at this time.';
          }
          
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('errorState').style.display = 'block';
          document.getElementById('errorMessage').innerHTML = `
            <strong>${statusMessage}</strong><br><br>
            ${actionMessage}<br><br>
            <a href="/products.html" class="back-link">← Back to Products</a>
          `;
          return;
        }
        
        // Update UI with order details
        document.getElementById('orderId').textContent = `#${orderData.id}`;
        document.getElementById('productName').textContent = orderData.product_name || 'Product';
        document.getElementById('quantity').textContent = orderData.quantity;
        document.getElementById('unitPrice').textContent = `$${orderData.price.toFixed(2)}`;
        document.getElementById('totalAmount').textContent = `$${orderData.total_amount.toFixed(2)}`;
        
        // Show fee breakdown if available
        if (orderData.fee_breakdown) {
          const fb = orderData.fee_breakdown;
          const container = document.getElementById('feeBreakdownContainer');
          
          let breakdownHtml = `
            <div class="fee-breakdown">
              <h4><i class="fas fa-calculator"></i> Fee Breakdown</h4>
          `;
          
          if (fb.type === 'bulk') {
            breakdownHtml += `
              <div class="breakdown-item">
                <span>Bulk Order Discount Applied!</span>
                <span style="color: #10b981;">✓</span>
              </div>
              <div class="breakdown-item">
                <span>Base Fee (10% of product price):</span>
                <span>$${fb.base_fee?.toFixed(2) || '0.00'}</span>
              </div>
              <div class="breakdown-item">
                <span>Bulk Fee (10% of total):</span>
                <span>$${fb.bulk_fee?.toFixed(2) || '0.00'}</span>
              </div>
            `;
          } else {
            breakdownHtml += `
              <div class="breakdown-item">
                <span>Platform Fee (10% of product price):</span>
                <span>$${fb.platform_fee?.toFixed(2) || '0.00'}</span>
              </div>
            `;
          }
          
          breakdownHtml += `
              <div class="breakdown-item" style="margin-top: 12px; padding-top: 8px; border-top: 1px solid #334155;">
                <span><strong>Seller Receives:</strong></span>
                <span style="color: #10b981;"><strong>$${fb.seller_earnings?.toFixed(2) || '0.00'}</strong></span>
              </div>
            </div>
          `;
          
          container.innerHTML = breakdownHtml;
          container.style.display = 'block';
        }
        
        // Hide loading, show content
        loadingState.style.display = 'none';
        paymentContent.style.display = 'block';
        
      } catch (error) {
        console.error('Load order error:', error);
        showError(error.message || 'Failed to load order details');
      }
    }
    
// Pay button handler - IMPROVED VERSION
document.getElementById('payNowBtn').addEventListener('click', async () => {
  if (!orderData) {
    alert('Order data not loaded. Please refresh the page.');
    return;
  }
  
  const payBtn = document.getElementById('payNowBtn');
  payBtn.disabled = true;
  payBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating payment link...';
  
  try {
    console.log('Creating payment link for order:', orderId);
    
    const response = await fetch(`/api/physical-orders/${orderId}/get-payment-link`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      credentials: 'include'
    });
    
    const data = await response.json();
    console.log('Response:', data);
    
    if (!response.ok) {
      // Show detailed error message
      let errorMsg = data.error || data.details || 'Payment creation failed';
      if (data.flutterwave_message) {
        errorMsg += `\n\nFlutterwave says: ${data.flutterwave_message}`;
      }
      throw new Error(errorMsg);
    }
    
    if (data.paymentLink) {
      console.log('Redirecting to:', data.paymentLink);
      window.location.href = data.paymentLink;
    } else {
      throw new Error('No payment link received');
    }
    
  } catch (error) {
    console.error('Payment error:', error);
    alert('Payment Error:\n\n' + error.message);
    payBtn.disabled = false;
    payBtn.innerHTML = '<i class="fas fa-lock"></i> Pay Now';
  }
}); 
    // Show error message
    function showError(message) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      document.getElementById('errorMessage').innerHTML = message;
    }
    
    // Get current user info
    async function getCurrentUser() {
      try {
        const response = await fetch('/api/me', { 
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          const user = await response.json();
          currentUserId = user?.id;
          console.log('Current user ID:', currentUserId);
        }
      } catch (error) {
        console.error('Failed to get user:', error);
      }
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('Page loaded, checking authentication...');
      const isAuthenticated = await checkAuth();
      
      if (isAuthenticated) {
        await getCurrentUser();
        await loadOrderDetails();
      }
    });
  </script>
</body>
</html>
