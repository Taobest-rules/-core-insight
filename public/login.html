<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Core Insight</title>
    <style>
        :root {
            --primary-dark: #0f172a;
            --secondary-dark: #1e293b;
            --accent-gold: #FFD700;
            --text-light: #e0e0e0;
            --text-gray: #a0a0a0;
            --success: #10b981;
            --danger: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }
        
        .bismillah {
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        .bismillah span {
            color: #FFD700;
            font-size: 1.3rem;
            line-height: 1.8;
            display: block;
        }
        
        .bismillah .arabic {
            font-size: 1.8rem;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            margin-bottom: 0.5rem;
        }
        
        .bismillah .english {
            font-size: 1rem;
        }
        
        .auth-container {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--accent-gold), #D4AF37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.8rem;
        }
        
        .login-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            padding: 0.25rem;
            border-radius: 12px;
        }
        
        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-gray);
            padding: 0.75rem;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .toggle-btn.active {
            background: linear-gradient(135deg, var(--accent-gold), #D4AF37);
            color: #000;
        }
        
        .field-group {
            display: none;
        }
        
        .field-group.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-light);
            font-size: 16px;
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.25rem 0;
        }
        
        .forgot-link {
            color: var(--accent-gold);
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-gold), #D4AF37);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }
        
        button[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 10px;
            text-align: center;
        }
        
        .success { background: rgba(16, 185, 129, 0.15); color: #51cf66; }
        .error { background: rgba(239, 68, 68, 0.15); color: #ff6b6b; }
        .warning { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        
        .links {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .links a {
            color: var(--accent-gold);
            text-decoration: none;
        }
        
        .resend-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: var(--accent-gold);
            cursor: pointer;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="bismillah">
            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
        </div>
        
        <h2>Welcome Back</h2>
        
        <div class="login-toggle">
            <button class="toggle-btn active" id="usernameToggle">Username</button>
            <button class="toggle-btn" id="emailToggle">Email</button>
        </div>
        
        <form id="loginForm">
            <div class="field-group active" id="usernameGroup">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username">
                </div>
            </div>
            
            <div class="field-group" id="emailGroup">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
            
            <div class="options-row">
                <button type="button" class="forgot-link" onclick="openForgotModal()">Forgot Password?</button>
            </div>
            
            <button type="submit" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div id="loginMessage"></div>
        
        <div class="links">
            <a href="signup.html"><i class="fas fa-user-plus"></i> Don't have an account? Sign Up</a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: var(--secondary-dark); max-width: 400px; width: 90%; border-radius: 20px; padding: 2rem;">
            <h3 style="color: var(--accent-gold); margin-bottom: 1rem;">Reset Password</h3>
            <div id="forgotMessage"></div>
            <input type="email" id="resetEmail" placeholder="Enter your email" style="width: 100%; padding: 0.85rem; border-radius: 12px; background: rgba(15,23,42,0.8); border: 1px solid rgba(255,215,0,0.2); color: white; margin-bottom: 1rem;">
            <button onclick="sendResetLink()" style="width: 100%; padding: 0.85rem; background: var(--accent-gold); border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">Send Reset Link</button>
            <button onclick="closeForgotModal()" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem; background: transparent; border: 1px solid var(--accent-gold); border-radius: 12px; color: var(--accent-gold); cursor: pointer;">Cancel</button>
        </div>
    </div>

    <script>
        // Toggle between username and email
        const usernameToggle = document.getElementById('usernameToggle');
        const emailToggle = document.getElementById('emailToggle');
        const usernameGroup = document.getElementById('usernameGroup');
        const emailGroup = document.getElementById('emailGroup');

        usernameToggle.addEventListener('click', () => {
            usernameToggle.classList.add('active');
            emailToggle.classList.remove('active');
            usernameGroup.classList.add('active');
            emailGroup.classList.remove('active');
        });

        emailToggle.addEventListener('click', () => {
            emailToggle.classList.add('active');
            usernameToggle.classList.remove('active');
            emailGroup.classList.add('active');
            usernameGroup.classList.remove('active');
        });

        function openForgotModal() {
            document.getElementById('forgotModal').style.display = 'flex';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
        }

        async function sendResetLink() {
            const email = document.getElementById('resetEmail').value.trim();
            const messageDiv = document.getElementById('forgotMessage');
            
            if (!email) {
                messageDiv.innerHTML = '<div class="message error">Please enter your email</div>';
                return;
            }
            
            messageDiv.innerHTML = '<div class="message info">Sending...</div>';
            
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    messageDiv.innerHTML = '<div class="message success">Reset link sent! Check your email.</div>';
                    setTimeout(closeForgotModal, 2000);
                } else {
                    messageDiv.innerHTML = `<div class="message error">${data.error || 'Error sending reset link'}</div>`;
                }
            } catch (err) {
                messageDiv.innerHTML = '<div class="message error">Network error. Please try again.</div>';
            }
        }

        // LOGIN HANDLER
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('loginMessage');

            messageDiv.innerHTML = '';

            if (!password) {
                messageDiv.innerHTML = '<div class="message error">Please enter your password</div>';
                return;
            }

            const useUsername = usernameToggle.classList.contains('active');
            
            if (useUsername && !username) {
                messageDiv.innerHTML = '<div class="message error">Please enter your username</div>';
                return;
            }
            
            if (!useUsername && !email) {
                messageDiv.innerHTML = '<div class="message error">Please enter your email</div>';
                return;
            }

            const loginData = useUsername 
                ? { username, password } 
                : { email, password };

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData),
                    credentials: 'include'
                });

                const data = await res.json();
                
                if (res.ok) {
                    messageDiv.innerHTML = '<div class="message success">✅ Login successful! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    if (data.unverified || (data.error && data.error.toLowerCase().includes('verify'))) {
                        messageDiv.innerHTML = `
                            <div class="message warning">
                                ⚠️ Please verify your email before logging in.<br>
                                Check your inbox for the verification link.<br>
                                <a href="verify.html" style="color: var(--accent-gold);">Click here to verify</a>
                            </div>
                        `;
                    } else {
                        messageDiv.innerHTML = `<div class="message error">${data.error || 'Invalid credentials'}</div>`;
                    }
                }
            } catch (err) {
                messageDiv.innerHTML = '<div class="message error">Connection error. Please try again.</div>';
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });

        // Check for message parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('message') === 'check_email') {
            document.getElementById('loginMessage').innerHTML = '<div class="message success">✅ Account created! Please check your email for verification link.</div>';
        }
        if (urlParams.get('verified') === 'true') {
            document.getElementById('loginMessage').innerHTML = '<div class="message success">✅ Email verified! You can now login.</div>';
        }

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('forgotModal');
            if (e.target === modal) closeForgotModal();
        });
    </script>
</body>
</html>
