<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Successful | Core Insight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      color: #22c55e;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5f5;
      font-size: 14px;
    }

    .loader {
      margin: 20px auto;
      border: 4px solid #1e293b;
      border-top: 4px solid #22c55e;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      color: #ef4444;
      margin-top: 15px;
    }

    .success {
      color: #22c55e;
      margin-top: 15px;
    }

    a.btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }

    a.btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Processing Payment</h1>
    <p>Please wait while we confirm your payment.</p>
    <div class="loader"></div>
    <div id="status"></div>
  </div>

<script>
(async function () {
  const statusEl = document.getElementById("status");
  const params = new URLSearchParams(window.location.search);

  const reference =
    params.get("reference") ||   // Paystack
    params.get("tx_ref");        // Flutterwave

  if (!reference) {
    statusEl.innerHTML = `<p class="error">Invalid payment reference.</p>`;
    return;
  }

  try {
    // 🔍 Try Paystack verification first
    let response = await fetch(`/api/verify/paystack/${reference}`);
    let result = await response.json();

    // 🔁 If not Paystack, try Flutterwave
    if (!result.success) {
      response = await fetch(`/api/verify/flutterwave/${reference}`);
      result = await response.json();
    }

    if (!result.success) {
      statusEl.innerHTML = `<p class="error">Payment verification failed.</p>`;
      return;
    }

    // ✅ Payment confirmed
    statusEl.innerHTML = `
      <p class="success">Payment successful 🎉</p>
      <p>Your purchase is now available.</p>
      <a class="btn" href="/my-products.html">Go to My Downloads</a>
    `;

  } catch (err) {
    console.error(err);
    statusEl.innerHTML = `<p class="error">Something went wrong. Please refresh.</p>`;
  }
})();
</script>

</body>
</html>
