<!DOCTYPE html>
<html>
<head>
    <title>Migration Tool</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #0a192f; color: #e6f1ff; }
        .container { max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; background: #64ffda; color: #0a192f; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px 0; }
        pre { background: #172a45; padding: 15px; border-radius: 8px; overflow: auto; max-height: 500px; }
        .success { color: #64ffda; }
        .failed { color: #ff6b6b; }
        .skipped { color: #ffd700; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloudinary Migration Tool</h1>
        
        <button onclick="checkStatus()">Check Migration Status</button>
        <button onclick="migrateAll()" style="background: #ffd700;">Migrate All Files</button>
        
        <div id="results"></div>
    </div>

    <script>
        async function checkStatus() {
            const results = document.getElementById('results');
            results.innerHTML = 'Loading...';
            
            try {
                const res = await fetch('/api/admin/migration-status');
                const data = await res.json();
                
                if (data.success) {
                    results.innerHTML = `
                        <h3>Migration Status:</h3>
                        <pre class="success">${JSON.stringify(data.stats, null, 2)}</pre>
                    `;
                } else {
                    results.innerHTML = `<pre class="failed">Error: ${data.error}</pre>`;
                }
            } catch (err) {
                results.innerHTML = `<pre class="failed">Error: ${err.message}</pre>`;
            }
        }

        async function migrateAll() {
            if (!confirm('This will migrate all local files to Cloudinary. Continue?')) {
                return;
            }
            
            const results = document.getElementById('results');
            results.innerHTML = 'Migration in progress... This may take a while.';
            
            try {
                const res = await fetch('/api/admin/migrate-to-cloudinary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await res.json();
                
                results.innerHTML = `
                    <h3>Migration Results:</h3>
                    <p>${data.message}</p>
                    <h4>Success (${data.results.success.length}):</h4>
                    <pre class="success">${JSON.stringify(data.results.success, null, 2)}</pre>
                    <h4>Failed (${data.results.failed.length}):</h4>
                    <pre class="failed">${JSON.stringify(data.results.failed, null, 2)}</pre>
                    <h4>Skipped (${data.results.skipped.length}):</h4>
                    <pre class="skipped">${JSON.stringify(data.results.skipped, null, 2)}</pre>
                `;
            } catch (err) {
                results.innerHTML = `<pre class="failed">Error: ${err.message}</pre>`;
            }
        }
    </script>
</body>
</html>
