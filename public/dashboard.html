<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #fff;
  margin: 0;
}

header {
  background: #020617;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo-img {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid #3b82f6;
}

header h2 {
  margin: 0;
}

.container {
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.table {
  width: 100%;
  border-collapse: collapse;
}

.table th {
  background: #020617;
  padding: 12px;
  text-align: left;
}

.table td {
  padding: 12px;
  border-bottom: 1px solid #334155;
}

.table tr:hover {
  background: #334155;
}

.status {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  display: inline-block;
}

.pending { background: orange; color: black; }
.pending_seller_approval { background: orange; color: black; }
.accepted { background: #3b82f6; }
.completed { background: #10b981; }
.seller_accepted { background: #3b82f6; }

button {
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}

.accept-btn {
  background: linear-gradient(135deg, #10b981, #22c55e);
  color: white;
}

.reject-btn {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
}

.accept-btn:hover {
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

.reject-btn:hover {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
}

.view-btn {
  background: #3b82f6;
  color: white;
}

/* Modal Styles */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.8);
  animation: fadeIn 0.3s;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background: linear-gradient(135deg, #1e293b, #0f172a);
  margin: 5% auto;
  padding: 0;
  border-radius: 16px;
  width: 90%;
  max-width: 600px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  animation: slideIn 0.3s;
  border: 1px solid #3b82f6;
}

@keyframes slideIn {
  from {
    transform: translateY(-50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal-header {
  padding: 20px 24px;
  background: #020617;
  border-bottom: 2px solid #3b82f6;
  border-radius: 16px 16px 0 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h3 {
  margin: 0;
  color: #fff;
  font-size: 1.5rem;
}

.modal-header h3 i {
  color: #3b82f6;
  margin-right: 10px;
}

.close {
  color: #94a3b8;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
  transition: color 0.2s;
}

.close:hover {
  color: #ef4444;
}

.modal-body {
  padding: 24px;
  max-height: 60vh;
  overflow-y: auto;
}

.order-detail-row {
  display: flex;
  padding: 12px 0;
  border-bottom: 1px solid #334155;
}

.order-detail-label {
  font-weight: 600;
  width: 140px;
  color: #94a3f8;
}

.order-detail-value {
  flex: 1;
  color: #e2e8f0;
  word-break: break-word;
}

.order-detail-value strong {
  color: #3b82f6;
}

.status-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.modal-footer {
  padding: 16px 24px;
  background: #020617;
  border-top: 1px solid #334155;
  border-radius: 0 0 16px 16px;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

.modal-footer button {
  padding: 8px 20px;
  border-radius: 8px;
  font-weight: 600;
}

.close-btn {
  background: #334155;
  color: white;
}

.close-btn:hover {
  background: #475569;
}

.error-message {
  background: rgba(239, 68, 68, 0.2);
  border: 1px solid #ef4444;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  margin: 20px 0;
}

.error-message i {
  font-size: 48px;
  color: #ef4444;
  margin-bottom: 10px;
}

.login-prompt {
  background: rgba(59, 130, 246, 0.2);
  border: 1px solid #3b82f6;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
}

.login-prompt a {
  color: #3b82f6;
  text-decoration: none;
  font-weight: bold;
}

.login-prompt a:hover {
  text-decoration: underline;
}

@media (max-width: 768px) {
  header {
    padding: 12px 16px;
  }
  .logo-img {
    width: 32px;
    height: 32px;
  }
  .container {
    padding: 12px;
  }
  .table {
    font-size: 12px;
  }
  .table th, .table td {
    padding: 8px;
  }
  button {
    padding: 5px 8px;
    font-size: 11px;
  }
  .modal-content {
    width: 95%;
    margin: 10% auto;
  }
  .order-detail-row {
    flex-direction: column;
    padding: 10px 0;
  }
  .order-detail-label {
    width: 100%;
    margin-bottom: 5px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-left">
    <img class="logo-img" src="https://i.pinimg.com/736x/4d/cb/0d/4dcb0d8e2e7f83d4690b8d7fd2924bb3.jpg" alt="Logo">
    <h2>Seller Dashboard</h2>
  </div>
  <button onclick="location.reload()">
    <i class="fas fa-sync-alt"></i> Refresh
  </button>
</header>

<div class="container">

<div class="card">
  <h3><i class="fas fa-shopping-cart"></i> Orders</h3>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="ordersList">
      <tr><td colspan="6" style="text-align: center;"><i class="fas fa-spinner fa-pulse"></i> Loading...</td></tr>
    </tbody>
  </table>
</div>

</div>

<!-- Order Details Modal -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3><i class="fas fa-receipt"></i> Order Details</h3>
      <span class="close">&times;</span>
    </div>
    <div class="modal-body" id="modalBody">
      Loading...
    </div>
    <div class="modal-footer">
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
// Store orders data globally for view access
let allOrders = [];

async function loadOrders() {
  const tbody = document.getElementById('ordersList');
  
  try {
    const res = await fetch('/api/seller/physical-orders', {credentials:'include'});
    
    if (res.status === 401) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6">
            <div class="login-prompt">
              <i class="fas fa-lock" style="font-size: 32px; margin-bottom: 10px; display: block;"></i>
              <strong>Session expired or not logged in</strong><br>
              Please <a href="/login">click here to login</a> as a seller
            </div>
          </td>
        </tr>
      `;
      return;
    }
    
    const data = await res.json();
    
    if (!res.ok) {
      throw new Error(data.error || 'Failed to load orders');
    }

    if (!data.orders || data.orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">📦 No orders found</td></tr>';
      allOrders = [];
      return;
    }

    // Store orders for modal access
    allOrders = data.orders;

    tbody.innerHTML = data.orders.map(o => {
      const statusClass = o.order_status === 'pending_seller_approval' ? 'pending' : 
                         (o.order_status === 'seller_accepted' ? 'accepted' : o.order_status);
      const displayStatus = o.order_status === 'pending_seller_approval' ? 'pending' : 
                           (o.order_status === 'seller_accepted' ? 'accepted' : o.order_status);
      
      return `
        <tr>
          <td>#${o.id}</td>
          <td>${o.product_name || 'Product'}</td>
          <td>${o.quantity || 1}</td>
          <td>$${parseFloat(o.total_amount || 0).toFixed(2)}</td>
          <td><span class="status ${statusClass}">${displayStatus}</span></td>
          <td>
            ${(o.order_status === 'pending_seller_approval' || o.order_status === 'pending') ? `
              <button class="accept-btn" onclick="respond(${o.id}, 'accept')">✓ Accept</button>
              <button class="reject-btn" onclick="respond(${o.id}, 'reject')">✗ Reject</button>
            ` : `<button class="view-btn" onclick="viewOrder(${o.id})">👁️ View Details</button>`}
          </td>
        </tr>
      `;
    }).join('');
    
  } catch (err) {
    console.error('Error loading orders:', err);
    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i><br>
            <strong>Error loading orders</strong><br>
            ${err.message}<br>
            <button onclick="loadOrders()" style="margin-top: 10px; background: #3b82f6; padding: 6px 12px;">
              <i class="fas fa-sync-alt"></i> Retry
            </button>
          </div>
        </td>
      </tr>
    `;
  }
}

async function respond(id, action) {
  try {
    const response = await fetch(`/api/physical-orders/${id}/respond`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action}),
      credentials:'include'
    });
    
    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.error || 'Failed to process order');
    }
    
    await loadOrders();
    
  } catch (err) {
    console.error('Error responding to order:', err);
    alert(`Failed to ${action} order: ${err.message}`);
  }
}

function viewOrder(orderId) {
  // Find the order in our stored data
  const order = allOrders.find(o => o.id === orderId);
  
  if (!order) {
    alert('Order details not found');
    return;
  }
  
  // Format date if exists
  const orderDate = order.created_at ? new Date(order.created_at).toLocaleString() : 'N/A';
  
  // Build modal content with full order details
  const modalBody = document.getElementById('modalBody');
  modalBody.innerHTML = `
    <div class="order-detail-row">
      <div class="order-detail-label">Order ID:</div>
      <div class="order-detail-value"><strong>#${order.id}</strong></div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Product:</div>
      <div class="order-detail-value">${order.product_name || 'N/A'}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Quantity:</div>
      <div class="order-detail-value">${order.quantity || 1}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Price per unit:</div>
      <div class="order-detail-value">$${parseFloat(order.price || 0).toFixed(2)}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Total Amount:</div>
      <div class="order-detail-value"><strong>$${parseFloat(order.total_amount || 0).toFixed(2)}</strong></div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Status:</div>
      <div class="order-detail-value"><span class="status-badge" style="background: ${getStatusColor(order.order_status)}; color: white;">${order.order_status || 'N/A'}</span></div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Customer Name:</div>
      <div class="order-detail-value">${order.customer_name || 'N/A'}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Customer Email:</div>
      <div class="order-detail-value">${order.customer_email || 'N/A'}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Delivery Phone:</div>
      <div class="order-detail-value">${order.delivery_phone || 'N/A'}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Shipping Address:</div>
      <div class="order-detail-value">${order.shipping_address || 'N/A'}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Order Date:</div>
      <div class="order-detail-value">${orderDate}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Platform Fee:</div>
      <div class="order-detail-value">$${parseFloat(order.platform_fee || 0).toFixed(2)}</div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Seller Earnings:</div>
      <div class="order-detail-value"><strong style="color: #10b981;">$${parseFloat(order.seller_earnings || 0).toFixed(2)}</strong></div>
    </div>
    <div class="order-detail-row">
      <div class="order-detail-label">Est. Delivery:</div>
      <div class="order-detail-value">${order.estimated_delivery_days || 7} days</div>
    </div>
  `;
  
  // Show modal
  document.getElementById('orderModal').style.display = 'block';
}

function getStatusColor(status) {
  const colors = {
    'pending_seller_approval': '#f59e0b',
    'seller_accepted': '#3b82f6',
    'accepted': '#3b82f6',
    'completed': '#10b981',
    'cancelled': '#ef4444',
    'refund_requested': '#8b5cf6'
  };
  return colors[status] || '#6b7280';
}

function closeModal() {
  document.getElementById('orderModal').style.display = 'none';
}

// Close modal when clicking outside
window.onclick = function(event) {
  const modal = document.getElementById('orderModal');
  if (event.target === modal) {
    closeModal();
  }
}

// Load orders on page load
loadOrders();
</script>

</body>
</html>
