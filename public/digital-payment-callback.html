<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Payment Processing | Core Insight</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#faf9f6; --cream-deep:#f5f3ee; --paper:#fff;
  --charcoal:#2b2b28; --charcoal-soft:#55524a; --text-muted:#8a8578;
  --hairline:#e9e5dc; --hairline-strong:#ddd7ca;
  --blue:#4a6fa5; --blue-deep:#3c5c8a; --sage:#5a8d7d; --sage-deep:#497363;
  --gold:#c9971f; --gold-deep:#a97c15; --gold-tint:#f8ecd2;
  --danger:#b3492f; --danger-tint:#f7e6e1;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  --shadow-modal:0 24px 60px rgba(43,43,40,.18); --ease:cubic-bezier(.4,0,.2,1);
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--cream); color:var(--charcoal); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; -webkit-font-smoothing:antialiased; }
h1,h2 { font-family:'Fraunces',Georgia,serif; font-weight:600; color:var(--charcoal); margin:0; }
a { color:var(--blue); }

.callback-card { background:var(--paper); border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:clamp(28px,7vw,44px) clamp(22px,6vw,36px); max-width:460px; width:100%; text-align:center; box-shadow:var(--shadow-modal); }

.status-icon { font-size:44px; margin-bottom:20px; }
.status-icon.pending { color:var(--gold-deep); }
.status-icon.success { color:var(--sage-deep); }
.status-icon.error { color:var(--danger); }

.spinner-ring { width:40px; height:40px; border:3px solid var(--hairline); border-top-color:var(--gold); border-radius:50%; margin:0 auto 20px; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.callback-card h1 { font-size:1.5rem; margin-bottom:10px; }
.callback-card p.message { color:var(--charcoal-soft); font-size:14px; line-height:1.6; margin:0 0 22px; }

.detail-box { background:var(--cream); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:16px; text-align:left; margin-bottom:22px; }
.detail-row { display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:13px; border-bottom:1px solid var(--hairline); }
.detail-row:last-child { border-bottom:none; }
.detail-row .label { color:var(--charcoal-soft); }
.detail-row .value { color:var(--charcoal); font-weight:600; text-align:right; word-break:break-all; }

.ref-copy-row { display:flex; align-items:center; gap:8px; }
.ref-copy-btn { background:none; border:none; color:var(--charcoal-soft); cursor:pointer; padding:2px 4px; flex-shrink:0; }
.ref-copy-btn:hover { color:var(--charcoal); }
.ref-copy-btn.copied { color:var(--sage-deep); }

.expiry-note { display:flex; align-items:flex-start; gap:9px; background:var(--gold-tint); border-radius:var(--radius-md); padding:12px 14px; font-size:12.5px; color:var(--charcoal-soft); text-align:left; margin-bottom:20px; }
.expiry-note i { color:var(--gold-deep); margin-top:1px; flex-shrink:0; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px; border-radius:var(--radius-sm); border:1px solid var(--hairline-strong); background:var(--paper); color:var(--charcoal); font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; transition:var(--ease); margin-bottom:10px; }
.btn:hover { background:var(--cream-deep); }
.btn.primary { background:var(--gold); border-color:var(--gold); color:var(--charcoal); }
.btn.primary:hover { background:var(--gold-deep); }
.btn.dark { background:var(--charcoal); border-color:var(--charcoal); color:var(--cream); }
.btn.dark:hover { background:#1b1a17; }

.footer-link { display:block; margin-top:16px; font-size:13px; color:var(--charcoal-soft); text-decoration:none; }
.footer-link:hover { color:var(--charcoal); }

@media (max-width:480px) {
  .callback-card { padding:28px 20px; }
}
</style>
</head>
<body>

  <div class="callback-card" id="mainContainer">
    <div class="spinner-ring"></div>
    <h1 id="paymentStatus">Verifying Payment…</h1>
    <p class="message" id="message">Please wait while we confirm your purchase. This usually takes just a few seconds.</p>
  </div>

<script>
  (function () {
    const container = document.getElementById('mainContainer');
    const statusEl = document.getElementById('paymentStatus');
    const messageEl = document.getElementById('message');

    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference') || params.get('tx_ref') || params.get('transaction_id');

    let retryCount = 0;
    const MAX_RETRIES = 10;
    const RETRY_INTERVAL_MS = 3000;
    let checkInterval = null;
    let isVerifying = false;

    function renderPending() {
      container.innerHTML = `
        <div class="spinner-ring"></div>
        <h1>Verifying Payment…</h1>
        <p class="message">Please wait while we confirm your purchase. This usually takes just a few seconds.</p>
      `;
    }

    function renderSuccess(data) {
      const downloadUrl = data.download_url || data.downloadUrl;
      container.innerHTML = `
        <div class="status-icon success"><i class="fas fa-circle-check"></i></div>
        <h1>Payment Successful</h1>
        <p class="message">Your purchase is confirmed. ${downloadUrl ? "You can download your file below." : "Check your email for access details."}</p>
        <div class="detail-box">
          <div class="detail-row"><span class="label">Product</span><span class="value">${escapeHtml(data.product_title || data.product_name || '—')}</span></div>
          <div class="detail-row"><span class="label">Amount</span><span class="value">$${Number(data.amount || 0).toFixed(2)}</span></div>
          <div class="detail-row"><span class="label">Reference</span><span class="value ref-copy-row"><span id="refText">${escapeHtml(reference || '—')}</span><button class="ref-copy-btn" onclick="copyReference(this)" title="Copy reference"><i class="far fa-copy"></i></button></span></div>
        </div>
        ${downloadUrl ? `
          <div class="expiry-note"><i class="fas fa-clock"></i><span>This download link is available for <strong>7 days</strong>. Save the file to your device — you can also access it anytime from your Purchases.</span></div>
          <a href="${downloadUrl}" class="btn primary" download><i class="fas fa-download"></i> Download Your File</a>
        ` : ''}
        <a href="products.html" class="btn dark"><i class="fas fa-store"></i> Continue Shopping</a>
        <a href="products.html" class="footer-link">View all your purchases</a>
      `;
    }

    function renderError(msg) {
      container.innerHTML = `
        <div class="status-icon error"><i class="fas fa-circle-exclamation"></i></div>
        <h1>Payment Verification Issue</h1>
        <p class="message">${escapeHtml(msg)}</p>
        ${reference ? `
          <div class="detail-box">
            <div class="detail-row"><span class="label">Reference</span><span class="value ref-copy-row"><span id="refText">${escapeHtml(reference)}</span><button class="ref-copy-btn" onclick="copyReference(this)" title="Copy reference"><i class="far fa-copy"></i></button></span></div>
          </div>
        ` : ''}
        <button class="btn primary" onclick="retryVerification()"><i class="fas fa-rotate-right"></i> Try Again</button>
        <a href="contact.html" class="btn dark"><i class="fas fa-headset"></i> Contact Support</a>
      `;
    }

    function renderNoReference() {
      container.innerHTML = `
        <div class="status-icon error"><i class="fas fa-circle-question"></i></div>
        <h1>No Payment Reference Found</h1>
        <p class="message">We couldn't find a payment reference in this link. If you just completed a purchase, please check your email for a confirmation, or contact support if you believe this is an error.</p>
        <a href="products.html" class="btn primary"><i class="fas fa-store"></i> Back to Products</a>
        <a href="contact.html" class="btn dark"><i class="fas fa-headset"></i> Contact Support</a>
      `;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // New: copy the transaction reference to clipboard — useful since
    // both the error and success states ask people to reference this
    // number when contacting support.
    window.copyReference = function (btn) {
      const text = document.getElementById('refText')?.textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<i class="far fa-copy"></i>'; }, 1800);
      });
    };

    async function verifyPayment() {
      if (isVerifying) return;
      isVerifying = true;

      if (!reference) {
        renderNoReference();
        isVerifying = false;
        return;
      }

      try {
        console.log(`🔍 Verifying payment (attempt ${retryCount + 1}/${MAX_RETRIES})…`);

        const response = await fetch(
          `/api/verify-digital-payment/${encodeURIComponent(reference)}`,
          {
            method: 'GET',
            credentials: 'include',
            headers: { Accept: 'application/json' },
          }
        );

        const data = await response.json();
        console.log('📦 Verification response:', data);

        if (data.status === 'success') {
          renderSuccess(data);
          isVerifying = false;
          return;
        }

        if (data.status === 'pending') {
          retryCount++;
          renderPending();

          if (retryCount >= MAX_RETRIES) {
            renderError('Payment is taking longer than expected. Please check your email for confirmation or contact support.');
          }
          isVerifying = false;
          return;
        }

        renderError(data.message || 'Payment verification failed. Please contact support.');
        isVerifying = false;

      } catch (error) {
        console.error('Verification error:', error);
        retryCount++;

        if (messageEl) {
          messageEl.innerHTML = `⚠️ Checking payment status… (${retryCount}/${MAX_RETRIES})`;
        }

        if (retryCount >= MAX_RETRIES) {
          renderError('Error verifying payment. Please contact support with your transaction reference.');
        }
        isVerifying = false;
      }
    }

    window.retryVerification = function () {
      retryCount = 0;
      if (checkInterval) {
        clearInterval(checkInterval);
        checkInterval = null;
      }
      window.location.reload();
    };

    if (reference) {
      verifyPayment();
      checkInterval = setInterval(verifyPayment, RETRY_INTERVAL_MS);
    } else {
      renderNoReference();
    }

    window.addEventListener('beforeunload', function () {
      if (checkInterval) {
        clearInterval(checkInterval);
        checkInterval = null;
      }
    });
  })();
</script>

</body>
</html>
