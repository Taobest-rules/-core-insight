<!DOCTYPE html>
<html>
<head>
    <title>Payment Processing - Core Insight</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .info { color: #FFD700; }
        .btn { 
            display: inline-block;
            padding: 10px 20px;
            background: #FFD700;
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            margin-top: 1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #FFD700;
            color: #FFD700;
            margin-left: 10px;
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #FFD700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .debug-info {
            text-align: left;
            background: #2d3748;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .payment-details {
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            text-align: left;
        }
        .payment-details p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }
        .show-debug {
            background: none;
            border: 1px solid #4a5568;
            color: #a0aec0;
            padding: 5px 10px;
            font-size: 0.8rem;
            margin-top: 10px;
            cursor: pointer;
        }
        .show-debug:hover {
            background: #2d3748;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Processing Your Payment...</h2>
        <div class="loading-spinner"></div>
        <p>Please wait while we verify your payment.</p>
        <div id="paymentStatus"></div>
        
        <button class="btn" onclick="goToCourses()" style="display: none;" id="goToCoursesBtn">
            Go to My Courses
        </button>
        
        <button class="btn" onclick="goToCourses()" style="display: none;" id="tryAgainBtn">
            Return to Courses
        </button>
        
        <button class="show-debug" onclick="toggleDebug()">Show Debug Info</button>
        <div id="debugInfo" class="debug-info"></div>
    </div>
    
    <script>
        // Get transaction ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const transactionId = urlParams.get('transaction_id');
        const status = urlParams.get('status');
        const tx_ref = urlParams.get('tx_ref');
        
        console.log('Payment callback - Transaction ID:', transactionId);
        console.log('Payment callback - Status:', status);
        console.log('Payment callback - tx_ref:', tx_ref);
        
        function addDebug(message, data = null) {
            const debugDiv = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            let logMessage = `[${timestamp}] ${message}`;
            if (data) {
                logMessage += `\nData: ${JSON.stringify(data, null, 2)}`;
            }
            debugDiv.innerHTML += logMessage + '\n';
            debugDiv.scrollTop = debugDiv.scrollHeight;
            console.log(message, data);
        }
        
        function toggleDebug() {
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.style.display = debugDiv.style.display === 'none' ? 'block' : 'none';
        }
        
        if (transactionId && (status === 'successful' || status === 'success')) {
            addDebug('Found transaction ID with successful status', { transactionId, status });
            verifyPayment(transactionId);
        } else if (transactionId) {
            addDebug('Found transaction ID, verifying anyway', { transactionId });
            verifyPayment(transactionId);
        } else if (tx_ref) {
            addDebug('Found tx_ref, attempting to verify by reference', { tx_ref });
            verifyByReference(tx_ref);
        } else {
            addDebug('No transaction information found in URL');
            document.getElementById('paymentStatus').innerHTML = 
                '<p class="error">No transaction ID found. Please contact support.</p>';
            document.getElementById('tryAgainBtn').style.display = 'inline-block';
        }
        
        async function verifyPayment(transactionId) {
            try {
                addDebug('Verifying payment for transaction:', transactionId);
                
                const response = await fetch(`/api/verify-payment/${transactionId}`);
                const data = await response.json();
                
                addDebug('Verification response received', data);
                
                if (data.status === 'success') {
                    const courseTitle = data.data?.meta?.course_title || 'Your course';
                    const amount = data.data?.amount || 'N/A';
                    
                    document.getElementById('paymentStatus').innerHTML = `
                        <div class="success">
                            <h3>✅ Payment Successful!</h3>
                            <p>You now have access to the course.</p>
                            <div class="payment-details">
                                <p><strong>Course:</strong> ${courseTitle}</p>
                                <p><strong>Amount:</strong> $${amount}</p>
                                <p><strong>Transaction ID:</strong> ${transactionId}</p>
                            </div>
                        </div>
                    `;
                    
                    // Store in localStorage for immediate access
                    if (data.data && data.data.meta && data.data.meta.course_id) {
                        localStorage.setItem('purchased_course_' + data.data.meta.course_id, 'true');
                        localStorage.setItem('last_purchased_course', data.data.meta.course_id);
                        addDebug('Stored purchased course in localStorage', { course_id: data.data.meta.course_id });
                    }
                    
                    // Show the button to go to courses
                    document.getElementById('goToCoursesBtn').style.display = 'inline-block';
                    
                    // Auto-redirect after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/courses.html';
                    }, 3000);
                    
                } else {
                    document.getElementById('paymentStatus').innerHTML = `
                        <div class="error">
                            <h3>❌ Payment Verification Failed</h3>
                            <p>${data.message || 'Please contact support if you were charged.'}</p>
                            <p><strong>Transaction ID:</strong> ${transactionId}</p>
                        </div>
                    `;
                    document.getElementById('tryAgainBtn').style.display = 'inline-block';
                }
                
            } catch (error) {
                console.error('Verification error:', error);
                addDebug('Verification error:', error.message);
                document.getElementById('paymentStatus').innerHTML = `
                    <div class="error">
                        <h3>❌ Verification Error</h3>
                        <p>Error: ${error.message}</p>
                        <p>Please contact support if you were charged.</p>
                        <p><strong>Transaction ID:</strong> ${transactionId}</p>
                    </div>
                `;
                document.getElementById('tryAgainBtn').style.display = 'inline-block';
            }
        }
        
        async function verifyByReference(tx_ref) {
            try {
                addDebug('Verifying by reference:', tx_ref);
                
                const response = await fetch(`/api/verify-by-reference/${tx_ref}`);
                const data = await response.json();
                
                addDebug('Verification by reference response:', data);
                
                if (data.status === 'success') {
                    document.getElementById('paymentStatus').innerHTML = `
                        <div class="success">
                            <h3>✅ Payment Successful!</h3>
                            <p>You now have access to the course.</p>
                            <div class="payment-details">
                                <p><strong>Course:</strong> ${data.course_title || 'Your course'}</p>
                                <p><strong>Amount:</strong> $${data.amount || 'N/A'}</p>
                            </div>
                        </div>
                    `;
                    
                    if (data.course_id) {
                        localStorage.setItem('purchased_course_' + data.course_id, 'true');
                        localStorage.setItem('last_purchased_course', data.course_id);
                    }
                    
                    document.getElementById('goToCoursesBtn').style.display = 'inline-block';
                    
                    setTimeout(() => {
                        window.location.href = '/courses.html';
                    }, 3000);
                } else {
                    document.getElementById('paymentStatus').innerHTML = `
                        <div class="error">
                            <h3>❌ Payment Verification Failed</h3>
                            <p>${data.message || 'Please contact support if you were charged.'}</p>
                        </div>
                    `;
                    document.getElementById('tryAgainBtn').style.display = 'inline-block';
                }
                
            } catch (error) {
                console.error('Verification by reference error:', error);
                addDebug('Verification by reference error:', error.message);
                document.getElementById('paymentStatus').innerHTML = `
                    <div class="error">
                        <h3>❌ Verification Error</h3>
                        <p>Error: ${error.message}</p>
                        <p>Please contact support if you were charged.</p>
                    </div>
                `;
                document.getElementById('tryAgainBtn').style.display = 'inline-block';
            }
        }
        
        function goToCourses() {
            window.location.href = '/courses.html';
        }
    </script>
</body>
</html>
