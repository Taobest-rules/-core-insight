<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Purchase Complete - Core Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .bismillah {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
        }
        .bismillah .arabic {
            font-size: 1.5rem;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            color: #FFD700;
            display: block;
            margin-bottom: 0.3rem;
        }
        .bismillah .english {
            font-size: 0.85rem;
            color: rgba(255, 215, 0, 0.9);
        }
        .spinner {
            border: 4px solid #334155;
            border-top-color: #FFD700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #10b981; font-size: 48px; margin: 20px 0; }
        .error { color: #ef4444; font-size: 48px; margin: 20px 0; }
        .warning { color: #f59e0b; font-size: 48px; margin: 20px 0; }
        .btn, .download-btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin: 10px;
            transition: all 0.3s;
        }
        .btn {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
        }
        .download-btn {
            background: #10b981;
            color: white;
            font-size: 1.1rem;
            padding: 14px 32px;
        }
        .btn:hover, .download-btn:hover { transform: translateY(-2px); }
        .product-info {
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .button-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
        .refresh-btn {
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
        }
        .refresh-btn:hover { background: #2563eb; }
        .countdown { font-size: 14px; color: #94a3b8; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="bismillah">
            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
        </div>
        <div id="paymentStatus">
            <h2>Processing Payment...</h2>
            <div class="spinner"></div>
            <p id="message" style="color: #94a3b8;">Please wait while we verify your payment...</p>
        </div>
    </div>

    <script>
        // ============================================
        // FIXED: PROPER REFERENCE EXTRACTION
        // ============================================
        
        const urlParams = new URLSearchParams(window.location.search);
        let reference = urlParams.get('reference') || urlParams.get('trxref') || urlParams.get('tx_ref');
        
        // IMPORTANT: Keep PS_ prefix for Paystack API calls
        let paystackReference = reference;  // e.g., "PS_DIGITAL_xxx"
        let databaseReference = reference;   // Will remove PS_ if present
        
        // Remove PS_ prefix ONLY for database lookup
        if (reference && reference.startsWith('PS_')) {
            databaseReference = reference.substring(3);  // "DIGITAL_xxx"
            // paystackReference stays as "PS_DIGITAL_xxx"
        }
        
        console.log('🔑 Paystack API Reference (with PS_):', paystackReference);
        console.log('💾 Database Reference (without PS_):', databaseReference);
        
        let retryCount = 0;
        let checkInterval = null;
        
        // ============================================
        // VERIFY PAYMENT WITH PAYSTACK
        // ============================================
        
        async function verifyPayment() {
            if (!paystackReference) {
                showError('No payment reference found.');
                return;
            }
            
            try {
                console.log(`Verifying payment (attempt ${retryCount + 1}):`, paystackReference);
                
                // Use the reference WITH PS_ prefix for Paystack API
                const response = await fetch(`/api/check-payment-status/${encodeURIComponent(paystackReference)}`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                console.log('Payment status response:', data);
                
                if (data.status === 'success') {
                    // Payment successful - now get the download link
                    clearInterval(checkInterval);
                    
                    // Pass the database reference (without PS_) to get the order
                    const verifyResponse = await fetch(`/api/verify-digital-payment/${encodeURIComponent(databaseReference)}`, {
                        credentials: 'include'
                    });
                    const verifyData = await verifyResponse.json();
                    
                    if (verifyData.status === 'success') {
                        document.getElementById('paymentStatus').innerHTML = `
                            <div class="bismillah">
                                <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                                <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                            </div>
                            <div class="success">✅</div>
                            <h2 style="color: #10b981;">Purchase Successful!</h2>
                            <div class="product-info">
                                <h3>${escapeHtml(verifyData.product_title || 'Digital Product')}</h3>
                                <p>Thank you for your purchase!</p>
                            </div>
                            <a href="${verifyData.download_url}" class="download-btn" target="_blank">
                                <i class="fas fa-download"></i> Download Now
                            </a>
                            <div class="button-group">
                                <a href="/products.html" class="btn">Continue Shopping</a>
                                <a href="/my-purchases.html" class="btn">My Purchases</a>
                            </div>
                        `;
                    } else {
                        showError('Could not retrieve download link. Please contact support.');
                    }
                    
                } else if (data.status === 'pending') {
                    // Payment still pending (bank transfer takes time)
                    document.getElementById('paymentStatus').innerHTML = `
                        <div class="bismillah">
                            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                        </div>
                        <div class="warning">⏳</div>
                        <h2 style="color: #f59e0b;">Payment Pending</h2>
                        <div class="product-info" style="background: rgba(245, 158, 11, 0.1);">
                            <p>Your payment is being processed.</p>
                            <p><strong>Reference: ${databaseReference}</strong></p>
                            <p>Bank transfers typically take 10-30 minutes to confirm.</p>
                        </div>
                        <p style="color: #94a3b8;">We will automatically check for updates.</p>
                        <button class="refresh-btn" onclick="forceCheck()">
                            <i class="fas fa-sync-alt"></i> Check Status Now
                        </button>
                        <div class="countdown" id="countdown">Checking again in 15 seconds...</div>
                        <div class="button-group">
                            <a href="/products.html" class="btn">Continue Shopping</a>
                            <a href="/contact.html" class="btn">Contact Support</a>
                        </div>
                    `;
                    
                    // Start countdown and retry
                    startRetryTimer();
                    
                } else {
                    showError(data.message || 'Payment verification failed. Please contact support.');
                }
                
            } catch (error) {
                console.error('Verification error:', error);
                showError('Error verifying payment. Please contact support.');
            }
        }
        
        function startRetryTimer() {
            let seconds = 15;
            const countdownEl = document.getElementById('countdown');
            
            if (checkInterval) clearInterval(checkInterval);
            
            checkInterval = setInterval(async () => {
                seconds--;
                if (countdownEl) {
                    countdownEl.innerHTML = `Checking again in ${seconds} seconds...`;
                }
                
                if (seconds <= 0) {
                    clearInterval(checkInterval);
                    retryCount++;
                    await verifyPayment();
                }
            }, 1000);
        }
        
        async function forceCheck() {
            if (checkInterval) clearInterval(checkInterval);
            retryCount = 0;
            document.getElementById('paymentStatus').innerHTML = `
                <div class="bismillah">
                    <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                    <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                </div>
                <h2>Checking Payment Status...</h2>
                <div class="spinner"></div>
                <p style="color: #94a3b8;">Please wait...</p>
            `;
            await verifyPayment();
        }
        
        function showError(msg) {
            document.getElementById('paymentStatus').innerHTML = `
                <div class="bismillah">
                    <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                    <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                </div>
                <div class="error">❌</div>
                <h2 style="color: #ef4444;">Verification Failed</h2>
                <p style="color: #94a3b8;">${escapeHtml(msg)}</p>
                <p style="color: #94a3b8; font-size: 12px;">Reference: ${escapeHtml(databaseReference)}</p>
                <div class="button-group">
                    <a href="/products.html" class="btn">Browse Products</a>
                    <button class="refresh-btn" onclick="forceCheck()">Try Again</button>
                </div>
            `;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m);
        }
        
        // Start verification
        if (paystackReference) {
            verifyPayment();
        } else {
            showError('No payment reference found in URL.');
        }
    </script>
</body>
</html>
