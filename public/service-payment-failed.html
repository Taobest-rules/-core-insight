<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed - Core Insight Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            color: #e6f1ff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        /* Marketplace Banner - Replacement for Bismillah */
        .marketplace-banner {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
            transition: all 0.3s ease;
        }
        .marketplace-banner span {
            color: gold;
            font-size: 1.1rem;
            line-height: 1.5;
            display: block;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .marketplace-banner span:first-child {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255,215,0,0.3);
        }
        .marketplace-banner span:last-child {
            font-size: 0.85rem;
            font-weight: 500;
            color: #FFD700;
            opacity: 0.95;
        }
        .error { color: #ef4444; font-size: 48px; margin: 20px 0; }
        h1 { color: #ef4444; margin-bottom: 16px; }
        p { color: #94a3b8; margin-bottom: 24px; }
        .btn {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
        
        @media (max-width: 480px) {
            .container { padding: 25px; }
            .marketplace-banner span:first-child { font-size: 1.3rem; }
            .marketplace-banner span:last-child { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Core Insight Marketplace Banner (Replaces Bismillah) -->
        <div class="marketplace-banner">
            <span style="color: gold;">Core Insight MarketPlace</span>
            <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
        </div>
        <div class="error">❌</div>
        <h1>Payment Failed</h1>
        <p>We couldn't process your payment. Please try again.</p>
        <a href="/services.html" class="btn">Return to Services</a>
    </div>
</body>
</html>
