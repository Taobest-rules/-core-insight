<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Core Insight</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a192f; color: #e6f1ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 500px; margin: 40px 20px; text-align: center; }
    .success-card { background: #1e293b; border-radius: 24px; padding: 40px; border: 1px solid #334155; }
    .success-icon { width: 80px; height: 80px; background: rgba(16, 185, 129, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .success-icon i { font-size: 48px; color: #10b981; }
    h1 { color: #10b981; margin-bottom: 16px; }
    p { color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
    .btn { display: inline-block; background: #3b82f6; color: white; padding: 12px 32px; border-radius: 12px; text-decoration: none; font-weight: 600; margin: 8px; transition: all 0.2s; }
    .btn:hover { background: #2563eb; transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
    .btn-outline:hover { background: rgba(59, 130, 246, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-card">
      <div class="success-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <h1>Payment Successful! 🎉</h1>
      <p>Your payment has been processed successfully.<br>Your order is now being processed.</p>
      <div style="margin-top: 24px;">
        <a href="/products.html" class="btn">Continue Shopping</a>
        <a href="/order-tracking.html" class="btn btn-outline">Track Order</a>
      </div>
    </div>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    if (orderId) {
      console.log('Order ID:', orderId);
    }
  </script>
</body>
</html>
