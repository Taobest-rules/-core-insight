<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #fff;
  margin: 0;
}

header {
  background: #020617;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 20px;
}

.container {
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.table {
  width: 100%;
  border-collapse: collapse;
}

.table th {
  background: #020617;
  padding: 12px;
}

.table td {
  padding: 12px;
  border-bottom: 1px solid #334155;
}

.table tr:hover {
  background: #334155;
}

.status {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.pending { background: orange; color: black; }
.accepted { background: #3b82f6; }
.completed { background: #10b981; }

button {
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}

.accept-btn {
  background: linear-gradient(135deg, #10b981, #22c55e);
  color: white;
}

.reject-btn {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
}

.accept-btn:hover {
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

.reject-btn:hover {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
}

.view-btn {
  background: #3b82f6;
  color: white;
}

</style>
</head>

<body>

<header>
  <h2>Seller Dashboard</h2>
  <button onclick="location.reload()">Refresh</button>
</header>

<div class="container">

<div class="card">
  <h3>Orders</h3>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="ordersList">
      <tr><td colspan="6">Loading...</td></tr>
    </tbody>
  </table>
</div>

</div>

<script>
async function loadOrders() {
  const res = await fetch('/api/seller/physical-orders', {credentials:'include'});
  const data = await res.json();

  const tbody = document.getElementById('ordersList');

  if (!data.orders || data.orders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6">No orders</td></tr>';
    return;
  }

  tbody.innerHTML = data.orders.map(o => `
    <tr>
      <td>#${o.id}</td>
      <td>${o.product_name}</td>
      <td>${o.quantity}</td>
      <td>$${o.total_amount}</td>
      <td><span class="status ${o.order_status}">${o.order_status}</span></td>
      <td>
        ${o.order_status === 'pending_seller_approval' ? `
          <button class="accept-btn" onclick="respond(${o.id}, 'accept')">Accept</button>
          <button class="reject-btn" onclick="respond(${o.id}, 'reject')">Reject</button>
        ` : `<button class="view-btn">View</button>`}
      </td>
    </tr>
  `).join('');
}

async function respond(id, action) {
  await fetch(`/api/physical-orders/${id}/respond`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action}),
    credentials:'include'
  });
  loadOrders();
}

loadOrders();
</script>

</body>
</html>
