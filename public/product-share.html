<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shared Product | Core Insight</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#faf9f6; --cream-deep:#f5f3ee; --paper:#fff;
  --charcoal:#2b2b28; --charcoal-soft:#55524a; --text-muted:#8a8578;
  --hairline:#e9e5dc; --hairline-strong:#ddd7ca;
  --blue:#4a6fa5; --blue-deep:#3c5c8a; --sage:#5a8d7d; --sage-deep:#497363;
  --gold:#c9971f; --gold-deep:#a97c15; --gold-tint:#f8ecd2;
  --danger:#b3492f; --danger-tint:#f7e6e1;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  --shadow-rest:0 1px 2px rgba(43,43,40,.04); --shadow-hover:0 12px 28px rgba(43,43,40,.10);
  --ease:cubic-bezier(.4,0,.2,1);
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--cream); color:var(--charcoal); min-height:100vh; -webkit-font-smoothing:antialiased; }
h1,h2 { font-family:'Fraunces',Georgia,serif; font-weight:600; color:var(--charcoal); margin:0; }
a { color:var(--blue); }
img { max-width:100%; }

.top-bar { display:flex; justify-content:center; padding:20px 16px; }
.top-bar a { display:flex; align-items:center; gap:10px; text-decoration:none; }
.top-bar .logo-icon { width:34px; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--hairline); }
.top-bar .logo-text { font-family:'Fraunces',serif; font-size:1.15rem; font-weight:600; color:var(--charcoal); }

.container { max-width:1000px; margin:0 auto; padding:0 clamp(16px,4vw,28px) 60px; }

.loading-state, .error-state { text-align:center; padding:80px 20px; }
.loading-state .spinner { width:36px; height:36px; border:3px solid var(--hairline); border-top-color:var(--gold); border-radius:50%; margin:0 auto 20px; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-state p, .error-state p { color:var(--charcoal-soft); font-size:14px; }
.error-state i { font-size:40px; color:var(--hairline-strong); margin-bottom:16px; display:block; }
.error-state h2 { margin-bottom:8px; }

.product-card { background:var(--paper); border:1px solid var(--hairline); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-rest); }
.product-layout { display:grid; grid-template-columns:1fr 1fr; gap:0; }

.gallery { padding:clamp(16px,4vw,24px); background:var(--cream-deep); }
.main-image { width:100%; aspect-ratio:4/3; border-radius:var(--radius-md); overflow:hidden; background:var(--cream); border:1px solid var(--hairline); margin-bottom:12px; }
.main-image img { width:100%; height:100%; object-fit:cover; display:block; }
.thumbnail-list { display:flex; gap:8px; flex-wrap:wrap; }
.thumbnail-list img { width:56px; height:56px; object-fit:cover; border-radius:var(--radius-sm); border:2px solid var(--hairline); cursor:pointer; transition:var(--ease); }
.thumbnail-list img:hover, .thumbnail-list img.active { border-color:var(--gold); }

.info-panel { padding:clamp(20px,5vw,32px); display:flex; flex-direction:column; }
.share-badge { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:12px; }
.product-title { font-size:clamp(1.4rem,4vw,1.8rem); margin-bottom:10px; line-height:1.25; }

.trust-strip { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--charcoal-soft); margin-bottom:16px; }
.trust-strip .verified { display:inline-flex; align-items:center; gap:5px; color:var(--sage-deep); font-weight:600; }
.trust-strip .stat { display:inline-flex; align-items:center; gap:4px; }
.trust-strip .stars { color:var(--gold); }
.trust-strip .sep { color:var(--hairline-strong); }

.price { font-family:'Fraunces',serif; font-size:2rem; font-weight:600; color:var(--gold-deep); margin-bottom:18px; }
.description { color:var(--charcoal-soft); font-size:14px; line-height:1.7; margin-bottom:20px; }

.details-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; padding:16px; background:var(--cream); border-radius:var(--radius-md); border:1px solid var(--hairline); }
.details-row { display:flex; justify-content:space-between; font-size:13px; }
.details-label { color:var(--charcoal-soft); }
.details-value { font-weight:600; color:var(--charcoal); }

.condition-badge { font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; }
.condition-new { background:#e6efe9; color:var(--sage-deep); }
.condition-good { background:var(--gold-tint); color:var(--gold-deep); }

.cta-row { display:flex; flex-direction:column; gap:10px; margin-top:auto; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--hairline-strong); background:var(--paper); color:var(--charcoal); font-weight:600; font-size:14.5px; text-decoration:none; cursor:pointer; transition:var(--ease); }
.btn:hover { background:var(--cream-deep); }
.btn.primary { background:var(--gold); border-color:var(--gold); color:var(--charcoal); }
.btn.primary:hover { background:var(--gold-deep); }
.btn.dark { background:var(--charcoal); border-color:var(--charcoal); color:var(--cream); }
.btn.dark:hover { background:#1b1a17; }

.share-stats { text-align:center; margin-top:16px; font-size:12px; color:var(--text-muted); }

@media (max-width:700px) {
  .product-layout { grid-template-columns:1fr; }
  .gallery { background:var(--cream-deep); }
}
</style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html">
      <div class="logo-icon"><img src="https://i.pinimg.com/736x/27/7a/12/277a1257f00946e8337c57ac43c9b700.jpg" alt="Core Insight" style="width:100%;height:100%;object-fit:cover;"></div>
      <span class="logo-text">Core Insight</span>
    </a>
  </div>

  <div class="container">
    <div id="content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading product…</p>
      </div>
    </div>
  </div>

<script>
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function slugify(title) {
    return (title || 'product').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  async function loadSharedProduct() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || window.location.pathname.split('/').pop();

    if (!token) {
      renderError('No product link provided', 'This share link appears to be incomplete.');
      return;
    }

    try {
      const res = await fetch(`/api/products/by-share-token/${encodeURIComponent(token)}`);
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        renderError('Product Not Found', data.error || 'This shared link may have expired or the product may no longer be available.');
        return;
      }
      const data = await res.json();
      displayProduct(data.product || data);
    } catch (err) {
      console.error('Failed to load shared product:', err);
      renderError('Something Went Wrong', 'We could not load this product right now. Please try again in a moment.');
    }
  }

  function renderError(title, message) {
    document.getElementById('content').innerHTML = `
      <div class="error-state">
        <i class="fas fa-circle-exclamation"></i>
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
        <a href="products.html" class="btn primary" style="display:inline-flex;margin-top:20px;width:auto;padding:12px 24px;"><i class="fas fa-store"></i> Browse Products</a>
      </div>
    `;
  }

  function displayProduct(product) {
    let images = [];
    try {
      images = Array.isArray(product.image_urls) ? product.image_urls : JSON.parse(product.image_urls || '[]');
    } catch (e) { images = []; }
    if (!images.length) images = ['https://placehold.co/500x375/f5f3ee/4a6fa5/png?text=Product'];

    const conditionText = (product.condition_type || 'good').replace('_', ' ');
    const conditionClass = product.condition_type === 'new' ? 'condition-new' : 'condition-good';

    // Real product-detail page link (was previously just the generic
    // /products.html browse page — that meant clicking "Buy Now" on a
    // shared link lost the person's context entirely).
    const productUrl = `/product/${product.id}-${slugify(product.title)}`;

    const isVerified = !!(product.seller_verified || product.is_seller_verified);
    const rating = Number(product.rating || product.seller_rating || 0);
    const sales = Number(product.seller_sales_count || product.sales_count || 0);
    let trustBits = [];
    if (isVerified) trustBits.push(`<span class="verified"><i class="fas fa-badge-check"></i> Verified Seller</span>`);
    if (rating > 0) trustBits.push(`<span class="stat"><span class="stars">${'★'.repeat(Math.round(rating))}</span> ${rating.toFixed(1)}</span>`);
    if (sales > 0) trustBits.push(`<span class="stat">${sales} sale${sales === 1 ? '' : 's'}</span>`);
    const trustHtml = trustBits.length ? `<div class="trust-strip">${trustBits.join('<span class="sep">·</span>')}</div>` : '';

    const ctaLabel = product.type === 'affiliate' ? 'Visit Link' : (product.type === 'physical' ? 'Order Now' : 'Buy Now');
    const ctaIcon = product.type === 'affiliate' ? 'fa-external-link-alt' : 'fa-cart-shopping';
    const ctaHref = product.type === 'affiliate' ? (product.affiliate_link || productUrl) : productUrl;

    document.getElementById('content').innerHTML = `
      <div class="product-card">
        <div class="product-layout">
          <div class="gallery">
            <div class="main-image"><img id="mainImg" src="${images[0]}" alt="${escapeHtml(product.title)}"></div>
            ${images.length > 1 ? `<div class="thumbnail-list">${images.map((img, i) => `<img src="${img}" class="${i === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)">`).join('')}</div>` : ''}
          </div>
          <div class="info-panel">
            <span class="share-badge"><i class="fas fa-share-nodes"></i> Shared Product</span>
            <h1 class="product-title">${escapeHtml(product.title)}</h1>
            ${trustHtml}
            <div class="price">$${Number(product.price || 0).toFixed(2)}</div>
            <p class="description">${escapeHtml(product.description || '')}</p>

            ${product.type === 'physical' ? `
              <div class="details-grid">
                <div class="details-row"><span class="details-label">Condition</span><span class="details-value"><span class="condition-badge ${conditionClass}">${escapeHtml(conditionText)}</span></span></div>
                <div class="details-row"><span class="details-label">Ships to</span><span class="details-value">${escapeHtml(product.delivery_countries || 'Worldwide')}</span></div>
                <div class="details-row"><span class="details-label">Est. delivery</span><span class="details-value">${product.estimated_delivery_days || 7} days</span></div>
              </div>
            ` : ''}

            <div class="cta-row">
              <a href="${ctaHref}" class="btn primary"><i class="fas ${ctaIcon}"></i> ${ctaLabel}</a>
              <a href="/seller/${product.user_id}" class="btn dark"><i class="fas fa-store"></i> Visit Seller's Storefront</a>
              <a href="products.html" class="btn"><i class="fas fa-compass"></i> Browse More Products</a>
            </div>
          </div>
        </div>
      </div>
      ${product.share_view_count ? `<div class="share-stats">Viewed ${product.share_view_count} time${product.share_view_count === 1 ? '' : 's'} via shared links</div>` : ''}
    `;
  }

  function changeMainImage(src, el) {
    document.getElementById('mainImg').src = src;
    document.querySelectorAll('.thumbnail-list img').forEach(img => img.classList.remove('active'));
    el.classList.add('active');
  }

  loadSharedProduct();
</script>

</body>
</html>
