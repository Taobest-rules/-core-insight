<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Core Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            color: #e6f1ff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; width: 100%; }
        .success-card { 
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px; 
            padding: 40px; 
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        /* Marketplace Banner - Replacement for Bismillah */
        .marketplace-banner {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
            transition: all 0.3s ease;
        }
        .marketplace-banner span {
            color: gold;
            font-size: 1.1rem;
            line-height: 1.5;
            display: block;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .marketplace-banner span:first-child {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255,215,0,0.3);
        }
        .marketplace-banner span:last-child {
            font-size: 0.85rem;
            font-weight: 500;
            color: #FFD700;
            opacity: 0.95;
        }
        .success-icon { 
            width: 80px; 
            height: 80px; 
            background: rgba(16, 185, 129, 0.2); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 24px; 
        }
        .success-icon i { font-size: 48px; color: #10b981; }
        h1 { color: #10b981; margin-bottom: 16px; }
        p { color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
        .btn { 
            display: inline-block; 
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
            padding: 12px 32px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 600; 
            margin: 8px; 
            transition: all 0.3s; 
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,215,0,0.3); }
        .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
        .btn-outline:hover { background: rgba(59, 130, 246, 0.1); box-shadow: none; }
        .escrow-note {
            background: rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
        
        @media (max-width: 480px) {
            .success-card { padding: 25px; }
            .marketplace-banner span:first-child { font-size: 1.3rem; }
            .marketplace-banner span:last-child { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Core Insight Marketplace Banner (Replaces Bismillah) -->
        <div class="marketplace-banner">
            <span style="color: gold;">Core Insight MarketPlace</span>
            <span style="color: gold;">The One Place Where Everyone Is Welcomed</span>
        </div>
        <div class="success-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>Payment Successful! 🎉</h1>
            <p>Your payment has been processed successfully.<br>Your order is now being processed.</p>
            <div style="margin-top: 24px;">
                <a href="/products.html" class="btn">Continue Shopping</a>
                <a href="/order-tracking.html" class="btn btn-outline">Track Order</a>
            </div>
            <div class="escrow-note">
                <i class="fas fa-lock"></i> Your payment is held in escrow for 7 days. 
                You can request a refund within this period if needed.
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        if (orderId) {
            console.log('Order ID:', orderId);
        }
    </script>
</body>
</html>
