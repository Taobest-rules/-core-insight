<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking - Core Insight</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a192f; color: #e6f1ff; min-height: 100vh; }
    
    header {
      height: 70px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e6f1ff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    nav a {
      color: #94a3b8;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
    }
    
    nav a:hover, nav a.active { color: #3b82f6; }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    
    /* Search Box */
    .search-box {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid #334155;
      text-align: center;
    }
    
    .search-box h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }
    
    .search-input-group {
      display: flex;
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
    }
    
    .search-input-group input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e6f1ff;
      font-size: 16px;
    }
    
    .search-input-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    
    .search-input-group button {
      padding: 14px 28px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .search-input-group button:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    
    /* Tracking Header */
    .tracking-header {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid #334155;
    }
    
    .order-id {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    
    .product-info {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .product-image {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .product-details h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    
    .product-details p {
      color: #94a3b8;
      font-size: 14px;
    }
    
    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
    }
    
    .status-pending_seller_approval { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .status-seller_accepted { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .status-paid { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .status-processing { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .status-shipped { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .status-delivered { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .status-completed { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .status-refunded { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .status-cancelled { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .status-refund_requested { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    
    .timeline {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid #334155;
    }
    
    .timeline-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .timeline-steps {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    
    .timeline-step {
      display: flex;
      gap: 20px;
      padding: 20px 0;
      position: relative;
    }
    
    .timeline-step:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 24px;
      top: 60px;
      bottom: -20px;
      width: 2px;
      background: #334155;
    }
    
    .timeline-step.completed:not(:last-child)::before {
      background: #10b981;
    }
    
    .step-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      flex-shrink: 0;
    }
    
    .timeline-step.completed .step-icon {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.1);
    }
    
    .timeline-step.current .step-icon {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    
    .step-icon i { font-size: 20px; }
    .timeline-step.completed .step-icon i { color: #10b981; }
    .timeline-step.current .step-icon i { color: #3b82f6; }
    
    .step-content { flex: 1; }
    .step-title { font-weight: 600; margin-bottom: 4px; }
    .step-date { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .step-description { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    
    .tracking-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid #334155;
    }
    
    .tracking-card h3 {
      font-size: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .tracking-details {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
    }
    
    .tracking-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }
    
    .tracking-row:last-child { border-bottom: none; }
    .tracking-label { color: #94a3b8; font-size: 13px; }
    .tracking-value { font-weight: 500; }
    
    .action-buttons {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; transform: translateY(-2px); }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
    .btn-outline:hover { background: rgba(59, 130, 246, 0.1); }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.open { display: flex; }
    
    .modal-content {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      border: 1px solid #334155;
    }
    
    .modal-content textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e6f1ff;
      margin: 16px 0;
      font-family: inherit;
    }
    
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    
    .loading { text-align: center; padding: 60px; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .error-container {
      text-align: center;
      padding: 60px;
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
    }
    
    .error-container i {
      font-size: 48px;
      color: #ef4444;
      margin-bottom: 20px;
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #1e293b;
      border-left: 4px solid;
      z-index: 1100;
      animation: slideIn 0.3s ease;
    }
    
    .toast.success { border-left-color: #10b981; }
    .toast.error { border-left-color: #ef4444; }
    .toast.warning { border-left-color: #f59e0b; }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @media (max-width: 768px) {
      .container { padding: 20px 16px; }
      .timeline { padding: 20px; }
      .timeline-step { gap: 12px; }
      .step-icon { width: 40px; height: 40px; }
      .action-buttons { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
      .search-input-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-store"></i></div>
      <div class="logo-text">Core Insight</div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="courses.html">Courses</a>
      <a href="services.html">Services</a>
      <a href="order-tracking.html" class="active">Track Order</a>
    </nav>
  </header>

  <div class="container">
    <div id="content">
      <!-- Search Box -->
      <div class="search-box" id="searchBox">
        <h2><i class="fas fa-search"></i> Track Your Order</h2>
        <p style="margin-bottom: 20px; color: #94a3b8;">Enter your order number to track your package</p>
        <div class="search-input-group">
          <input type="text" id="orderNumberInput" placeholder="Enter Order Number (e.g., 12345)" autocomplete="off">
          <button onclick="searchOrder()"><i class="fas fa-truck"></i> Track Order</button>
        </div>
        <p style="margin-top: 16px; font-size: 12px; color: #64748b;">
          <i class="fas fa-info-circle"></i> You can find your order number in your order confirmation email or in your dashboard
        </p>
      </div>
      
      <!-- Loading State -->
      <div class="loading" id="loadingState" style="display: none;">
        <div class="spinner"></div>
        <p>Loading order details...</p>
      </div>
    </div>
  </div>

  <!-- Refund Modal -->
  <div id="refundModal" class="modal">
    <div class="modal-content">
      <h3><i class="fas fa-undo-alt"></i> Request Refund</h3>
      <p>Please explain why you want a refund:</p>
      <textarea id="refundReason" placeholder="Describe the issue with your order..."></textarea>
      <div class="modal-buttons">
        <button class="btn btn-outline" onclick="closeRefundModal()">Cancel</button>
        <button class="btn btn-danger" onclick="submitRefundRequest()">Submit Refund Request</button>
      </div>
    </div>
  </div>

  <script>
    let currentOrder = null;
    let currentOrderId = null;

    // Get order ID from URL
    function getOrderIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('orderId');
    }

    // Search order by ID
    function searchOrder() {
      const input = document.getElementById('orderNumberInput');
      const orderId = input.value.trim();
      
      if (!orderId) {
        showToast('Error', 'Please enter an order number', 'error');
        return;
      }
      
      // Update URL without reloading
      const newUrl = `${window.location.pathname}?orderId=${orderId}`;
      window.history.pushState({}, '', newUrl);
      
      // Load order
      loadOrderDetails(orderId);
    }

    // Load order details
    async function loadOrderDetails(orderIdParam = null) {
      const orderId = orderIdParam || getOrderIdFromUrl();
      
      const searchBox = document.getElementById('searchBox');
      const loadingState = document.getElementById('loadingState');
      const contentDiv = document.getElementById('content');
      
      if (!orderId) {
        // Show search box only
        if (searchBox) searchBox.style.display = 'block';
        if (loadingState) loadingState.style.display = 'none';
        return;
      }
      
      currentOrderId = orderId;
      
      // Show loading, hide search
      if (searchBox) searchBox.style.display = 'none';
      if (loadingState) loadingState.style.display = 'block';
      
      try {
        const response = await fetch(`/api/track-order/${orderId}`);
        const data = await response.json();
        
        if (loadingState) loadingState.style.display = 'none';
        
        if (!data.success) {
          showOrderNotFound(data.error || 'Order not found');
          return;
        }
        
        currentOrder = data.order;
        renderOrderDetails();
        
      } catch (error) {
        console.error('Error loading order:', error);
        if (loadingState) loadingState.style.display = 'none';
        showOrderNotFound('Failed to load order details. Please try again.');
      }
    }
    
    // Show order not found with search option
    function showOrderNotFound(message) {
      const container = document.getElementById('content');
      container.innerHTML = `
        <div class="error-container">
          <i class="fas fa-exclamation-triangle"></i>
          <h2>Order Not Found</h2>
          <p>${escapeHtml(message)}</p>
          <div class="search-box" style="margin-top: 30px; background: transparent; padding: 0;">
            <div class="search-input-group">
              <input type="text" id="retryOrderInput" placeholder="Enter Order Number" autocomplete="off">
              <button onclick="searchOrderFromError()" class="btn btn-primary">Track Order</button>
            </div>
          </div>
          <a href="products.html" class="btn btn-primary" style="margin-top: 20px; display: inline-block;">
            <i class="fas fa-shopping-cart"></i> Browse Products
          </a>
        </div>
      `;
    }
    
    function searchOrderFromError() {
      const input = document.getElementById('retryOrderInput');
      const orderId = input?.value.trim();
      if (orderId) {
        window.location.href = `order-tracking.html?orderId=${orderId}`;
      } else {
        showToast('Error', 'Please enter an order number', 'error');
      }
    }
    
    // Render order details
    function renderOrderDetails() {
      const container = document.getElementById('content');
      const order = currentOrder;
      
      const canRequestRefund = order.refund_available && order.order_status !== 'refunded' && order.order_status !== 'refund_requested';
      const canConfirmDelivery = order.order_status === 'delivered' || order.order_status === 'shipped';
      
      const html = `
        <div class="tracking-header">
          <div class="order-id">Order #${order.id}</div>
          <div class="product-info">
            <div class="product-image">
              ${order.product_image ? 
                `<img src="${order.product_image}" alt="${order.product_name}" onerror="this.src='https://placehold.co/400x250/1e293b/3b82f6/png?text=Product'">` :
                `<i class="fas fa-box" style="font-size: 32px; color: #94a3b8;"></i>`
              }
            </div>
            <div class="product-details">
              <h2>${escapeHtml(order.product_name)}</h2>
              <p>Quantity: ${order.quantity} | Total: $${order.total_amount.toFixed(2)}</p>
              <p>Seller: ${escapeHtml(order.seller_name || 'Core Insight')}</p>
              <span class="status-badge status-${order.order_status}">
                ${getStatusDisplay(order.order_status)}
              </span>
            </div>
          </div>
        </div>
        
        <div class="timeline">
          <div class="timeline-title">
            <i class="fas fa-history"></i> Order Timeline
          </div>
          <div class="timeline-steps">
            ${renderTimeline(order.timeline, order.order_status)}
          </div>
        </div>
        
        ${order.tracking_info ? `
          <div class="tracking-card">
            <h3><i class="fas fa-truck"></i> Shipping Information</h3>
            <div class="tracking-details">
              <div class="tracking-row">
                <span class="tracking-label">Carrier:</span>
                <span class="tracking-value">${escapeHtml(order.tracking_info.carrier || 'Standard Shipping')}</span>
              </div>
              <div class="tracking-row">
                <span class="tracking-label">Tracking Number:</span>
                <span class="tracking-value">${escapeHtml(order.tracking_info.tracking_number)}</span>
              </div>
              <div class="tracking-row">
                <span class="tracking-label">Status:</span>
                <span class="tracking-value">${escapeHtml(order.tracking_info.status || 'In Transit')}</span>
              </div>
            </div>
          </div>
        ` : ''}
        
        <div class="tracking-card">
          <h3><i class="fas fa-map-marker-alt"></i> Delivery Address</h3>
          <div class="tracking-details">
            <p>${escapeHtml(order.shipping_address || 'No address provided')}</p>
            ${order.estimated_delivery_days ? `<p style="margin-top: 8px; font-size: 13px; color: #94a3b8;">
              <i class="fas fa-calendar"></i> Estimated delivery: ${order.estimated_delivery_days} days after payment
            </p>` : ''}
          </div>
        </div>
        
        <div class="action-buttons">
          ${canConfirmDelivery ? `
            <button class="btn btn-success" onclick="confirmDelivery()">
              <i class="fas fa-check-circle"></i> Confirm Delivery
            </button>
          ` : ''}
          ${canRequestRefund ? `
            <button class="btn btn-danger" onclick="openRefundModal()">
              <i class="fas fa-undo-alt"></i> Request Refund
            </button>
          ` : ''}
          ${order.order_status === 'refund_requested' ? `
            <button class="btn btn-outline" onclick="checkRefundStatus()">
              <i class="fas fa-clock"></i> Check Refund Status
            </button>
          ` : ''}
          <button class="btn btn-primary" onclick="window.location.href='products.html'">
            <i class="fas fa-shopping-cart"></i> Continue Shopping
          </button>
        </div>
      `;
      
      container.innerHTML = html;
    }
    
    // Render timeline steps
    function renderTimeline(timeline, currentStatus) {
      if (!timeline || timeline.length === 0) {
        return '<div class="timeline-step"><div class="step-content">No timeline information available</div></div>';
      }
      
      const allSteps = [
        { status: 'order_placed', title: 'Order Placed', icon: 'fa-shopping-cart', description: 'Your order has been placed' },
        { status: 'seller_accepted', title: 'Order Accepted', icon: 'fa-check-circle', description: 'Seller has accepted your order' },
        { status: 'payment_completed', title: 'Payment Received', icon: 'fa-credit-card', description: 'Payment has been received and is in escrow' },
        { status: 'processing', title: 'Processing', icon: 'fa-cogs', description: 'Seller is preparing your order' },
        { status: 'shipped', title: 'Shipped', icon: 'fa-truck', description: 'Your order has been shipped' },
        { status: 'delivered', title: 'Delivered', icon: 'fa-box-open', description: 'Your order has been delivered' },
        { status: 'completed', title: 'Completed', icon: 'fa-trophy', description: 'Order completed' }
      ];
      
      let currentIndex = -1;
      for (let i = 0; i < allSteps.length; i++) {
        const stepExists = timeline.some(t => t.status === allSteps[i].status && t.completed);
        if (stepExists) currentIndex = i;
      }
      
      if (currentIndex === -1) {
        return timeline.map(step => `
          <div class="timeline-step ${step.completed ? 'completed' : ''}">
            <div class="step-icon"><i class="fas ${step.icon || 'fa-info-circle'}"></i></div>
            <div class="step-content">
              <div class="step-title">${escapeHtml(step.title)}</div>
              <div class="step-date">${formatDate(step.timestamp)}</div>
              <div class="step-description">${escapeHtml(step.description)}</div>
            </div>
          </div>
        `).join('');
      }
      
      return allSteps.map((step, index) => {
        const isCompleted = index <= currentIndex;
        const isCurrent = index === currentIndex;
        const stepData = timeline.find(t => t.status === step.status);
        
        return `
          <div class="timeline-step ${isCompleted ? 'completed' : ''} ${isCurrent ? 'current' : ''}">
            <div class="step-icon"><i class="fas ${step.icon}"></i></div>
            <div class="step-content">
              <div class="step-title">${step.title}</div>
              ${stepData && stepData.timestamp ? `<div class="step-date">${formatDate(stepData.timestamp)}</div>` : ''}
              <div class="step-description">
                ${isCompleted ? step.description : (index === currentIndex + 1 ? 'Awaiting...' : 'Pending')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    async function confirmDelivery() {
      if (!confirm('Have you received your order? Confirming delivery will complete your order.')) return;
      
      try {
        const response = await fetch(`/api/orders/${currentOrderId}/confirm-delivery`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showToast('Delivery Confirmed!', 'Thank you for your purchase!', 'success');
          setTimeout(() => loadOrderDetails(currentOrderId), 1500);
        } else {
          showToast('Error', data.error || 'Failed to confirm delivery', 'error');
        }
      } catch (error) {
        showToast('Error', 'Network error. Please try again.', 'error');
      }
    }
    
    async function checkRefundStatus() {
      try {
        const response = await fetch(`/api/orders/${currentOrderId}/refund-status`, {
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.success) {
          let statusMessage = '';
          switch(data.refundStatus) {
            case 'pending':
              statusMessage = `⏳ Refund Request Pending\n\nRequested on: ${new Date(data.requestedAt).toLocaleDateString()}\n\n${data.message}`;
              break;
            case 'approved':
              statusMessage = `✅ Refund Approved\n\n${data.message}`;
              break;
            case 'denied':
              statusMessage = `❌ Refund Denied\n\n${data.message}`;
              break;
            default:
              statusMessage = `No refund request for this order.`;
          }
          alert(statusMessage);
        }
      } catch (error) {
        showToast('Error', 'Unable to check refund status', 'error');
      }
    }
    
    function openRefundModal() {
      document.getElementById('refundModal').classList.add('open');
    }
    
    function closeRefundModal() {
      document.getElementById('refundModal').classList.remove('open');
      document.getElementById('refundReason').value = '';
    }
    
    async function submitRefundRequest() {
      const reason = document.getElementById('refundReason').value.trim();
      
      if (!reason) {
        showToast('Reason Required', 'Please explain why you want a refund', 'warning');
        return;
      }
      
      if (reason.length < 10) {
        showToast('Reason Too Short', 'Please provide at least 10 characters', 'warning');
        return;
      }
      
      closeRefundModal();
      
      try {
        const response = await fetch(`/api/physical-orders/${currentOrderId}/refund`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: reason }),
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showToast('Refund Request Submitted', 'The seller will review your request within 48 hours', 'success');
          setTimeout(() => loadOrderDetails(currentOrderId), 1500);
        } else {
          showToast('Error', data.error || 'Failed to submit refund request', 'error');
        }
      } catch (error) {
        showToast('Error', 'Network error. Please try again.', 'error');
      }
    }
    
    function getStatusDisplay(status) {
     const statusMap = {
  'pending_seller_approval': { text: 'Awaiting Seller Approval', icon: 'fa-clock', color: 'warning' },
  'seller_accepted': { text: 'Awaiting Payment', icon: 'fa-credit-card', color: 'info' },
  'paid': { text: 'Payment Confirmed - Processing', icon: 'fa-check-circle', color: 'success' },
  'processing': { text: 'Processing Order', icon: 'fa-cogs', color: 'info' },
  'shipped': { text: 'Shipped', icon: 'fa-truck', color: 'primary' },
  'delivered': { text: 'Delivered', icon: 'fa-box-open', color: 'success' },
  'completed': { text: 'Completed', icon: 'fa-trophy', color: 'success' },
  'cancelled': { text: 'Cancelled', icon: 'fa-times-circle', color: 'danger' }
};
      return statusMap[status] || status.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }
    
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function showToast(title, message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<strong>${title}</strong><br><small>${message}</small>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      const orderId = getOrderIdFromUrl();
      if (orderId) {
        document.getElementById('orderNumberInput').value = orderId;
        await loadOrderDetails(orderId);
      }
    });
    
    // Make functions global
    window.searchOrder = searchOrder;
    window.searchOrderFromError = searchOrderFromError;
    window.confirmDelivery = confirmDelivery;
    window.openRefundModal = openRefundModal;
    window.closeRefundModal = closeRefundModal;
    window.submitRefundRequest = submitRefundRequest;
    window.checkRefundStatus = checkRefundStatus;
  </script>
</body>
</html>
