<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - Core Insight</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a192f 0%, #0f172a 100%);
      color: #e6f1ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-container {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bismillah {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    }

    .bismillah-arabic {
      font-size: 1.8rem;
      color: #FFD700;
      font-family: 'Amiri', 'Traditional Arabic', serif;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }

    .bismillah-english {
      font-size: 0.85rem;
      color: #94a3b8;
      font-style: italic;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #FFD700, #D4AF37);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 0.9rem 2.5rem 0.9rem 1rem;
      border: 2px solid #334155;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      color: #e6f1ff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease;
    }

    .toggle-password:hover {
      color: #FFD700;
    }

    /* Password strength indicator */
    .strength-container {
      margin-top: 0.5rem;
    }

    .strength-bar {
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
      border-radius: 2px;
    }

    .strength-text {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .requirements {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .requirement {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .requirement.valid {
      color: #10b981;
    }

    .requirement.invalid {
      color: #64748b;
    }

    button {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #FFD700, #D4AF37);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .info {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }

    .back-link a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.3s ease;
    }

    .back-link a:hover {
      color: #FFD700;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #0f172a;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="bismillah">
      <div class="bismillah-arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <div class="bismillah-english">In the name of Allah, the Most Gracious, the Most Merciful</div>
    </div>

    <h2>🔐 Set New Password</h2>
    <div class="subtitle">Please enter your new password below</div>

    <form id="resetPasswordForm">
      <div class="input-group">
        <label>New Password</label>
        <div class="password-wrapper">
          <input type="password" id="newPassword" placeholder="Enter new password" required>
          <button type="button" class="toggle-password" data-target="newPassword">
            👁️
          </button>
        </div>
        <div class="strength-container">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-text" id="strengthText">Enter a password</div>
          <div class="requirements" id="requirements">
            <span class="requirement" id="req-length">🔴 8+ characters</span>
            <span class="requirement" id="req-upper">🔴 Uppercase letter</span>
            <span class="requirement" id="req-lower">🔴 Lowercase letter</span>
            <span class="requirement" id="req-number">🔴 Number</span>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label>Confirm New Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
          <button type="button" class="toggle-password" data-target="confirmPassword">
            👁️
          </button>
        </div>
        <div id="matchIndicator" style="font-size: 0.75rem; margin-top: 0.5rem;"></div>
      </div>

      <button type="submit" id="submitBtn">Reset Password</button>
    </form>

    <div id="resetMessage"></div>
    
    <div class="back-link">
      <a href="login.html">← Back to Login</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // DOM elements
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('resetMessage');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');

    // Check if token exists
    if (!token) {
      messageDiv.innerHTML = '<div class="message error">❌ Invalid or missing reset link. Please request a new password reset.</div>';
      submitBtn.disabled = true;
    }

    // Toggle password visibility for all password fields
    document.querySelectorAll('.toggle-password').forEach(button => {
      button.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const targetInput = document.getElementById(targetId);
        
        if (targetInput.type === 'password') {
          targetInput.type = 'text';
          this.textContent = '🙈';
        } else {
          targetInput.type = 'password';
          this.textContent = '👁️';
        }
      });
    });

    // Password strength checker
    function checkPasswordStrength(password) {
      let strength = 0;
      const checks = {
        length: password.length >= 8,
        uppercase: /[A-Z]/.test(password),
        lowercase: /[a-z]/.test(password),
        number: /[0-9]/.test(password)
      };

      // Update requirement indicators
      updateRequirement('req-length', checks.length);
      updateRequirement('req-upper', checks.uppercase);
      updateRequirement('req-lower', checks.lowercase);
      updateRequirement('req-number', checks.number);

      // Calculate strength
      if (checks.length) strength++;
      if (checks.uppercase) strength++;
      if (checks.lowercase) strength++;
      if (checks.number) strength++;

      // Update visual strength bar
      let width = (strength / 4) * 100;
      let barColor = '#ef4444'; // red
      let text = 'Weak password';

      if (strength === 2) {
        barColor = '#f59e0b'; // orange
        text = 'Fair password';
      } else if (strength === 3) {
        barColor = '#3b82f6'; // blue
        text = 'Good password';
      } else if (strength === 4) {
        barColor = '#10b981'; // green
        text = 'Strong password!';
      }

      strengthFill.style.width = width + '%';
      strengthFill.style.background = barColor;
      strengthText.textContent = text;
      strengthText.style.color = barColor;

      return strength === 4;
    }

    function updateRequirement(id, isValid) {
      const element = document.getElementById(id);
      if (isValid) {
        element.innerHTML = '✅ ' + element.innerHTML.substring(2);
        element.classList.add('valid');
        element.classList.remove('invalid');
      } else {
        element.innerHTML = '🔴 ' + element.innerHTML.substring(2);
        element.classList.remove('valid');
        element.classList.add('invalid');
      }
    }

    // Check password match
    function checkPasswordsMatch() {
      const newPass = newPasswordInput.value;
      const confirmPass = confirmPasswordInput.value;
      const matchIndicator = document.getElementById('matchIndicator');

      if (confirmPass.length === 0) {
        matchIndicator.innerHTML = '';
        return false;
      }

      if (newPass === confirmPass) {
        matchIndicator.innerHTML = '✅ Passwords match';
        matchIndicator.style.color = '#10b981';
        return true;
      } else {
        matchIndicator.innerHTML = '❌ Passwords do not match';
        matchIndicator.style.color = '#f87171';
        return false;
      }
    }

    // Real-time validation
    newPasswordInput.addEventListener('input', function() {
      checkPasswordStrength(this.value);
      checkPasswordsMatch();
    });

    confirmPasswordInput.addEventListener('input', checkPasswordsMatch);

    // Form submission
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      
      // Clear previous messages
      messageDiv.innerHTML = '';
      
      // Validation
      if (!newPassword || !confirmPassword) {
        messageDiv.innerHTML = '<div class="message error">❌ Please fill in all fields</div>';
        return;
      }

      if (newPassword.length < 8) {
        messageDiv.innerHTML = '<div class="message error">❌ Password must be at least 8 characters</div>';
        return;
      }

      if (!/[A-Z]/.test(newPassword)) {
        messageDiv.innerHTML = '<div class="message error">❌ Password must contain at least one uppercase letter</div>';
        return;
      }

      if (!/[a-z]/.test(newPassword)) {
        messageDiv.innerHTML = '<div class="message error">❌ Password must contain at least one lowercase letter</div>';
        return;
      }

      if (!/[0-9]/.test(newPassword)) {
        messageDiv.innerHTML = '<div class="message error">❌ Password must contain at least one number</div>';
        return;
      }

      if (newPassword !== confirmPassword) {
        messageDiv.innerHTML = '<div class="message error">❌ Passwords do not match</div>';
        return;
      }

      // Show loading state
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="spinner"></span> Resetting...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            token: token, 
            password: newPassword
          })
        });

        const data = await res.json();
        
        if (res.ok && data.success) {
          messageDiv.innerHTML = `<div class="message success">✅ ${data.message || 'Password reset successful! Redirecting to login...'}</div>`;
          
          // Clear form
          newPasswordInput.value = '';
          confirmPasswordInput.value = '';
          
          // Reset strength indicator
          strengthFill.style.width = '0%';
          strengthText.textContent = 'Enter a password';
          
          // Redirect to login after 3 seconds
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 3000);
        } else {
          messageDiv.innerHTML = `<div class="message error">❌ ${data.error || data.message || 'Error resetting password'}</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = '<div class="message error">❌ Network error. Please check your connection and try again.</div>';
        console.error('Reset error:', err);
      } finally {
        // Reset button state
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    // Initial requirement display
    updateRequirement('req-length', false);
    updateRequirement('req-upper', false);
    updateRequirement('req-lower', false);
    updateRequirement('req-number', false);
  </script>
</body>
</html>
