<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wallet Top-Up | Core Insight</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="products.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .callback-card {
      background: var(--paper); border: 1px solid var(--hairline); border-radius: var(--radius-lg);
      padding: 48px 40px; max-width: 420px; width: 90%; text-align: center; box-shadow: var(--shadow-modal);
    }
    .callback-icon { font-size: 48px; margin-bottom: 20px; }
    .callback-icon.pending { color: var(--gold-deep); }
    .callback-icon.success { color: var(--sage-deep); }
    .callback-icon.error { color: var(--danger); }
    .callback-card h1 { font-size: 1.5rem; margin: 0 0 10px; }
    .callback-card p { color: var(--charcoal-soft); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    .callback-amount { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 600; color: var(--gold-deep); margin: 0 0 24px; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--hairline); border-top-color: var(--gold);
      border-radius: 50%; margin: 0 auto 20px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="callback-card">
    <div id="callbackState">
      <div class="spinner"></div>
      <h1>Confirming your payment…</h1>
      <p>This usually takes a few seconds. Please don't close this page.</p>
    </div>
  </div>

  <script>
    async function processWalletCallback() {
      const params = new URLSearchParams(window.location.search);
      const status = params.get('status');
      const txRef = params.get('tx_ref');
      const transactionId = params.get('transaction_id');
      const stateEl = document.getElementById('callbackState');

      // Flutterwave includes status=cancelled if the user backs out of payment
      if (status === 'cancelled') {
        stateEl.innerHTML = `
          <i class="fas fa-circle-xmark callback-icon error"></i>
          <h1>Payment cancelled</h1>
          <p>No funds were added to your wallet. You can try again anytime from your Wallet tab.</p>
          <a href="/profile.html?tab=wallet" class="btn primary">Back to Wallet</a>`;
        return;
      }

      if (!txRef || !transactionId) {
        stateEl.innerHTML = `
          <i class="fas fa-triangle-exclamation callback-icon error"></i>
          <h1>Something went wrong</h1>
          <p>We couldn't find your payment details. If money was deducted, contact support with this reference: <strong>${txRef || 'unknown'}</strong></p>
          <a href="/profile.html?tab=wallet" class="btn primary">Back to Wallet</a>`;
        return;
      }

      try {
        const res = await fetch(`/api/wallet/verify-topup?tx_ref=${encodeURIComponent(txRef)}&transaction_id=${encodeURIComponent(transactionId)}`, {
          credentials: 'include',
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Payment could not be verified.');
        }

        stateEl.innerHTML = `
          <i class="fas fa-circle-check callback-icon success"></i>
          <h1>${data.already_processed ? 'Already confirmed' : 'Wallet funded'}</h1>
          <p>${data.already_processed ? 'This payment was already added to your wallet.' : 'Your funds are now available.'}</p>
          ${data.new_balance != null ? `<div class="callback-amount">$${Number(data.new_balance).toFixed(2)}</div>` : ''}
          <a href="/profile.html?tab=wallet" class="btn primary">Go to Wallet</a>`;
      } catch (err) {
        stateEl.innerHTML = `
          <i class="fas fa-triangle-exclamation callback-icon error"></i>
          <h1>Couldn't confirm payment</h1>
          <p>${err.message || 'Please check your Wallet tab in a moment — if funds were deducted, they should still appear shortly.'}</p>
          <a href="/profile.html?tab=wallet" class="btn primary">Check Wallet</a>`;
      }
    }

    processWalletCallback();
  </script>

</body>
</html>
