<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Core Insight</title>
  <style>
    :root {
      --primary-dark: #0f172a;
      --secondary-dark: #1e293b;
      --accent-gold: #FFD700;
      --text-light: #e0e0e0;
      --text-gray: #a0a0a0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: var(--primary-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    
    .auth-container {
      background: var(--secondary-dark);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
    }
    
    h2 {
      text-align: center;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, var(--accent-gold), #D4AF37);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .login-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.25rem;
      border-radius: 8px;
    }
    
    .toggle-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-gray);
      padding: 0.5rem;
      cursor: pointer;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .toggle-btn.active {
      background: var(--accent-gold);
      color: #000;
    }
    
    .field-group {
      display: none;
    }
    
    .field-group.active {
      display: block;
    }
    
    .form-group {
      margin-bottom: 1rem;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-light);
      font-weight: 600;
    }
    
    input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--text-gray);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-light);
      font-size: 16px;
    }
    
    input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }
    
    .password-wrapper {
      position: relative;
    }
    
    .password-wrapper button {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-gray);
      cursor: pointer;
    }
    
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-gray);
    }
    
    .forgot-link {
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
      background: none;
      border: none;
    }
    
    .forgot-link:hover {
      text-decoration: underline;
    }
    
    button[type="submit"] {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, var(--accent-gold), #D4AF37);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease;
      font-size: 16px;
    }
    
    button[type="submit"]:hover {
      transform: translateY(-2px);
    }
    
    .message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      text-align: center;
    }
    
    .success { background: rgba(0, 255, 0, 0.1); color: lightgreen; }
    .error { background: rgba(255, 0, 0, 0.1); color: lightcoral; }
    
    .links {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--text-gray);
    }
    
    .links a {
      color: var(--accent-gold);
      text-decoration: none;
    }
    
    .links a:hover {
      text-decoration: underline;
    }
    
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .modal-content {
      background: var(--secondary-dark);
      padding: 2rem;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .modal-header h3 {
      color: var(--text-light);
    }
    
    .close-modal {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .close-modal:hover {
      color: var(--accent-gold);
    }
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #000;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Login to Core Insight</h2>
    
    <div class="login-toggle">
      <button class="toggle-btn active" id="usernameToggle">Username</button>
      <button class="toggle-btn" id="emailToggle">Email</button>
    </div>
    
    <form id="loginForm">
      <div class="field-group active" id="usernameGroup">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Enter your username" />
        </div>
      </div>
      
      <div class="field-group" id="emailGroup">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="Enter your email" />
        </div>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" placeholder="Enter your password" required />
          <button type="button" onclick="togglePassword('loginPassword')">👁️</button>
        </div>
      </div>
      
      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe"> Remember me
        </label>
        <button type="button" class="forgot-link" onclick="openForgotModal()">Forgot Password?</button>
      </div>
      
      <button type="submit" id="loginBtn">Login</button>
    </form>
    
    <div id="loginMessage"></div>
    
    <div class="links">
      <a href="signup.html">Don't have an account? Sign Up</a>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal" id="forgotModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Reset Password</h3>
        <button class="close-modal" onclick="closeForgotModal()">✕</button>
      </div>
      
      <div id="forgotMessage"></div>
      
      <form id="forgotForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="resetEmail" placeholder="Enter your email" required />
        </div>
        <button type="submit" id="resetBtn">Send Reset Link</button>
      </form>
    </div>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword(id) {
      const field = document.getElementById(id);
      field.type = field.type === "password" ? "text" : "password";
    }

    // Toggle between username and email
    const usernameToggle = document.getElementById('usernameToggle');
    const emailToggle = document.getElementById('emailToggle');
    const usernameGroup = document.getElementById('usernameGroup');
    const emailGroup = document.getElementById('emailGroup');

    usernameToggle.addEventListener('click', () => {
      usernameToggle.classList.add('active');
      emailToggle.classList.remove('active');
      usernameGroup.classList.add('active');
      emailGroup.classList.remove('active');
    });

    emailToggle.addEventListener('click', () => {
      emailToggle.classList.add('active');
      usernameToggle.classList.remove('active');
      emailGroup.classList.add('active');
      usernameGroup.classList.remove('active');
    });

    // Modal functions
    function openForgotModal() {
      document.getElementById('forgotModal').style.display = 'flex';
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').style.display = 'none';
      document.getElementById('forgotMessage').innerHTML = '';
      document.getElementById('resetEmail').value = '';
    }

    // LOGIN FORM HANDLER - FIXED
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('loginUsername').value;
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const loginBtn = document.getElementById('loginBtn');
      const messageDiv = document.getElementById('loginMessage');

      // Clear previous messages
      messageDiv.innerHTML = '';

      // Validate password
      if (!password) {
        messageDiv.innerHTML = '<div class="message error">❌ Please enter your password</div>';
        return;
      }

      // Determine login method
      const useUsername = usernameToggle.classList.contains('active');
      
      if (useUsername && !username) {
        messageDiv.innerHTML = '<div class="message error">❌ Please enter your username</div>';
        return;
      }
      
      if (!useUsername && !email) {
        messageDiv.innerHTML = '<div class="message error">❌ Please enter your email</div>';
        return;
      }

      // Prepare login data
      const loginData = useUsername 
        ? { username, password, rememberMe } 
        : { email, password, rememberMe };

      // Show loading state
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(loginData),
        });

        const data = await res.json();
        
        if (res.ok) {
          messageDiv.innerHTML = '<div class="message success">✅ Login successful! Redirecting...</div>';
          
          // Redirect to the page that was working before
          setTimeout(() => {
            window.location.href = 'courses.html'; // Changed from dashboard.html to courses.html
          }, 1500);
        } else {
          messageDiv.innerHTML = `<div class="message error">❌ ${data.error || 'Invalid credentials'}</div>`;
        }
      } catch (err) {
        console.error('Login error:', err);
        messageDiv.innerHTML = '<div class="message error">⚠️ Connection error. Please try again.</div>';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Login';
      }
    });

    // FORGOT PASSWORD HANDLER
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('resetEmail').value;
      const resetBtn = document.getElementById('resetBtn');
      const messageDiv = document.getElementById('forgotMessage');
      
      if (!email) {
        messageDiv.innerHTML = '<div class="message error">❌ Please enter your email</div>';
        return;
      }
      
      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span class="spinner"></span> Sending...';
      
      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          messageDiv.innerHTML = '<div class="message success">✅ Reset link sent! Check your email.</div>';
          setTimeout(closeForgotModal, 2000);
        } else {
          messageDiv.innerHTML = `<div class="message error">❌ ${data.error || 'Error sending reset link'}</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = '<div class="message error">⚠️ Network error. Please try again.</div>';
      } finally {
        resetBtn.disabled = false;
        resetBtn.innerHTML = 'Send Reset Link';
      }
    });

    // Close modal when clicking outside
    window.addEventListener('click', (e) => {
      const modal = document.getElementById('forgotModal');
      if (e.target === modal) {
        closeForgotModal();
      }
    });

    // Check if user is already logged in
    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        const user = await res.json();
        
        if (user && user.id) {
          window.location.href = 'courses.html'; // Changed to courses.html
        }
      } catch (error) {
        // User not logged in, stay on login page
      }
    }

    // Check authentication on page load
    checkAuth();
  </script>
</body>
</html>
