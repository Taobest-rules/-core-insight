<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Payment Processing | Core Insight</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#faf9f6; --cream-deep:#f5f3ee; --paper:#fff;
  --charcoal:#2b2b28; --charcoal-soft:#55524a; --text-muted:#8a8578;
  --hairline:#e9e5dc; --hairline-strong:#ddd7ca;
  --blue:#4a6fa5; --blue-deep:#3c5c8a; --sage:#5a8d7d; --sage-deep:#497363;
  --gold:#c9971f; --gold-deep:#a97c15; --gold-tint:#f8ecd2;
  --danger:#b3492f; --danger-tint:#f7e6e1;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  --shadow-modal:0 24px 60px rgba(43,43,40,.18); --ease:cubic-bezier(.4,0,.2,1);
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--cream); color:var(--charcoal); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; -webkit-font-smoothing:antialiased; }
h2 { font-family:'Fraunces',Georgia,serif; font-weight:600; color:var(--charcoal); margin-bottom:20px; }

.container { max-width:480px; width:100%; background:var(--paper); border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:clamp(28px,7vw,40px) clamp(22px,6vw,32px); text-align:center; box-shadow:var(--shadow-modal); }

.marketplace-banner { text-align:center; padding:14px; background:var(--gold-tint); border-radius:var(--radius-md); margin-bottom:20px; }
.marketplace-banner span { display:block; color:var(--gold-deep); }
.marketplace-banner span:first-child { font-family:'Fraunces',serif; font-size:1.05rem; font-weight:600; margin-bottom:3px; }
.marketplace-banner span:last-child { font-size:11.5px; font-weight:600; letter-spacing:.04em; opacity:.9; }

.spinner { border:3px solid var(--hairline); border-top-color:var(--gold); border-radius:50%; width:44px; height:44px; animation:spin .8s linear infinite; margin:20px auto; }
@keyframes spin { to { transform:rotate(360deg); } }
.success { color:var(--sage-deep); }
.error { color:var(--danger); }
#message { color:var(--charcoal-soft); font-size:14px; line-height:1.7; }

.btn, .download-btn, .watch-btn { padding:12px 24px; border:none; border-radius:var(--radius-sm); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; margin:6px; font-weight:600; font-size:14px; transition:var(--ease); }
.btn { background:var(--gold); color:var(--charcoal); }
.btn:hover { background:var(--gold-deep); }
.download-btn { background:var(--sage); color:#fff; }
.download-btn:hover { background:var(--sage-deep); }
.watch-btn { background:var(--blue); color:#fff; }
.watch-btn:hover { background:var(--blue-deep); }

.product-info, .course-info { border-radius:var(--radius-md); padding:15px; margin:18px 0; text-align:left; font-size:13.5px; }
.product-info { background:#e6efe9; color:var(--sage-deep); }
.course-info { background:#e3ecf5; color:var(--blue-deep); }

.ref-row { display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; color:var(--text-muted); margin-top:14px; }
.ref-copy-btn { background:none; border:none; color:var(--charcoal-soft); cursor:pointer; padding:2px 4px; }
.ref-copy-btn:hover { color:var(--charcoal); }
.ref-copy-btn.copied { color:var(--sage-deep); }

@media (max-width:480px) { .container { padding:26px 20px; } }
</style>
</head>
<body>
  <div class="container">
    <div class="marketplace-banner">
      <span>Core Insight Marketplace</span>
      <span>The One Place Where Everyone Is Welcomed</span>
    </div>
    <div id="paymentStatus">
      <h2>Processing Payment…</h2>
      <div class="spinner"></div>
      <p id="message">Please wait while we verify your payment…</p>
    </div>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  let reference = urlParams.get('reference') || urlParams.get('trxref') || urlParams.get('tx_ref') || urlParams.get('transaction_id');
  let paymentType = urlParams.get('type') || 'auto';

  console.log('Payment callback received. Reference:', reference, 'Type:', paymentType);

  if (reference && reference.startsWith('PS_')) {
    reference = reference.substring(3);
    console.log('Removed PS_ prefix. New reference:', reference);
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.copyReference = function (btn) {
    const text = document.getElementById('refText')?.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      btn.classList.add('copied');
      btn.innerHTML = '<i class="fas fa-check"></i>';
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<i class="far fa-copy"></i>'; }, 1800);
    });
  };

  function renderRefRow() {
    return reference ? `<div class="ref-row"><span>Ref: <span id="refText">${escapeHtml(reference)}</span></span><button class="ref-copy-btn" onclick="copyReference(this)" title="Copy reference"><i class="far fa-copy"></i></button></div>` : '';
  }

  async function verifyPayment() {
    if (!reference) {
      document.getElementById('paymentStatus').innerHTML = `
        <h2><span class="error">❌ No Payment Reference Found</span></h2>
        <p id="message">We couldn't find a payment reference in this link. If you just completed a purchase, check your email for confirmation.</p>
        <a href="/products.html" class="btn"><i class="fas fa-store"></i> Back to Products</a>
      `;
      return;
    }

    try {
      let endpoint = paymentType === 'course'
        ? `/api/verify-by-reference/${reference}`
        : `/api/verify-digital-payment/${reference}`;

      let response = await fetch(endpoint);
      let data = await response.json();

      if (paymentType === 'auto' && data.status !== 'success') {
        const altEndpoint = endpoint.includes('verify-by-reference')
          ? `/api/verify-digital-payment/${reference}`
          : `/api/verify-by-reference/${reference}`;
        const altResponse = await fetch(altEndpoint);
        const altData = await altResponse.json();
        if (altData.status === 'success') { data = altData; }
      }

      if (data.status === 'success') {
        if (data.course_id || data.course_title) {
          document.getElementById('paymentStatus').innerHTML = `
            <h2><span class="success">✅ Course Purchase Successful!</span></h2>
            <div class="course-info">
              <strong>${escapeHtml(data.course_title || 'Your course')}</strong><br>
              Amount: $${Number(data.amount || 0).toFixed(2)}
            </div>
            <a href="/courses.html" class="watch-btn"><i class="fas fa-play"></i> Start Learning</a>
            <a href="/courses.html" class="btn"><i class="fas fa-compass"></i> Browse More Courses</a>
            ${renderRefRow()}
          `;
        } else {
          const downloadUrl = data.download_url || data.downloadUrl;
          document.getElementById('paymentStatus').innerHTML = `
            <h2><span class="success">✅ Purchase Successful!</span></h2>
            <div class="product-info">
              <strong>${escapeHtml(data.product_title || data.product_name || 'Your purchase')}</strong><br>
              Amount: $${Number(data.amount || 0).toFixed(2)}
            </div>
            ${downloadUrl ? `<a href="${downloadUrl}" class="download-btn" download><i class="fas fa-download"></i> Download File</a>` : ''}
            <a href="/products.html" class="btn"><i class="fas fa-store"></i> Continue Shopping</a>
            ${renderRefRow()}
          `;
        }
      } else if (data.status === 'pending') {
        document.getElementById('message').textContent = 'Still confirming your payment — this can take a few seconds…';
        setTimeout(verifyPayment, 3000);
      } else {
        document.getElementById('paymentStatus').innerHTML = `
          <h2><span class="error">❌ Payment Verification Failed</span></h2>
          <p id="message">${escapeHtml(data.message || 'Please contact support with your reference below.')}</p>
          ${renderRefRow()}
          <a href="/contact.html" class="btn"><i class="fas fa-headset"></i> Contact Support</a>
        `;
      }
    } catch (error) {
      console.error('Verification error:', error);
      document.getElementById('paymentStatus').innerHTML = `
        <h2><span class="error">❌ Error Verifying Payment</span></h2>
        <p id="message">Please contact support with your reference below.</p>
        ${renderRefRow()}
        <a href="/contact.html" class="btn"><i class="fas fa-headset"></i> Contact Support</a>
      `;
    }
  }

  verifyPayment();
</script>

</body>
</html>
