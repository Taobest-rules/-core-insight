<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login | Core Insight</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#faf9f6; --cream-deep:#f5f3ee; --paper:#fff;
  --charcoal:#2b2b28; --charcoal-soft:#55524a; --text-muted:#8a8578;
  --hairline:#e9e5dc; --hairline-strong:#ddd7ca;
  --blue:#4a6fa5; --blue-deep:#3c5c8a; --sage:#5a8d7d; --sage-deep:#497363;
  --gold:#c9971f; --gold-deep:#a97c15; --gold-tint:#f8ecd2;
  --danger:#b3492f; --danger-tint:#f7e6e1;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  --shadow-modal:0 24px 60px rgba(43,43,40,.18); --ease:cubic-bezier(.4,0,.2,1);
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--cream); color:var(--charcoal); min-height:100vh; -webkit-font-smoothing:antialiased; }
h2,h3 { font-family:'Fraunces',Georgia,serif; font-weight:600; color:var(--charcoal); }
a { color:var(--blue); }

.top-bar { display:flex; justify-content:center; padding:20px 16px 0; }
.top-bar a { display:flex; align-items:center; gap:10px; text-decoration:none; }
.top-bar .logo-icon { width:34px; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--hairline); }
.top-bar .logo-text { font-family:'Fraunces',serif; font-size:1.15rem; font-weight:600; color:var(--charcoal); }

.auth-container { max-width:420px; margin:0 auto; padding:28px 20px 60px; }
.card { background:var(--paper); border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:clamp(24px,6vw,36px); }

.marketplace-banner { text-align:center; margin-bottom:20px; }
.marketplace-banner .name { display:block; font-family:'Fraunces',serif; font-size:1rem; font-weight:600; color:var(--charcoal); }
.marketplace-banner .tagline { display:block; font-size:11.5px; font-weight:600; letter-spacing:.05em; color:var(--gold-deep); margin-top:4px; }

.card h2 { text-align:center; font-size:1.6rem; margin:0 0 22px; }

.login-toggle { display:flex; background:var(--cream); border:1px solid var(--hairline); border-radius:var(--radius-sm); padding:3px; margin-bottom:20px; }
.toggle-btn { flex:1; padding:9px; border:none; background:none; border-radius:6px; font-size:13.5px; font-weight:500; color:var(--charcoal-soft); cursor:pointer; transition:var(--ease); }
.toggle-btn.active { background:var(--paper); color:var(--charcoal); font-weight:600; box-shadow:var(--shadow-rest,0 1px 2px rgba(0,0,0,.06)); }

.field-group { display:none; }
.field-group.active { display:block; }

.form-group { margin-bottom:18px; }
.form-group label { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--charcoal); margin-bottom:7px; }
.form-group label i { color:var(--gold-deep); width:14px; text-align:center; }
.form-group input[type="text"], .form-group input[type="email"], .form-group input[type="password"] {
  width:100%; padding:11px 13px; border:1px solid var(--hairline); border-radius:var(--radius-sm);
  font-size:14px; font-family:inherit; background:var(--cream); color:var(--charcoal);
}
.form-group input:focus { border-color:var(--blue); outline:none; background:var(--paper); }

.password-wrapper { position:relative; }
.password-wrapper input { padding-right:42px !important; }
.password-wrapper button { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--charcoal-soft); cursor:pointer; padding:8px; }

.options-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px; }
.remember-me { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--charcoal-soft); cursor:pointer; }
.remember-me input { accent-color:var(--gold); }
.forgot-link { background:none; border:none; color:var(--blue); font-size:13px; cursor:pointer; padding:0; }
.forgot-link:hover { text-decoration:underline; }

#loginBtn { width:100%; padding:13px; border:none; border-radius:var(--radius-sm); background:var(--gold); color:var(--charcoal); font-weight:600; font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:var(--ease); }
#loginBtn:hover { background:var(--gold-deep); }
#loginBtn:disabled { opacity:.65; cursor:not-allowed; }
.spinner { width:14px; height:14px; border:2px solid rgba(43,43,40,.3); border-top-color:var(--charcoal); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }

#loginMessage, #forgotMessage { margin-top:14px; }
.message { padding:13px 15px; border-radius:var(--radius-md); font-size:13px; line-height:1.6; }
.message.success { background:#e6efe9; color:var(--sage-deep); }
.message.error { background:var(--danger-tint); color:var(--danger); }
.message.warning { background:var(--gold-tint); color:var(--gold-deep); }
.message a { color:var(--gold-deep); font-weight:600; }

.links { text-align:center; margin-top:22px; }
.links a { font-size:13.5px; color:var(--charcoal-soft); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.links a:hover { color:var(--charcoal); }

.modal { display:none; position:fixed; inset:0; background:rgba(43,43,40,.5); backdrop-filter:blur(4px); z-index:1000; justify-content:center; align-items:center; padding:20px; }
.modal-content { background:var(--paper); border-radius:var(--radius-lg); padding:clamp(20px,5vw,28px); max-width:420px; width:100%; box-shadow:var(--shadow-modal); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.modal-header h3 { font-size:1.2rem; display:flex; align-items:center; gap:9px; }
.modal-header h3 i { color:var(--gold-deep); }
.close-modal { background:none; border:none; font-size:16px; color:var(--charcoal-soft); cursor:pointer; width:32px; height:32px; border-radius:50%; }
.close-modal:hover { background:var(--cream-deep); color:var(--charcoal); }
#resetBtn { width:100%; padding:12px; border:none; border-radius:var(--radius-sm); background:var(--charcoal); color:var(--cream); font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
#resetBtn:hover { background:#1b1a17; }

@media (max-width:480px) {
  .auth-container { padding:20px 14px 40px; }
  .card { padding:22px; }
  .options-row { flex-direction:column; align-items:flex-start; }
}
</style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html">
      <div class="logo-icon"><img src="https://i.pinimg.com/736x/27/7a/12/277a1257f00946e8337c57ac43c9b700.jpg" alt="Core Insight" style="width:100%;height:100%;object-fit:cover;"></div>
      <span class="logo-text">Core Insight</span>
    </a>
  </div>

  <div class="auth-container">
    <div class="card">
      <div class="marketplace-banner">
        <span class="name">Core Insight Marketplace</span>
        <span class="tagline">THE ONE PLACE WHERE EVERYONE IS WELCOMED</span>
      </div>

      <h2>Welcome Back</h2>

      <div class="login-toggle">
        <button class="toggle-btn active" id="usernameToggle">Username</button>
        <button class="toggle-btn" id="emailToggle">Email</button>
      </div>

      <form id="loginForm">
        <div class="field-group active" id="usernameGroup">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Username</label>
            <input type="text" id="loginUsername" placeholder="Enter your username">
          </div>
        </div>

        <div class="field-group" id="emailGroup">
          <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email">
          </div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" onclick="togglePassword('loginPassword')"><i class="far fa-eye"></i></button>
          </div>
        </div>

        <div class="options-row">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <button type="button" class="forgot-link" onclick="openForgotModal()">Forgot Password?</button>
        </div>

        <button type="submit" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
      </form>

      <div id="loginMessage"></div>

      <div class="links">
        <a href="signup.html"><i class="fas fa-user-plus"></i> Don't have an account? Sign Up</a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal" id="forgotModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-key"></i> Reset Password</h3>
        <button class="close-modal" onclick="closeForgotModal()">✕</button>
      </div>
      <div id="forgotMessage"></div>
      <form id="forgotForm">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="resetEmail" placeholder="Enter your email" required>
        </div>
        <button type="submit" id="resetBtn"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
      </form>
    </div>
  </div>

<script>
  function togglePassword(id) {
    const field = document.getElementById(id);
    const icon = field.nextElementSibling.querySelector('i');
    if (field.type === "password") {
      field.type = "text";
      if (icon) icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      field.type = "password";
      if (icon) icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  }

  // Toggle between username and email
  const usernameToggle = document.getElementById('usernameToggle');
  const emailToggle = document.getElementById('emailToggle');
  const usernameGroup = document.getElementById('usernameGroup');
  const emailGroup = document.getElementById('emailGroup');

  usernameToggle.addEventListener('click', () => {
    usernameToggle.classList.add('active');
    emailToggle.classList.remove('active');
    usernameGroup.classList.add('active');
    emailGroup.classList.remove('active');
  });

  emailToggle.addEventListener('click', () => {
    emailToggle.classList.add('active');
    usernameToggle.classList.remove('active');
    emailGroup.classList.add('active');
    usernameGroup.classList.remove('active');
  });

  function openForgotModal() { document.getElementById('forgotModal').style.display = 'flex'; }
  function closeForgotModal() {
    document.getElementById('forgotModal').style.display = 'none';
    document.getElementById('forgotMessage').innerHTML = '';
    document.getElementById('resetEmail').value = '';
  }

  // BUG FIX: the original file hardcoded every redirect to
  // /courses.html regardless of where the person came from or what
  // they were trying to do. This now honors a ?redirect= param that
  // other pages can pass (e.g. login.html?redirect=/products.html),
  // falling back to the homepage only if none was given.
  function getRedirectTarget() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    return redirect ? decodeURIComponent(redirect) : '/index.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('loginUsername').value.trim();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const rememberMe = document.getElementById('rememberMe').checked;
    const loginBtn = document.getElementById('loginBtn');
    const messageDiv = document.getElementById('loginMessage');

    messageDiv.innerHTML = '';

    if (!password) {
      messageDiv.innerHTML = '<div class="message error"><i class="fas fa-exclamation-circle"></i> Please enter your password</div>';
      return;
    }

    const useUsername = usernameToggle.classList.contains('active');

    if (useUsername && !username) {
      messageDiv.innerHTML = '<div class="message error"><i class="fas fa-exclamation-circle"></i> Please enter your username</div>';
      return;
    }
    if (!useUsername && !email) {
      messageDiv.innerHTML = '<div class="message error"><i class="fas fa-exclamation-circle"></i> Please enter your email</div>';
      return;
    }

    const loginData = useUsername ? { username, password, rememberMe } : { email, password, rememberMe };

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(loginData),
        credentials: 'include'
      });

      const data = await res.json();

      if (res.ok) {
        messageDiv.innerHTML = '<div class="message success"><i class="fas fa-check-circle"></i> Login successful! Redirecting...</div>';
        setTimeout(() => { window.location.href = getRedirectTarget(); }, 1000);
      } else {
        if (data.unverified || (data.error && data.error.toLowerCase().includes('verify'))) {
          messageDiv.innerHTML = `
            <div class="message warning">
              <i class="fas fa-envelope"></i> Please verify your email before logging in.<br>
              Check your inbox for the verification link.<br>
              <a href="verify.html">Click here to verify</a>
            </div>`;
        } else {
          messageDiv.innerHTML = `<div class="message error"><i class="fas fa-exclamation-circle"></i> ${data.error || 'Invalid credentials'}</div>`;
        }
      }
    } catch (err) {
      console.error('Login error:', err);
      messageDiv.innerHTML = '<div class="message error"><i class="fas fa-wifi"></i> Connection error. Please try again.</div>';
    } finally {
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    }
  });

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('resetEmail').value.trim();
    const resetBtn = document.getElementById('resetBtn');
    const messageDiv = document.getElementById('forgotMessage');

    if (!email) {
      messageDiv.innerHTML = '<div class="message error">Please enter your email</div>';
      return;
    }

    resetBtn.disabled = true;
    resetBtn.innerHTML = '<span class="spinner"></span> Sending...';

    try {
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();

      if (res.ok) {
        messageDiv.innerHTML = '<div class="message success">Reset link sent! Check your email.</div>';
        setTimeout(closeForgotModal, 2000);
      } else {
        messageDiv.innerHTML = `<div class="message error">${data.error || 'Error sending reset link'}</div>`;
      }
    } catch (err) {
      messageDiv.innerHTML = '<div class="message error">Network error. Please try again.</div>';
    } finally {
      resetBtn.disabled = false;
      resetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
    }
  });

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('message') === 'check_email') {
    document.getElementById('loginMessage').innerHTML = '<div class="message success"><i class="fas fa-check-circle"></i> Account created! Please check your email for verification link.</div>';
  }
  if (urlParams.get('verified') === 'true') {
    document.getElementById('loginMessage').innerHTML = '<div class="message success"><i class="fas fa-check-circle"></i> Email verified! You can now login.</div>';
  }

  window.addEventListener('click', (e) => {
    const modal = document.getElementById('forgotModal');
    if (e.target === modal) closeForgotModal();
  });

  async function checkAuth() {
    try {
      const res = await fetch('/api/me');
      const user = await res.json();
      if (user && user.id) {
        window.location.href = getRedirectTarget();
      }
    } catch (error) {
      // Not logged in, stay on login page
    }
  }
  checkAuth();
</script>

</body>
</html>
