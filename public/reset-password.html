<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - Core Insight</title>
  <style>
    /* Same styles as login.html */
    :root { --primary-dark: #0f172a; --secondary-dark: #1e293b; --accent-gold: #FFD700; --text-light: #e0e0e0; --text-gray: #a0a0a0; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--primary-dark); color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .auth-container { background: var(--secondary-dark); padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
    h2 { text-align: center; margin-bottom: 2rem; background: linear-gradient(135deg, var(--accent-gold), #D4AF37); -webkit-background-clip: text; background-clip: text; color: transparent; }
    input { width: 100%; padding: 0.8rem; border: 1px solid var(--text-gray); border-radius: 8px; background: rgba(255,255,255,0.1); color: var(--text-light); margin-bottom: 1rem; }
    input:focus { outline: none; border-color: var(--accent-gold); }
    button { width: 100%; padding: 0.8rem; background: linear-gradient(135deg, var(--accent-gold), #D4AF37); color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .message { margin-top: 1rem; padding: 0.75rem; border-radius: 8px; text-align: center; }
    .success { background: rgba(0,255,0,0.1); color: lightgreen; }
    .error { background: rgba(255,0,0,0.1); color: lightcoral; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Set New Password</h2>
    <form id="resetPasswordForm">
      <input type="password" id="newPassword" placeholder="New Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
      <button type="submit">Reset Password</button>
    </form>
    <div id="resetMessage"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
        document.getElementById('resetMessage').innerHTML = '<div class="message error">❌ Invalid reset link</div>';
    }

    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const messageDiv = document.getElementById('resetMessage');
        const submitBtn = document.querySelector('button[type="submit"]');
        
        // Clear previous messages
        messageDiv.innerHTML = '';
        
        // Validation
        if (!newPassword || !confirmPassword) {
            messageDiv.innerHTML = '<div class="message error">❌ Please fill in all fields</div>';
            return;
        }

        if (newPassword.length < 8) {
            messageDiv.innerHTML = '<div class="message error">❌ Password must be at least 8 characters</div>';
            return;
        }

        if (newPassword !== confirmPassword) {
            messageDiv.innerHTML = '<div class="message error">❌ Passwords do not match</div>';
            return;
        }

        // Show loading state
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Resetting...';
        submitBtn.disabled = true;

        try {
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    token: token, 
                    password: newPassword  // Send as 'password' to match backend
                })
            });

            const data = await res.json();
            
            if (res.ok) {
                messageDiv.innerHTML = `<div class="message success">✅ ${data.message || 'Password reset successful!'}</div>`;
                
                // Clear form
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                
                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                messageDiv.innerHTML = `<div class="message error">❌ ${data.error || data.message || 'Error resetting password'}</div>`;
            }
        } catch (err) {
            messageDiv.innerHTML = '<div class="message error">❌ Network error. Please try again.</div>';
            console.error('Reset error:', err);
        } finally {
            // Reset button state
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });

    // Add password strength indicator (optional)
    document.getElementById('newPassword').addEventListener('input', function() {
        const password = this.value;
        const strengthIndicator = document.createElement('div');
        
        if (password.length > 0) {
            let strength = 'Weak';
            let color = '#ff4444';
            
            if (password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
                strength = 'Strong';
                color = '#00C851';
            } else if (password.length >= 6) {
                strength = 'Medium';
                color = '#ffbb33';
            }
            
            // Remove old indicator if exists
            const oldIndicator = document.getElementById('strength-indicator');
            if (oldIndicator) oldIndicator.remove();
            
            // Add new indicator
            const indicator = document.createElement('div');
            indicator.id = 'strength-indicator';
            indicator.style.cssText = `font-size: 12px; color: ${color}; margin-top: -10px; margin-bottom: 10px;`;
            indicator.textContent = `Password strength: ${strength}`;
            this.parentNode.insertBefore(indicator, this.nextSibling);
        }
    });
</script>
</body>
</html>
