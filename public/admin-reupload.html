<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Missing Course Files - Admin</title>
    <style>
        body {
            background: #0a192f;
            color: #e6f1ff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .course-card {
            background: #172a45;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #ff6b6b;
        }
        .course-card.fixed {
            border-left-color: #64ffda;
        }
        button {
            background: #64ffda;
            color: #0a192f;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
        }
        button.danger {
            background: #ff6b6b;
        }
        input, select {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #64ffda;
            background: #0a192f;
            color: white;
        }
        .success { color: #64ffda; }
        .error { color: #ff6b6b; }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Fix Missing Course Files</h1>
        <button onclick="fixPaths()">🔍 Auto-Fix File Paths</button>
        <button onclick="loadCourses()">🔄 Refresh</button>
        
        <div id="results" style="margin: 20px 0;"></div>
        <div id="courses"></div>
    </div>

    <script>
        async function fixPaths() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">Fixing paths...</div>';
            
            try {
                const res = await fetch('/api/admin/fix-all-paths');
                const data = await res.json();
                
                resultsDiv.innerHTML = `
                    <div class="success">
                        ✅ Fixed ${data.results.fixed.length} courses<br>
                        ⚠️ Need re-upload: ${data.results.need_reupload.length}
                    </div>
                `;
                
                loadCourses();
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function loadCourses() {
            const container = document.getElementById('courses');
            container.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const res = await fetch('/api/admin/fix-all-paths');
                const data = await res.json();
                
                if (data.results.need_reupload.length === 0 && data.results.fixed.length === 0) {
                    container.innerHTML = '<div class="success">✅ All courses have valid file paths!</div>';
                    return;
                }
                
                // Show courses that need re-upload
                const needReupload = data.results.need_reupload;
                if (needReupload.length > 0) {
                    container.innerHTML = `
                        <h2>📤 Courses Needing Re-upload (${needReupload.length})</h2>
                        ${needReupload.map(course => `
                            <div class="course-card">
                                <h3>${course.title}</h3>
                                <p>Expected file: ${course.db_filename || 'No file'}</p>
                                <form onsubmit="reuploadCourse(event, ${course.id})" enctype="multipart/form-data">
                                    <input type="file" name="file" required accept=".pdf,.epub,.mp4,.zip">
                                    <button type="submit">📤 Upload & Fix</button>
                                    <button type="button" class="danger" onclick="deleteCourse(${course.id})">🗑️ Delete Course</button>
                                </form>
                            </div>
                        `).join('')}
                    `;
                }
                
                // Show fixed courses
                const fixed = data.results.fixed;
                if (fixed.length > 0) {
                    const fixedHtml = `
                        <h2>✅ Fixed Courses (${fixed.length})</h2>
                        ${fixed.map(c => `
                            <div class="course-card fixed">
                                <h3>${c.title}</h3>
                                <p>Old: ${c.old_path}</p>
                                <p>New: ${c.new_path}</p>
                                <p>Match: ${c.match_type}</p>
                            </div>
                        `).join('')}
                    `;
                    container.innerHTML += fixedHtml;
                }
                
            } catch (error) {
                container.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function reuploadCourse(event, courseId) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            
            btn.textContent = 'Uploading...';
            btn.disabled = true;
            
            try {
                const res = await fetch(`/api/courses/${courseId}/reupload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('✅ ' + data.message);
                    loadCourses();
                } else {
                    alert('❌ Error: ' + (data.error || 'Upload failed'));
                }
            } catch (error) {
                alert('❌ Upload failed: ' + error.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
        
        async function deleteCourse(courseId) {
            if (!confirm('Are you sure you want to delete this course?')) return;
            
            try {
                const res = await fetch(`/api/courses/${courseId}`, {
                    method: 'DELETE'
                });
                
                if (res.ok) {
                    alert('✅ Course deleted');
                    loadCourses();
                } else {
                    const data = await res.json();
                    alert('❌ Error: ' + (data.error || 'Delete failed'));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }
        
        // Load on page load
        loadCourses();
    </script>
</body>
</html>
