<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Payment - Core Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            color: #e6f1ff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .bismillah {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
        }
        .bismillah .arabic {
            font-size: 1.5rem;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            color: #FFD700;
            display: block;
            margin-bottom: 0.3rem;
        }
        .bismillah .english {
            font-size: 0.85rem;
            color: rgba(255, 215, 0, 0.9);
        }
        .spinner {
            border: 4px solid #334155;
            border-top-color: #FFD700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .btn {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
        h2 { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="bismillah">
            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
        </div>
        <h2>Processing Your Payment...</h2>
        <div class="spinner"></div>
        <p id="message" style="color: #94a3b8;">Please wait while we verify your payment.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const transactionId = urlParams.get('transaction_id');
        const status = urlParams.get('status');
        
        if (status === 'successful' && transactionId) {
            window.location.href = `/services-payment-verification.html?transaction_id=${transactionId}`;
        } else {
            window.location.href = '/services-payment-failed.html';
        }
    </script>
</body>
</html>
