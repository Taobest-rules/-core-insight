<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Payment - Core Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a192f 0%, #1e1b4b 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .bismillah {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.25);
        }
        .bismillah .arabic {
            font-size: 1.5rem;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            color: #FFD700;
            display: block;
            margin-bottom: 0.3rem;
        }
        .bismillah .english {
            font-size: 0.85rem;
            color: rgba(255, 215, 0, 0.9);
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success-icon { font-size: 64px; color: #10b981; margin: 20px 0; }
        .error-icon { font-size: 64px; color: #ef4444; margin: 20px 0; }
        .btn {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f172a;
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
        h2 { margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="bismillah">
            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
        </div>
        <div id="status">
            <div class="spinner"></div>
            <h2>Verifying Payment...</h2>
            <p style="color: #94a3b8;">Please wait while we confirm your subscription.</p>
        </div>
    </div>

    <script>
        async function verifyPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const tx_ref = urlParams.get('tx_ref');
            const transaction_id = urlParams.get('transaction_id');
            
            if (status === 'successful' && tx_ref) {
                try {
                    const response = await fetch('/api/subscription/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            transaction_ref: tx_ref, 
                            status: 'successful' 
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        document.getElementById('status').innerHTML = `
                            <div class="bismillah">
                                <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                                <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                            </div>
                            <div class="success-icon">✅</div>
                            <h2>Subscription Activated!</h2>
                            <p>Your ${data.plan} subscription has been activated successfully.</p>
                            <p>Valid until: ${new Date(data.validUntil).toLocaleDateString()}</p>
                            <a href="/services.html" class="btn">Go to Dashboard</a>
                        `;
                    } else {
                        throw new Error(data.error || 'Verification failed');
                    }
                } catch (error) {
                    document.getElementById('status').innerHTML = `
                        <div class="bismillah">
                            <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                            <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                        </div>
                        <div class="error-icon">❌</div>
                        <h2>Verification Failed</h2>
                        <p>${error.message}</p>
                        <a href="/services.html" class="btn">Back to Dashboard</a>
                    `;
                }
            } else {
                document.getElementById('status').innerHTML = `
                    <div class="bismillah">
                        <span class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
                        <span class="english">In the name of Allah, the Most Gracious, the Most Merciful</span>
                    </div>
                    <div class="error-icon">❌</div>
                    <h2>Payment Cancelled</h2>
                    <p>Your subscription payment was not completed.</p>
                    <a href="/services.html" class="btn">Back to Dashboard</a>
                `;
            }
        }
        
        verifyPayment();
    </script>
</body>
</html>
